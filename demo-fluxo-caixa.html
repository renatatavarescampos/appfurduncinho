// puxa o que chegou pelos links e transforma em pedidos / cadastros
let _puxando = false;
async function puxarEnvios(){
  const N = NAPI(); if (!N || !me || !isAdmin() || _puxando) return;
  _puxando = true;
  try{
    // apagar devolvendo as linhas = cada envio só é puxado uma vez, mesmo com duas pessoas com o app aberto
    const rows = await N.api('DELETE', '/rest/v1/envios?dados_id=eq.' + encodeURIComponent(N.dadosId()) + '&select=*', null, {'Prefer':'return=representation'}) || [];
    if (!rows.length) return;
    let np = 0, nc = 0;
    rows.sort((a,b)=>String(a.criado_em).localeCompare(String(b.criado_em))).forEach(r=>{
      const c = r.conteudo || {}, t = k => String(c[k] ?? '').trim().slice(0, 500);
      const sol = c.solicitante || {}, solU = sol.usuarioId && db.users.find(u=>u.id===sol.usuarioId), solNome = (solU ? solU.nome : String(sol.nome||'').trim().slice(0,120)) || 'Sem nome', solCont = solU ? (solU.tel || solU.email || '') : String(sol.contato||'').trim().slice(0,120);
      const pessoaDe = np0 => {
        if (!np0) return null;
        const d = k => String(np0[k] ?? '').trim().slice(0, 200), dig = d('doc').replace(/\D/g,'');
        const ja = (dig && db.pessoas.find(p => (p.doc||'').replace(/\D/g,'') === dig)) || (!dig && d('nome') && db.pessoas.find(p => (p.nome||'').trim().toLowerCase() === d('nome').toLowerCase()));
        if (ja) return ja;
        const novo = {id:uid('p'), nome:d('nome')||'Sem nome', doc:formatarDoc(dig), funcao:d('funcao'), tel:d('tel'), email:d('email'), banco:d('banco'), agencia:d('agencia'), conta:d('conta'),
          tipoConta:d('tipoConta'), pixTipo:tipoPix(d('pix')), pix:d('pix'), origem:'autocadastro', convidadoPor:me.id, cadastradoEm:agoraSeg()};
        db.pessoas.push(novo);
        db.alteracoes.push({id:uid('a'), pessoaId:novo.id, tipo:'autocadastro', campos:[], antes:{}, depois:{}, quem:'externo', convite:me.id, quando:agoraSeg()});
        nc++; return novo;
      };
      if (r.tipo === 'cadastro'){ pessoaDe(c.pessoa || c); return; }
      // planilha importada: um envio com várias linhas vira um pedido por linha
      const lista = Array.isArray(c.itens) ? c.itens.slice(0, 300).map(it=>({...c, ...(it||{}), itens:undefined})) : [c];
      lista.forEach(c=>{
      const t = k => String(c[k] ?? '').trim().slice(0, 500);
      // favorecido escolhido na lista: pelo id; se o id não existir aqui (lista do link de outra cópia), pelo CPF/CNPJ resumido ou pelo nome; em último caso cadastra com o nome e o PIX
      const nomeF = String(c.pessoaNome||'').trim().slice(0,200), kN = x => semAcento(String(x||'')).replace(/\s+/g,' ').trim();
      const pes = (c.pessoaId && db.pessoas.find(p=>p.id===c.pessoaId))
        || (c.pessoaDh && db.pessoas.find(p=>p.doc && docResumo(p.doc)===c.pessoaDh))
        || (nomeF && db.pessoas.find(p=>kN(p.nome)===kN(nomeF)))
        || pessoaDe(c.novaPessoa || (nomeF ? {nome:nomeF, pix:String(c.pessoaPix||'')} : null));
      const valor = Math.max(0, Math.round(Number(c.valor)*100)/100) || 0;
      const jaPago = c.situacao === 'pago', pagoEm = /^\d{4}-\d{2}-\d{2}$/.test(t('pagoEm')) ? t('pagoEm') : HOJE;
      const anexos = (Array.isArray(c.anexos) ? c.anexos : []).slice(0, 5).filter(a=>a && typeof a.caminho==='string' && a.caminho.indexOf(N.dadosId()+'/')===0)
        .map(a=>({nome:String(a.nome||'arquivo').slice(0,120), caminho:a.caminho, tipo:String(a.tipo||'').slice(0,80), tamanho:+a.tamanho||0}));
      const p = {id:'PG-'+String(db.seq++).padStart(4,'0'), eventoId: db.eventos.some(e=>e.id===c.eventoId) ? c.eventoId : '', pessoaId: pes ? pes.id : '',
        categoria:t('categoria'), valor, vencimento: /^\d{4}-\d{2}-\d{2}$/.test(t('vencimento')) ? t('vencimento') : HOJE, forma: FORMAS.includes(t('forma')) ? t('forma') : FORMAS[0],
        descricao:t('descricao'), link:urlOk(t('link')), centroCusto:'', extras:{}, status: jaPago ? 'pago' : 'aguardando', ...(jaPago?{pagoEm}:{}), criadoPor:me.id, criadoEm:HOJE,
        solicitante:{nome:solNome, contato:solCont, ...(solU?{usuarioId:solU.id}:{})}, anexos,
        historico:[{quando:agora(), quem:me.id, acao:`Recebido pelo formulário por link — enviado por ${solNome}${solCont?' ('+solCont+')':''}` + (c.importado ? ` · importado da planilha ${String(c.importado).slice(0,80)}` : '') + (c.colado ? ' · colado de uma mensagem do WhatsApp' : '') + (jaPago ? ` · informado como já pago em ${fmt(pagoEm)}` : ' · solicitação de pagamento')}]};
      db.pedidos.push(p); np++;
      });
    });
    save(); render();
    const partes = []; if (np) partes.push(np + (np>1?' pedidos chegaram':' pedido chegou') + ' pelo link'); if (nc) partes.push(nc + (nc>1?' cadastros novos':' cadastro novo'));
    if (partes.length) toast('📥 ' + partes.join(' e '));
  }catch(e){ console.warn('[form] envios', e); }
  finally{ _puxando = false; }
}

// Junta as SAÍDAS (pedidos de pagamento) e as ENTRADAS (recebimentos) dos eventos.
// Realizado = o que já saiu/entrou no banco. Previsto = o que ainda vai sair/entrar (pela data prevista).
const ORIGENS = ['Bilheteria','Bar','Patrocínio','Repasse de plataforma','Aluguel de espaço','Outros'];
// lista de origens: as padrão + as criadas (＋ Nova origem…) + as que já estão em algum recebimento; "Outros" fica por último
const origens = () => { const l = [...new Set([...ORIGENS.filter(o=>o!=='Outros'), ...(db.origens||[]), ...(db.recebimentos||[]).map(r=>r.origem)].filter(Boolean))]; return [...l.filter(o=>o!=='Outros'), 'Outros']; };
let LF = {cc:'', serie:''}; // filtros do gráfico de lucro
let FC = {ano:[String(new Date().getFullYear())], mes:[], evento:[], situacao:[], aba:'resumo', diario:null, dia:null};
function seedRecebimentos(eventos, pedidos){
  // Exemplo: receita de cada evento calculada a partir dos custos dele (alguns dão lucro, outros prejuízo)
  const r = rng(11), lista = []; let n = 1;
  const add = (ev, origem, descricao, valor, previsto, forma) => {
    const recebido = previsto <= HOJE;
    lista.push({id:'RC-'+String(n++).padStart(4,'0'), eventoId:ev.id, origem, descricao, valor:Math.max(50,Math.round(valor/50)*50), previsto, forma,
      recebidoEm: recebido ? previsto : '', historico:[{quando:addDias(previsto,-15)+'T09:00',quem:'u1',acao:'Lançou o recebimento'}]
        .concat(recebido?[{quando:previsto+'T14:00',quem:'u1',acao:'Marcou como recebido'}]:[])});
  };
  for (const ev of eventos){
    const custo = (pedidos||[]).filter(p=>p.eventoId===ev.id && !['recusado','cancelado'].includes(p.status)).reduce((a,p)=>a+p.valor,0) || ev.orcamento*0.6;
    const receita = custo * (0.85 + r()*0.65), pat = r()<0.6 ? 0.08+r()*0.07 : 0;
    add(ev,'Bilheteria','Venda antecipada de ingressos — 1º lote', receita*0.3, addDias(ev.data,-12),'Transferência');
    add(ev,'Bilheteria','Repasse da bilheteria (portaria e último lote)', receita*(0.27-pat/2), addDias(ev.data,7),'Transferência');
    add(ev,'Bar','Vendas do bar — cartão (D+2)', receita*(0.35-pat/2), addDias(ev.data,2),'Transferência');
    add(ev,'Bar','Vendas do bar — PIX e dinheiro', receita*0.08, addDias(ev.data,1),'PIX');
    if (pat) add(ev,'Patrocínio','Cota de patrocínio', receita*pat, addDias(ev.data,-20),'Boleto');
  }
  return lista;
}
const recebimento = id => db.recebimentos.find(x=>x.id===id);
const SIT = {
  pago:{nome:'Pago',cor:'var(--pago)'}, apagar:{nome:'A pagar',cor:'var(--aprovado)'}, aguardando:{nome:'Aguardando aprovação',cor:'var(--aguardando)'},
  recebido:{nome:'Recebido',cor:'var(--pago)'}, areceber:{nome:'A receber',cor:'var(--aprovado)'}, atrasado:{nome:'Atrasado',cor:'var(--recusado)'}, recusado:{nome:'Recusado',cor:'var(--recusado)'}
};
// Movimentos do fluxo: cada pagamento e recebimento vira {tipo, data, valor, realizado, ...}
function movimentosFluxo(){
  const pags = db.pedidos.filter(p=>['pago','aprovado','aguardando'].includes(p.status)).map(p=>{
    const pago = p.status==='pago';
    const data = pago ? (p.conc?.data || p.pagoEm || dataPagamento(p).slice(0,10) || p.vencimento) : p.vencimento;
    const sit = pago ? 'pago' : p.status==='aguardando' ? 'aguardando' : (p.vencimento < HOJE ? 'atrasado' : 'apagar');
    return {tipo:'saida', ref:p, id:p.id, eventoId:p.eventoId, data, valor:p.valor, realizado:pago, sit};
  });
  const recs = db.recebimentos.filter(x=>x.status!=='cancelado').map(x=>({tipo:'entrada', ref:x, id:x.id, eventoId:x.eventoId, data:x.recebidoEm || x.previsto, valor:x.valor,
    realizado:!!x.recebidoEm, sit: x.recebidoEm ? 'recebido' : (x.previsto < HOJE ? 'atrasado' : 'areceber')}));
  return pags.concat(recs);
}
const passaFC = (m, {periodo=true}={}) =>
  (!periodo || passa(FC.ano, m.data.slice(0,4))) && (!periodo || passa(FC.mes, m.data.slice(5,7))) &&
  passa(FC.evento, m.eventoId) && passa(FC.situacao, m.realizado?'realizado':'previsto');

const tagSit = s => `<span class="tag" style="background:${SIT[s].cor}">${SIT[s].nome}</span>`;

    ${filtroFC('evento','Todos os eventos',[...db.eventos].sort((a,b)=>b.data.localeCompare(a.data)).map(e=>[e.id,e.nome+' · '+fmt(e.data)]))}
    ${filtroFC('situacao','Realizado e previsto',[['realizado','Realizado (já no banco)'],['previsto','Previsto (a pagar / a receber)']])}

    ${kpi('A pagar', aPag, n('saida',false)+' pagamentos (aprovados + aguardando)', 'var(--aguardando)', 'pagamentos')}
    ${kpi('Saldo projetado', ent+aRec-sai-aPag, 'realizado + previsto', '', '')}
  </div>

}

function fluxoResumo(lista, todos){
  // Mês a mês: usa os anos do filtro (ou o ano atual) e ignora o filtro de mês para mostrar o ano inteiro
  const anosSel = FC.ano.length ? [...FC.ano].sort() : [...new Set(todos.map(m=>m.data.slice(0,4)))].sort();
  const base = todos.filter(m=>passaFC(m,{periodo:false}));
  const meses = []; anosSel.forEach(a => MESES.forEach((m,i)=>{ const mm=String(i+1).padStart(2,'0');
    const ms = base.filter(x=>x.data.slice(0,7)===a+'-'+mm), s=(t,r)=>ms.filter(x=>x.tipo===t&&x.realizado===r).reduce((q,x)=>q+x.valor,0);
    meses.push({a, mm, nome:m+(anosSel.length>1?'/'+a.slice(2):''), entR:s('entrada',true), entP:s('entrada',false), saiR:s('saida',true), saiP:s('saida',false)}); }));
  // saldo acumulado começa com tudo o que aconteceu antes do 1º mês mostrado
  const ini = anosSel[0]+'-01';
  const saldoInicial = saldoAntes(base, ini);
  meses.forEach(x=>{ x.saldo = x.entR+x.entP-x.saiR-x.saiP; const pm=new Date(+x.a, +x.mm, 1); x.acum = saldoAntes(base, pm.getFullYear()+'-'+String(pm.getMonth()+1).padStart(2,'0')+'-01'); });
  const max = Math.max(1,...meses.map(x=>Math.max(x.entR+x.entP, x.saiR+x.saiP)));
  const col = (r,p,cor,t) => `<div class="fc-col" title="${t}"><div class="seg" style="height:${p/max*100}%;background:${cor};opacity:.35"></div><div class="seg" style="height:${r/max*100}%;background:${cor}"></div></div>`;
  // Por evento: eventos que têm movimento no período filtrado, com o resultado COMPLETO do evento (todas as datas)
  const evIds = [...new Set(lista.map(m=>m.eventoId))];
  const porEv = evIds.map(id=>{ const ms=base.filter(m=>m.eventoId===id), s=(t,r)=>ms.filter(x=>x.tipo===t&&(r===undefined||x.realizado===r)).reduce((q,x)=>q+x.valor,0);
    return {e:evento(id), ent:s('entrada'), sai:s('saida'), entR:s('entrada',true), saiR:s('saida',true)}; }).sort((a,b)=>(b.e.data||'').localeCompare(a.e.data||''));
  const tEnt = porEv.reduce((a,x)=>a+x.ent,0), tSai = porEv.reduce((a,x)=>a+x.sai,0);
  return `<div class="panel"><div class="toolbar" style="margin:0 0 4px"><b>Entradas × saídas mês a mês — ${anosSel.join(' + ')}</b><div class="spacer"></div>
    <div class="legend"><span><span class="dot" style="background:var(--pago)"></span>Entradas</span><span><span class="dot" style="background:var(--recusado)"></span>Saídas</span><span><span class="dot" style="background:#0026208c;opacity:.4"></span>Mais claro = previsto</span></div></div>
    <div class="fc-chart">${meses.map(x=>`<div class="fc-mes ${FC.diario===x.a+'-'+x.mm?'sel':''}" data-act="fcMes" data-id="${x.a}-${x.mm}" title="${x.nome} — clique para ver o diário">
      <div class="fc-par">${col(x.entR,x.entP,'var(--pago)',`Entradas: ${brl(x.entR)} recebido + ${brl(x.entP)} previsto`)}${col(x.saiR,x.saiP,'var(--recusado)',`Saídas: ${brl(x.saiR)} pago + ${brl(x.saiP)} previsto`)}</div>
      <div class="lab">${x.nome}</div></div>`).join('')}</div>
    ${FC.diario ? fluxoDiario(base) : `<div style="overflow-x:auto;margin-top:14px"><table class="cards"><thead><tr><th>Mês</th><th class="right">Recebido</th><th class="right">A receber</th><th class="right">Pago</th><th class="right">A pagar</th><th class="right">Saldo do mês</th><th class="right">Saldo acumulado</th></tr></thead><tbody>
      ${saldoInicial?`<tr><td class="meta">Saldo anterior</td><td></td><td></td><td></td><td></td><td></td><td class="right"><b>${brl(saldoInicial)}</b></td></tr>`:''}
      ${meses.map(x=>`<tr class="click" data-act="fcMes" data-id="${x.a}-${x.mm}" title="Ver o diário de ${x.nome}"><td>${x.nome}</td><td class="right" style="color:#002620">${brl(x.entR)}</td><td class="right meta">${brl(x.entP)}</td><td class="right" style="color:#ef4444">${brl(x.saiR)}</td><td class="right meta">${brl(x.saiP)}</td>
        <td class="right" style="font-weight:600;color:${x.saldo<0?'var(--recusado)':'inherit'}">${brl(x.saldo)}</td><td class="right" style="font-weight:700;color:${x.acum<0?'var(--recusado)':'inherit'}">${brl(x.acum)}</td></tr>`).join('')}

    <p class="meta" style="margin:8px 0 0">O gráfico e a tabela mostram o ano inteiro (com o filtro de eventos e de realizado/previsto). <b>Clique em um mês para abrir o diário</b> (dia a dia).</p>`}</div>

      <td class="right" style="font-weight:700;color:${res<0?'var(--recusado)':'var(--pago)'}">${brl(res)}</td><td class="right">${x.ent?mg.toFixed(0)+'%':'—'}</td><td class="right meta">${brl(x.entR-x.saiR)}</td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">Nenhuma movimentação com esses filtros</td></tr>'}
    </tbody>${porEv.length?`<tfoot><tr><td colspan="2"><b>Total</b></td><td class="right"><b>${brl(tEnt)}</b></td><td class="right"><b>${brl(tSai)}</b></td><td class="right"><b style="color:${tEnt-tSai<0?'var(--recusado)':'var(--pago)'}">${brl(tEnt-tSai)}</b></td><td class="right">${tEnt?((tEnt-tSai)/tEnt*100).toFixed(0)+'%':'—'}</td><td></td></tr></tfoot>`:''}</table></div>`;
}

// Diário em formato de planilha: dias nas colunas.
// Topo: saldo inicial, recebimentos (a vencer / recebido / atrasado), total de recebimentos, total de pagamentos,
// pagamentos atrasados e saldo final. Depois: entradas por centro de custo (evento) e saídas por categoria
// (somando todos os centros de custo). O filtro "Centro de custo" mostra só as entradas e saídas daquele evento.
// Como na planilha de referência, os atrasados aparecem em linhas próprias, mas não entram nos totais nem no saldo.
const DSEM = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const FC_LINHAS = {
  'av':  {nome:'A vencer',              f:m=>m.tipo==='entrada' && m.sit==='areceber'},
  'rec': {nome:'Recebido',              f:m=>m.tipo==='entrada' && m.sit==='recebido'},
  'atr': {nome:'Atrasado',              f:m=>m.tipo==='entrada' && m.sit==='atrasado'},
  'trec':{nome:'Total de recebimentos', f:m=>m.tipo==='entrada' && m.sit!=='atrasado'},
  'tpag':{nome:'Total pagamentos',      f:m=>m.tipo==='saida' && m.sit!=='atrasado'},
  'patr':{nome:'Pagamentos atrasados',  f:m=>m.tipo==='saida' && m.sit==='atrasado'}
};
function fcLinha(key){
  if (FC_LINHAS[key]) return FC_LINHAS[key];
  const v = key.slice(key.indexOf('|')+1);
  if (key.startsWith('ev|'))  return {nome:'Entradas — '+evento(v).nome, f:m=>m.tipo==='entrada' && m.sit!=='atrasado' && m.eventoId===v};
  if (key.startsWith('cat|')) return {nome:'Saídas — '+key.slice(4), f:m=>m.tipo==='saida' && m.sit!=='atrasado' && m.ref.categoria===v};
  return null;
}
const fcC0 = t => t.replace(/,00$/, '<span class="c0">,00</span>');   // na visão compacta o ",00" some (o valor continua exato)
const fcNum = v => v ? fcC0(v.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2})) : '-';
const fcSaldo = v => fcC0((v||0).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}));
// Saldo inicial informado pela gestora: saldo das contas no começo do dia "data".
// A partir dessa data o saldo parte dele; o que aconteceu antes não entra mais na conta.
const saldoInfo = () => { const x=db.saldoInicial; if(!x||!x.data||FC.evento.length) return null; return {data:x.data, valor:Object.values(x.contas||{}).reduce((a,v)=>a+(+v||0),0)}; };
const saldoAntes = (movs, dia) => { const si=saldoInfo(); const de = si && si.data<=dia ? si.data : '';
  return (de?si.valor:0) + movs.filter(x=>x.data<dia && x.data>=de).reduce((q,x)=>q+(x.tipo==='entrada'?x.valor:-x.valor),0); };
function formSaldoInicial(){
  const x = db.saldoInicial||{}, contas = [...new Set([...contasBanco(), ...Object.keys(x.contas||{})])];
  if (!contas.length) contas.push('Conta principal');
  modal(`<h3>🏦 Saldo inicial</h3>
  <p class="meta" style="margin-top:0">Informe quanto havia em cada conta no <b>começo do dia</b> escolhido. O fluxo de caixa passa a partir desse saldo; o que aconteceu antes dessa data não entra mais na conta.</p>
  <form class="form" id="fSaldo"><label class="full">Saldo no início do dia *<input type="date" name="data" required value="${x.data||HOJE.slice(0,8)+'01'}"></label>
  ${contas.map((c,i)=>`<label class="full">${h(c)}<input name="c${i}" data-conta="${h(c)}" inputmode="decimal" placeholder="0,00" value="${x.contas&&x.contas[c]!=null?String(x.contas[c]).replace('.',','):''}"></label>`).join('')}
  <label class="full">Outra conta ou caixa (nome)<input name="novaNome" placeholder="Ex.: Caixa da empresa"></label><label class="full">Valor dessa conta<input name="novaValor" inputmode="decimal" placeholder="0,00"></label></form>
  <div class="actions">${db.saldoInicial?'<button class="btn bad" data-act="saldoIniLimpar">Remover saldo inicial</button>':''}<div class="spacer"></div><button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="saldoIniOk">Salvar</button></div>`, 520);
}
// Diário: a tabela diminui sozinha para caber na largura da tela (sem rolar para o lado); em tela cheia ocupa toda a altura
function fcAjustar(){
  const pl = document.querySelector('.fc-plan'), t = pl && pl.querySelector('table'); if (!t) return;
  t.style.zoom = 1; pl.classList.remove('compacto');
  if (t.scrollWidth > pl.clientWidth) pl.classList.add('compacto');   // primeiro aperta as colunas; se ainda não couber, diminui a escala
  const auto = Math.max(0.5, Math.min(1, (pl.clientWidth - 16) / t.scrollWidth));
  const z = FC.zoom || auto;   // FC.zoom: escolhido nos botões − / +; vazio = ajustar à tela
  t.style.zoom = Math.abs(z-1) > 0.001 ? z.toFixed(3) : '';
  const lb = document.getElementById('fcZoomTxt'); if (lb) lb.textContent = Math.round(z*100)+'%' + (FC.zoom ? '' : ' (ajustado)');
}
addEventListener('resize', () => { clearTimeout(fcAjustar._t); fcAjustar._t = setTimeout(fcAjustar, 120); });
function fluxoDiario(base){
  const ym = FC.diario, [a,m] = ym.split('-');
  const doMes = base.filter(x=>x.data.slice(0,7)===ym);
  const conta = x => x.sit!=='atrasado';                     // atrasados não entram no saldo
  const saldoIni = saldoAntes(base.filter(conta), ym+'-01'), si = saldoInfo();
  const nDias = new Date(+a, +m, 0).getDate();
  const dias = Array.from({length:nDias}, (_,i)=>ym+'-'+String(i+1).padStart(2,'0'));
  const soma = (f, dt) => doMes.filter(x=>(!dt || x.data===dt) && f(x)).reduce((q,x)=>q+x.valor,0);
  // saldo inicial / final de cada dia
  let s = saldoIni; const ini = {}, fim = {};
  dias.forEach(d=>{ if (si && d===si.data) s = si.valor; ini[d]=s; s += soma(FC_LINHAS.trec.f,d) - soma(FC_LINHAS.tpag.f,d); fim[d]=s; });
  const cel = (key, f, cls='') => dias.map(d=>{ const v=soma(f,d); return `<td class="right ${cls} ${d===HOJE?'hj':''} ${v?'click':''}" ${v?`data-act="fcCel" data-id="${d}" data-arg="${h(key)}"`:''}>${fcNum(v)}</td>`; }).join('')
    + (()=>{ const v=soma(f); return `<td class="right tot ${v?'click':''}" ${v?`data-act="fcCel" data-id="${ym}" data-arg="${h(key)}"`:''}>${fcNum(v)}</td>`; })();
  const linha = (key, cls='', nome) => { const L=fcLinha(key); return `<tr class="${cls}"><th class="fc-rot">${h(nome||L.nome)}</th>${cel(key,L.f)}</tr>`; };
  const secao = (t, cls) => `<tr class="${cls}"><th class="fc-rot">${t}</th>${dias.map(d=>`<td class="${d===HOJE?'hj':''}"></td>`).join('')}<td class="tot"></td></tr>`;

    ${FC.evento.length?`<div class="note" style="margin:0 0 8px;background:var(--brand-soft);border-color:#efbb3c;color:var(--brand)">Mostrando só <b>${FC.evento.map(id=>h(evento(id).nome)).join(', ')}</b>: entradas e saídas desse centro de custo em ${MESES[+m-1]}/${a}. O saldo inicial também considera só esse centro de custo.</div>`:''}
    <div class="fc-plan"><table>
      <thead><tr><th class="fc-rot click" data-act="formSaldoInicial" title="Clique para informar o saldo inicial">Saldo inicial ✏️<br><b style="font-size:14px;color:${saldoIni<0?'var(--recusado)':'var(--text)'}">${fcSaldo(saldoIni)}</b></th>
        ${dias.map(d=>{ const dd=new Date(d+'T12:00:00'); return `<th class="right ${d===HOJE?'hj':''} ${[0,6].includes(dd.getDay())?'fds':''}"><span class="dl">${DSEM[dd.getDay()]}</span><span class="dc">${DSEM[dd.getDay()].slice(0,3)}</span><br><b><span class="dl">${fmt(d)}</span><span class="dc">${fmt(d).slice(0,5)}</span></b>${d===HOJE?'<br><span class="tag" style="background:var(--brand)">hoje</span>':''}</th>`; }).join('')}
        <th class="right tot">Total<br><b>${MESES[+m-1]}/${a}</b></th></tr></thead>
      <tbody>
        <tr class="r-ini"><th class="fc-rot">Saldo inicial do dia</th>${dias.map(d=>`<td class="right ${d===HOJE?'hj':''}">${fcSaldo(ini[d])}</td>`).join('')}<td class="right tot">${fcSaldo(saldoIni)}</td></tr>
        ${secao('Total previsão','r-sec')}
        ${linha('av')}${linha('rec')}${linha('atr','r-atr')}
        ${linha('trec','r-sec')}
        ${linha('tpag','r-pag')}

        ${evs.map(e=>linha('ev|'+e.id,'',e.nome)).join('') || `<tr><th class="fc-rot meta">Nenhuma entrada no mês</th><td colspan="${nDias+1}"></td></tr>`}
        ${secao('▼ Saídas por categoria','r-sec r-sai')}

function fcCelula(id, key){
  const L = fcLinha(key); if (!L) return;
  const base = movimentosFluxo().filter(m=>passaFC(m,{periodo:false}));
  const xs = base.filter(x=>(id.length===7 ? x.data.slice(0,7)===id : x.data===id) && L.f(x)).sort((p,q)=>p.data.localeCompare(q.data)||q.valor-p.valor);
  const tot = xs.reduce((q,x)=>q+x.valor,0);
  modal(`<h3>${h(L.nome)} · ${id.length===7?MESES[+id.slice(5)-1]+'/'+id.slice(0,4):fmt(id)}</h3>
  <div style="overflow-x:auto"><table class="cards"><thead><tr><th>Data</th><th>Nº</th><th>Centro de custo</th><th>Favorecido / origem</th><th>Situação</th><th class="right">Valor</th></tr></thead><tbody>
  ${xs.map(x=>{ const r=x.ref, ent=x.tipo==='entrada'; return `<tr class="click" data-act="${ent?'formReceb':'ver'}" data-id="${r.id}"><td>${fmt(x.data)}</td><td>${r.id}</td><td>${h(evento(r.eventoId).nome)}</td>
    <td style="white-space:normal">${h(ent?r.origem+' — '+r.descricao:pessoa(r.pessoaId).nome+' — '+r.categoria)}</td><td>${tagSit(x.sit)}</td><td class="right" style="font-weight:600;color:${ent?'#002620':'#ef4444'}">${brl(r.valor)}</td></tr>`; }).join('')}
  </tbody><tfoot><tr><td colspan="5"><b>${xs.length} lançamento(s)</b></td><td class="right"><b>${brl(tot)}</b></td></tr></tfoot></table></div>
  <div class="actions"><button class="btn" data-act="fechar">Fechar</button></div>`, 820);
}
function csvDiario(){
  const ym = FC.diario; if (!ym) return;
  const div = document.createElement('div'); div.innerHTML = fluxoDiario(movimentosFluxo().filter(m=>passaFC(m,{periodo:false})));
  div.querySelectorAll('.dc').forEach(e=>e.remove()); div.querySelectorAll('br').forEach(e=>e.replaceWith(' '));   // no Excel vai o cabeçalho completo
  const linhas = [...div.querySelectorAll('.fc-plan tr')].map(tr=>[...tr.cells].map(c=>c.innerText.replace(/\s*\n\s*/g,' ').trim()));
  const csv = '﻿'+linhas.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'diario '+ym+(FC.evento.length?' - '+FC.evento.map(id=>evento(id).nome).join(', '):'')+'.csv'; a.click();
}

function fluxoPagamentos(lista){
  const ps = lista.filter(m=>m.tipo==='saida').sort((a,b)=>b.data.localeCompare(a.data));
  const tot = ps.reduce((a,m)=>a+m.valor,0);
  return `<div class="panel"><table class="filtravel cards" data-key="fcPag"><thead><tr><th>Data</th><th>Nº</th><th>Evento</th><th>Favorecido</th><th>Categoria</th><th>Forma</th><th>Situação</th><th class="right">Valor</th></tr></thead>
  <tbody>${ps.map(m=>{ const p=m.ref; return `<tr class="click" data-act="ver" data-id="${p.id}" data-valor="${p.valor}"><td data-v="${fmt(m.data)}">${fmt(m.data)}${m.realizado?'':'<br><span class="meta">vencimento</span>'}</td><td>${p.id}</td><td>${h(evento(p.eventoId).nome)}</td><td>${h(pessoa(p.pessoaId).nome)}</td><td>${h(p.categoria)}</td><td>${h(p.forma)}</td>
    <td data-v="${SIT[m.sit].nome}">${tagSit(m.sit)}${p.conc?' <span title="Conciliado com o banco">🏦✓</span>':''}</td><td class="right">${brl(p.valor)}</td></tr>`; }).join('') || '<tr><td colspan="8" class="empty">Nenhum pagamento com esses filtros</td></tr>'}</tbody>
  <tfoot><tr><td colspan="7"><b data-cnt="pagamentos">${ps.length} pagamentos</b> · pagos, aprovados a pagar e aguardando aprovação (sem recusados/cancelados)</td><td class="right"><b data-tot>${brl(tot)}</b></td></tr></tfoot></table></div>`;
}

  const rs = lista.filter(m=>m.tipo==='entrada').sort((a,b)=>b.data.localeCompare(a.data));

function csvFluxo(){
  const lista = movimentosFluxo().filter(m=>passaFC(m)).filter(m=>FC.aba==='resumo' || (FC.aba==='pagamentos')===(m.tipo==='saida')).sort((a,b)=>a.data.localeCompare(b.data));
  const linhas = [['Data','Tipo','Nº','Evento','Favorecido / Origem','Categoria / Descrição','Forma','Situação','Entrada','Saída']];
  const num = v => v.toFixed(2).replace('.',',');
  lista.forEach(m=>{ const x=m.ref, ent=m.tipo==='entrada';
    linhas.push([fmt(m.data), ent?'Recebimento':'Pagamento', x.id, evento(x.eventoId).nome, ent?x.origem:pessoa(x.pessoaId).nome, ent?x.descricao:x.categoria, x.forma, SIT[m.sit].nome, ent?num(x.valor):'', ent?'':num(x.valor)]); });
  const csv = '﻿'+linhas.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'fluxo de caixa - '+({resumo:'completo',pagamentos:'pagamentos',recebimentos:'recebimentos'})[FC.aba]+'.csv'; a.click();
}

    <p style="color:var(--muted);margin:0 0 10px">Total: <b style="color:var(--text)">${brl(tot)}</b>. As contas somem da lista, do dashboard e do fluxo de caixa. Se alguma estava conciliada, o lançamento do extrato volta a ficar pendente. <b>Essa ação não pode ser desfeita.</b></p>
    <div style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px">${ps.map(p=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0"><span>${h(p.id)} · ${h(pessoa(p.pessoaId).nome||'')} · ${h(evento(p.eventoId).nome)}</span><b>${brl(p.valor)}</b></div>`).join('')}</div>
    <div class="actions"><button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" style="background:var(--recusado);border-color:var(--recusado)" data-act="confirmarExcluirSel" data-id="${ids.join(',')}">Excluir ${ps.length} conta${ps.length>1?'s':''}</button></div>`, 520); },
  confirmarExcluirSel: idsTxt => { if(!isAdmin()) return; const ids = String(idsTxt||'').split(',').filter(Boolean);
    db.pedidos = db.pedidos.filter(p=>!ids.includes(p.id));
    (db.extrato||[]).forEach(t=>{ if(ids.includes(t.pedidoId)) delete t.pedidoId; });
    ids.forEach(id=>SEL.delete(id)); save(); fechar(); render(); toast(ids.length+(ids.length>1?' contas excluídas':' conta excluída')); },
  excluirSelReceb: () => { if(!isAdmin()) return;
    const ids = selVisiveis().filter(c=>c.checked).map(c=>c.dataset.sel); if(!ids.length) return;
    const rs = (db.recebimentos||[]).filter(x=>ids.includes(x.id)), tot = rs.reduce((a,x)=>a+x.valor,0);
    modal(`<h3>Excluir ${rs.length} recebimento${rs.length>1?'s':''}?</h3>
    <p style="color:var(--muted);margin:0 0 10px">Total: <b style="color:var(--text)">${brl(tot)}</b>. Os recebimentos somem da lista, do dashboard e do fluxo de caixa. <b>Essa ação não pode ser desfeita.</b></p>
    <div style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px">${rs.map(x=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0"><span>${h(x.id)} · ${h(x.descricao||'')} · ${h(evento(x.eventoId).nome)}</span><b>${brl(x.valor)}</b></div>`).join('')}</div>
    <div class="actions"><button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" style="background:var(--recusado);border-color:var(--recusado)" data-act="confirmarExcluirSelReceb" data-id="${ids.join(',')}">Excluir ${rs.length} recebimento${rs.length>1?'s':''}</button></div>`, 520); },
  confirmarExcluirSelReceb: idsTxt => { if(!isAdmin()) return; const ids = String(idsTxt||'').split(',').filter(Boolean);
    db.recebimentos = (db.recebimentos||[]).filter(x=>!ids.includes(x.id));
    ids.forEach(id=>SEL.delete(id)); save(); fechar(); render(); toast(ids.length+(ids.length>1?' recebimentos excluídos':' recebimento excluído')); },
  excluirSelEventos: () => { if(!isAdmin()) return;
    const ids = selVisiveis().filter(c=>c.checked).map(c=>c.dataset.sel); if(!ids.length) return;
    const usos = e => db.pedidos.filter(p=>p.eventoId===e.id).length + (db.recebimentos||[]).filter(x=>x.eventoId===e.id).length;
    const evs = db.eventos.filter(e=>ids.includes(e.id)), livres = evs.filter(e=>!usos(e)), presos = evs.filter(e=>usos(e));
    const linha = (e, extra) => `<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0"><span>${h(e.nome)} · ${fmt(e.data)}</span>${extra}</div>`;
    modal(`<h3>Excluir ${livres.length} evento${livres.length!==1?'s':''}?</h3>
    ${livres.length?`<p style="color:var(--muted);margin:0 0 10px">Os eventos somem da lista e dos filtros. <b>Essa ação não pode ser desfeita.</b></p>
    <div style="max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px">${livres.map(e=>linha(e,'')).join('')}</div>`:''}
    ${presos.length?`<p style="color:var(--muted);margin:12px 0 6px">${presos.length>1?'Estes eventos não serão excluídos porque têm':'Este evento não será excluído porque tem'} contas a pagar ou a receber. Exclua as contas antes.</p>
    <div style="max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted)">${presos.map(e=>linha(e,`<span>${usos(e)} conta${usos(e)>1?'s':''}</span>`)).join('')}</div>`:''}
    <div class="actions"><button class="btn" data-act="fechar">${livres.length?'Cancelar':'Ok'}</button>${livres.length?`<button class="btn pri" style="background:var(--recusado);border-color:var(--recusado)" data-act="confirmarExcluirSelEventos" data-id="${livres.map(e=>e.id).join(',')}">Excluir ${livres.length} evento${livres.length>1?'s':''}</button>`:''}</div>`, 520); },
  confirmarExcluirSelEventos: idsTxt => { if(!isAdmin()) return; const ids = String(idsTxt||'').split(',').filter(Boolean)
      .filter(id=>!db.pedidos.some(p=>p.eventoId===id) && !(db.recebimentos||[]).some(x=>x.eventoId===id));
    db.eventos = db.eventos.filter(e=>!ids.includes(e.id));
    ids.forEach(id=>SEL.delete(id)); save(); fechar(); render(); toast(ids.length+(ids.length>1?' eventos excluídos':' evento excluído')); },
  excluirSelPessoas: () => { if(!isAdmin()) return;
    const ids = selVisiveis().filter(c=>c.checked).map(c=>c.dataset.sel); if(!ids.length) return;
    const usos = pe => db.pedidos.filter(p=>p.pessoaId===pe.id).length;
    const ps = db.pessoas.filter(p=>ids.includes(p.id)), livres = ps.filter(p=>!usos(p)), presas = ps.filter(p=>usos(p));
    const linha = (p, extra) => `<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0"><span>${h(p.nome)}${p.doc?' · '+h(p.doc):''}</span>${extra}</div>`;
    modal(`<h3>Excluir ${livres.length} pessoa${livres.length!==1?'s':''}?</h3>
    ${livres.length?`<p style="color:var(--muted);margin:0 0 10px">O cadastro e o histórico de alterações dessas pessoas são apagados. <b>Essa ação não pode ser desfeita.</b></p>
    <div style="max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px">${livres.map(p=>linha(p,'')).join('')}</div>`:''}
    ${presas.length?`<p style="color:var(--muted);margin:12px 0 6px">${presas.length>1?'Estas pessoas não serão excluídas porque têm':'Esta pessoa não será excluída porque tem'} pedidos de pagamento. Para tirar da lista de escolha, use <b>Desativar</b>.</p>
    <div style="max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted)">${presas.map(p=>linha(p,`<span>${usos(p)} pedido${usos(p)>1?'s':''}</span>`)).join('')}</div>`:''}
    <div class="actions"><button class="btn" data-act="fechar">${livres.length?'Cancelar':'Ok'}</button>${livres.length?`<button class="btn pri" style="background:var(--recusado);border-color:var(--recusado)" data-act="confirmarExcluirSelPessoas" data-id="${livres.map(p=>p.id).join(',')}">Excluir ${livres.length} pessoa${livres.length>1?'s':''}</button>`:''}</div>`, 520); },
  confirmarExcluirSelPessoas: idsTxt => { if(!isAdmin()) return; const ids = String(idsTxt||'').split(',').filter(Boolean).filter(id=>!db.pedidos.some(p=>p.pessoaId===id));
    db.pessoas = db.pessoas.filter(p=>!ids.includes(p.id));
    db.alteracoes = (db.alteracoes||[]).filter(a=>!ids.includes(a.pessoaId));
    ids.forEach(id=>SEL.delete(id)); save(); fechar(); render(); toast(ids.length+(ids.length>1?' pessoas excluídas':' pessoa excluída')); },
  confirmarExcluirReceb: id => { if(!isAdmin()) return; db.recebimentos = db.recebimentos.filter(x=>x.id!==id); save(); fechar(); render(); toast(id+' excluído'); }
});
document.addEventListener('change', e => { const k = e.target.dataset?.fc; if (k){ FC[k] = [...e.target.selectedOptions].map(o=>o.value).filter(Boolean);
  if (FC.diario){ const [a,m] = FC.diario.split('-'); if (FC.mes.length!==1 || FC.mes[0]!==m || (FC.ano.length && !FC.ano.includes(a))){ FC.diario = null; FC.dia = null; } }
  render(); } });

// ================= VERSÃO DO APP E AVISO DE ATUALIZAÇÃO =================
// A cada atualização do app, mudar APP_VERSAO aqui e no arquivo version.json.
// Quem estiver com o app aberto vê a faixa "Nova versão disponível" (sem detalhar o que mudou).
const APP_VERSAO = '9.3';
let versaoNova = null, avisoAdiadoAte = 0;
async function checarVersao(){
  if (location.protocol === 'file:') return;            // abrindo o arquivo direto não há servidor para consultar
  try {
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'}); if (!r.ok) return;
    const v = await r.json();
    if (v.versao && v.versao !== APP_VERSAO){ versaoNova = v; mostrarAvisoVersao(); }
  } catch(_) {}
}
function mostrarAvisoVersao(){
  if (!versaoNova || document.getElementById('avisoVersao') || Date.now() < avisoAdiadoAte) return;
  const d = document.createElement('div'); d.id = 'avisoVersao'; d.className = 'aviso-versao';
  d.innerHTML = `<div><b>🚀 Nova versão do app disponível</b> <span style="opacity:.9">— clique para atualizar.</span></div>
    <button class="btn sm" data-act="atualizarApp">Atualizar agora</button>
    <button class="aviso-x" data-act="adiarVersao" title="Lembrar mais tarde">×</button>`;
  document.body.appendChild(d);
}
setInterval(checarVersao, 60000);                          // confere a cada 1 minuto
window.addEventListener('focus', checarVersao);            // e sempre que a pessoa volta para a aba
document.addEventListener('visibilitychange', () => { if (!document.hidden) checarVersao(); });

// Sincronização entre abas/janelas: quando os dados mudam em outra aba, esta se atualiza sozinha.
// (Na versão real, com banco de dados, isso vale entre computadores e celulares diferentes.)
window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  try { db = JSON.parse(e.newValue); } catch(_) { return; }
  if (!db.zigMap) db.zigMap = {...ZIG_PADRAO}; if (!db.alteracoes) db.alteracoes = []; if (!db.extrato) db.extrato = []; if (!db.recebimentos) db.recebimentos = seedRecebimentos(db.eventos,db.pedidos);
  if (me) me = db.users.find(u=>u.id===me.id) || null;
  render();
  if (me) toast('🔄 Atualizado com alterações feitas em outra aba');
});

load(); render(); checarVersao();
</script>
<div id="dicaGraf"></div>
<script>
// dica (tooltip) dos gráficos: aparece na hora ao passar o mouse, também dentro da Central de Clientes
document.addEventListener('mousemove', e=>{
  const d = document.getElementById('dicaGraf'); if(!d) return;
  const t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
  if(!t){ d.style.display='none'; return; }
  d.textContent = t.getAttribute('data-tip'); d.style.display='block';
  const w = d.offsetWidth, hgt = d.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + hgt > innerHeight - 8) y = e.clientY - hgt - 14;
  d.style.left = Math.max(8,x)+'px'; d.style.top = Math.max(8,y)+'px';
});
document.addEventListener('mouseleave', ()=>{ const d=document.getElementById('dicaGraf'); if(d) d.style.display='none'; });
// no celular: o 1º toque mostra a dica, o 2º toque no mesmo item abre as movimentações
let dicaToque = null;
window.addEventListener('click', e=>{
  if (!matchMedia('(hover: none)').matches) return;
  const d = document.getElementById('dicaGraf'); if(!d) return;
  const t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
  if (!t){ d.style.display='none'; dicaToque=null; return; }
  if (dicaToque === t){ d.style.display='none'; dicaToque=null; return; }
  e.preventDefault(); e.stopPropagation(); dicaToque = t;
  d.textContent = t.getAttribute('data-tip'); d.style.display='block';
  const r = t.getBoundingClientRect(), w = d.offsetWidth, hgt = d.offsetHeight;
  let x = r.left + r.width/2 - w/2, y = r.top - hgt - 8; if (y < 8) y = r.bottom + 8;
  d.style.left = Math.max(8, Math.min(innerWidth - w - 8, x))+'px'; d.style.top = y+'px';
}, true);
window.addEventListener('scroll', ()=>{ const d=document.getElementById('dicaGraf'); if(d && dicaToque){ d.style.display='none'; dicaToque=null; } }, true);
// redesenha os gráficos quando a largura da tela muda (girar o celular, redimensionar a janela)
let larguraAnt = innerWidth, tmrLarg;
window.addEventListener('resize', ()=>{ clearTimeout(tmrLarg); tmrLarg = setTimeout(()=>{
  if (Math.abs(innerWidth - larguraAnt) < 40) return; larguraAnt = innerWidth;
  if (typeof me !== 'undefined' && me && view === 'dashboard' && !document.querySelector('.overlay') && typeof render === 'function') render();
}, 250); });
</script>
