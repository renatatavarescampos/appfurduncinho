    ${filtroFC('evento','Todos os eventos',[...db.eventos].sort((a,b)=>b.data.localeCompare(a.data)).map(e=>[e.id,e.nome+' · '+fmt(e.data)]))}
    ${filtroFC('situacao','Realizado e previsto',[['realizado','Realizado (já no banco)'],['previsto','Previsto (a pagar / a receber)']])}
    <button class="btn sm" data-act="fcLimpar">Limpar filtros</button></div>
  <div class="kpis">
    ${kpi('Recebido', ent, n('entrada',true)+' recebimentos', 'var(--pago)', 'recebimentos')}
    ${kpi('Pago', sai, n('saida',true)+' pagamentos', 'var(--recusado)', 'pagamentos')}
    ${kpi('Saldo realizado', ent-sai, 'recebido − pago', '', '')}
    ${kpi('A receber', aRec, n('entrada',false)+' recebimentos previstos', 'var(--aprovado)', 'recebimentos')}
    ${kpi('A pagar', aPag, n('saida',false)+' pagamentos (aprovados + aguardando)', 'var(--aguardando)', 'pagamentos')}
    ${kpi('Saldo projetado', ent+aRec-sai-aPag, 'realizado + previsto', '', '')}
  </div>
  <div class="fc-abas">${abas.map(([k,t])=>`<button class="${FC.aba===k?'on':''}" data-act="fcAba" data-id="${k}">${t}</button>`).join('')}</div>
  ${({resumo:fluxoResumo, pagamentos:fluxoPagamentos, recebimentos:fluxoRecebimentos})[FC.aba](lista, todos)}`;
}

function fluxoResumo(lista, todos){
  // Mês a mês: usa os anos do filtro (ou o ano atual) e ignora o filtro de mês para mostrar o ano inteiro
  const anosSel = FC.ano.length ? [...FC.ano].sort() : [...new Set(todos.map(m=>m.data.slice(0,4)))].sort();
  const base = todos.filter(m=>passaFC(m,{periodo:false}));
  const meses = []; anosSel.forEach(a => MESES.forEach((m,i)=>{ const mm=String(i+1).padStart(2,'0');
    const ms = base.filter(x=>x.data.slice(0,7)===a+'-'+mm), s=(t,r)=>ms.filter(x=>x.tipo===t&&x.realizado===r).reduce((q,x)=>q+x.valor,0);
    meses.push({a, mm, nome:m+(anosSel.length>1?'/'+a.slice(2):''), entR:s('entrada',true), entP:s('entrada',false), saiR:s('saida',true), saiP:s('saida',false)}); }));
  // saldo acumulado começa com tudo o que aconteceu antes do 1º mês mostrado
  const ini = anosSel[0]+'-01';
  let acum = base.filter(x=>x.data.slice(0,7)<ini).reduce((q,x)=>q+(x.tipo==='entrada'?x.valor:-x.valor),0);
  const saldoInicial = acum;
  meses.forEach(x=>{ x.saldo = x.entR+x.entP-x.saiR-x.saiP; acum += x.saldo; x.acum = acum; });
  const max = Math.max(1,...meses.map(x=>Math.max(x.entR+x.entP, x.saiR+x.saiP)));
  const col = (r,p,cor,t) => `<div class="fc-col" title="${t}"><div class="seg" style="height:${p/max*100}%;background:${cor};opacity:.35"></div><div class="seg" style="height:${r/max*100}%;background:${cor}"></div></div>`;
  // Por evento: eventos que têm movimento no período filtrado, com o resultado COMPLETO do evento (todas as datas)
  const evIds = [...new Set(lista.map(m=>m.eventoId))];
  const porEv = evIds.map(id=>{ const ms=base.filter(m=>m.eventoId===id), s=(t,r)=>ms.filter(x=>x.tipo===t&&(r===undefined||x.realizado===r)).reduce((q,x)=>q+x.valor,0);
    return {e:evento(id), ent:s('entrada'), sai:s('saida'), entR:s('entrada',true), saiR:s('saida',true)}; }).sort((a,b)=>(b.e.data||'').localeCompare(a.e.data||''));
  const tEnt = porEv.reduce((a,x)=>a+x.ent,0), tSai = porEv.reduce((a,x)=>a+x.sai,0);
  return `<div class="panel"><div class="toolbar" style="margin:0 0 4px"><b>Entradas × saídas mês a mês — ${anosSel.join(' + ')}</b><div class="spacer"></div>
    <div class="legend"><span><span class="dot" style="background:var(--pago)"></span>Entradas</span><span><span class="dot" style="background:var(--recusado)"></span>Saídas</span><span><span class="dot" style="background:#9ca3af;opacity:.4"></span>Mais claro = previsto</span></div></div>
    <div class="fc-chart">${meses.map(x=>`<div class="fc-mes ${FC.diario===x.a+'-'+x.mm?'sel':''}" data-act="fcMes" data-id="${x.a}-${x.mm}" title="${x.nome} — clique para ver o diário">
      <div class="fc-par">${col(x.entR,x.entP,'var(--pago)',`Entradas: ${brl(x.entR)} recebido + ${brl(x.entP)} previsto`)}${col(x.saiR,x.saiP,'var(--recusado)',`Saídas: ${brl(x.saiR)} pago + ${brl(x.saiP)} previsto`)}</div>
      <div class="lab">${x.nome}</div></div>`).join('')}</div>
    ${FC.diario ? fluxoDiario(base) : `<div style="overflow-x:auto;margin-top:14px"><table class="cards"><thead><tr><th>Mês</th><th class="right">Recebido</th><th class="right">A receber</th><th class="right">Pago</th><th class="right">A pagar</th><th class="right">Saldo do mês</th><th class="right">Saldo acumulado</th></tr></thead><tbody>
      ${saldoInicial?`<tr><td class="meta">Saldo anterior</td><td></td><td></td><td></td><td></td><td></td><td class="right"><b>${brl(saldoInicial)}</b></td></tr>`:''}
      ${meses.map(x=>`<tr class="click" data-act="fcMes" data-id="${x.a}-${x.mm}" title="Ver o diário de ${x.nome}"><td>${x.nome}</td><td class="right" style="color:#047857">${brl(x.entR)}</td><td class="right meta">${brl(x.entP)}</td><td class="right" style="color:#b91c1c">${brl(x.saiR)}</td><td class="right meta">${brl(x.saiP)}</td>
        <td class="right" style="font-weight:600;color:${x.saldo<0?'var(--recusado)':'inherit'}">${brl(x.saldo)}</td><td class="right" style="font-weight:700;color:${x.acum<0?'var(--recusado)':'inherit'}">${brl(x.acum)}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="meta" style="margin:8px 0 0">O gráfico e a tabela mostram o ano inteiro (com o filtro de eventos e de realizado/previsto). <b>Clique em um mês para abrir o diário</b> (dia a dia).</p>`}</div>
  <div class="panel" style="margin-top:12px"><b>Resultado por evento</b> <span class="meta">— entradas menos saídas do evento inteiro (todas as datas), para os eventos com movimento no período filtrado</span>
    <table class="cards" style="margin-top:6px"><thead><tr><th>Evento</th><th>Data</th><th class="right">Entradas</th><th class="right">Saídas</th><th class="right">Resultado</th><th class="right">Margem</th><th class="right">Saldo já realizado</th></tr></thead><tbody>
    ${porEv.map(x=>{ const res=x.ent-x.sai, mg=x.ent?res/x.ent*100:0; return `<tr class="click" data-act="fcEvento" data-id="${x.e.id}" title="Filtrar por este evento"><td><b>${h(x.e.nome)}</b></td><td>${fmt(x.e.data)}</td><td class="right" style="color:#047857">${brl(x.ent)}</td><td class="right" style="color:#b91c1c">${brl(x.sai)}</td>
      <td class="right" style="font-weight:700;color:${res<0?'var(--recusado)':'var(--pago)'}">${brl(res)}</td><td class="right">${x.ent?mg.toFixed(0)+'%':'—'}</td><td class="right meta">${brl(x.entR-x.saiR)}</td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">Nenhuma movimentação com esses filtros</td></tr>'}
    </tbody>${porEv.length?`<tfoot><tr><td colspan="2"><b>Total</b></td><td class="right"><b>${brl(tEnt)}</b></td><td class="right"><b>${brl(tSai)}</b></td><td class="right"><b style="color:${tEnt-tSai<0?'var(--recusado)':'var(--pago)'}">${brl(tEnt-tSai)}</b></td><td class="right">${tEnt?((tEnt-tSai)/tEnt*100).toFixed(0)+'%':'—'}</td><td></td></tr></tfoot>`:''}</table></div>`;
}

// Diário em formato de planilha: dias nas colunas.
// Topo: saldo inicial, recebimentos (a vencer / recebido / atrasado), total de recebimentos, total de pagamentos,
// pagamentos atrasados e saldo final. Depois: entradas por centro de custo (evento) e saídas por categoria
// (somando todos os centros de custo). O filtro "Centro de custo" mostra só as entradas e saídas daquele evento.
// Como na planilha de referência, os atrasados aparecem em linhas próprias, mas não entram nos totais nem no saldo.
const DSEM = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const FC_LINHAS = {
  'av':  {nome:'A vencer',              f:m=>m.tipo==='entrada' && m.sit==='areceber'},
  'rec': {nome:'Recebido',              f:m=>m.tipo==='entrada' && m.sit==='recebido'},
  'atr': {nome:'Atrasado',              f:m=>m.tipo==='entrada' && m.sit==='atrasado'},
  'trec':{nome:'Total de recebimentos', f:m=>m.tipo==='entrada' && m.sit!=='atrasado'},
  'tpag':{nome:'Total pagamentos',      f:m=>m.tipo==='saida' && m.sit!=='atrasado'},
  'patr':{nome:'Pagamentos atrasados',  f:m=>m.tipo==='saida' && m.sit==='atrasado'}
};
function fcLinha(key){
  if (FC_LINHAS[key]) return FC_LINHAS[key];
  const v = key.slice(key.indexOf('|')+1);
  if (key.startsWith('ev|'))  return {nome:'Entradas — '+evento(v).nome, f:m=>m.tipo==='entrada' && m.sit!=='atrasado' && m.eventoId===v};
  if (key.startsWith('cat|')) return {nome:'Saídas — '+key.slice(4), f:m=>m.tipo==='saida' && m.sit!=='atrasado' && m.ref.categoria===v};
  return null;
}
const fcNum = v => v ? v.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}) : '-';
const fcSaldo = v => (v||0).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
function fluxoDiario(base){
  const ym = FC.diario, [a,m] = ym.split('-');
  const doMes = base.filter(x=>x.data.slice(0,7)===ym);
  const conta = x => x.sit!=='atrasado';                     // atrasados não entram no saldo
  const saldoIni = base.filter(x=>x.data.slice(0,7)<ym && conta(x)).reduce((q,x)=>q+(x.tipo==='entrada'?x.valor:-x.valor),0);
  const nDias = new Date(+a, +m, 0).getDate();
  const dias = Array.from({length:nDias}, (_,i)=>ym+'-'+String(i+1).padStart(2,'0'));
  const soma = (f, dt) => doMes.filter(x=>(!dt || x.data===dt) && f(x)).reduce((q,x)=>q+x.valor,0);
  // saldo inicial / final de cada dia
  let s = saldoIni; const ini = {}, fim = {};
  dias.forEach(d=>{ ini[d]=s; s += soma(FC_LINHAS.trec.f,d) - soma(FC_LINHAS.tpag.f,d); fim[d]=s; });
  const cel = (key, f, cls='') => dias.map(d=>{ const v=soma(f,d); return `<td class="right ${cls} ${d===HOJE?'hj':''} ${v?'click':''}" ${v?`data-act="fcCel" data-id="${d}" data-arg="${h(key)}"`:''}>${fcNum(v)}</td>`; }).join('')
    + (()=>{ const v=soma(f); return `<td class="right tot ${v?'click':''}" ${v?`data-act="fcCel" data-id="${ym}" data-arg="${h(key)}"`:''}>${fcNum(v)}</td>`; })();
  const linha = (key, cls='', nome) => { const L=fcLinha(key); return `<tr class="${cls}"><th class="fc-rot">${h(nome||L.nome)}</th>${cel(key,L.f)}</tr>`; };
  const secao = (t, cls) => `<tr class="${cls}"><th class="fc-rot">${t}</th>${dias.map(d=>`<td class="${d===HOJE?'hj':''}"></td>`).join('')}<td class="tot"></td></tr>`;
  // centros de custo com entrada no mês (ou o filtrado) e todas as categorias de despesa
  const evs = [...new Set(doMes.filter(x=>x.tipo==='entrada').map(x=>x.eventoId).concat(FC.evento))]
    .map(id=>evento(id)).filter(e=>e.id).sort((p,q)=>p.nome.localeCompare(q.nome,'pt-BR'));
  const cats = [...new Set(db.categorias.concat(doMes.filter(x=>x.tipo==='saida').map(x=>x.ref.categoria)))].sort((p,q)=>p.localeCompare(q,'pt-BR'));
  const prev = new Date(+a, +m-2, 1), prox = new Date(+a, +m, 1), ymOf = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const totRec = soma(FC_LINHAS.trec.f), totPag = soma(FC_LINHAS.tpag.f);
  return `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
    <div class="toolbar" style="margin:0 0 8px"><button class="btn sm" data-act="fcMesVoltar">← Mês a mês</button>
      <button class="btn sm" data-act="fcMes" data-id="${ymOf(prev)}" title="Mês anterior">◀</button><b style="font-size:15px">Diário — ${MESES[+m-1]}/${a}</b><button class="btn sm" data-act="fcMes" data-id="${ymOf(prox)}" title="Próximo mês">▶</button>
      <div class="spacer"></div><span class="meta">Centro de custo:</span>${filtroFC('evento','Todos os centros de custo',[...db.eventos].sort((p,q)=>q.data.localeCompare(p.data)).map(e=>[e.id,e.nome+' · '+fmt(e.data)]))}
      <button class="btn sm" data-act="fcCsvDiario">⬇ Excel (CSV)</button></div>
    ${FC.evento.length?`<div class="note" style="margin:0 0 8px;background:var(--brand-soft);border-color:#c4b5fd;color:var(--brand)">Mostrando só <b>${FC.evento.map(id=>h(evento(id).nome)).join(', ')}</b>: entradas e saídas desse centro de custo em ${MESES[+m-1]}/${a}. O saldo inicial também considera só esse centro de custo.</div>`:''}
    <div class="fc-plan"><table>
      <thead><tr><th class="fc-rot">Saldo inicial<br><b style="font-size:14px;color:${saldoIni<0?'var(--recusado)':'var(--text)'}">${fcSaldo(saldoIni)}</b></th>
        ${dias.map(d=>{ const dd=new Date(d+'T12:00:00'); return `<th class="right ${d===HOJE?'hj':''} ${[0,6].includes(dd.getDay())?'fds':''}">${DSEM[dd.getDay()]}<br><b>${fmt(d)}</b>${d===HOJE?'<br><span class="tag" style="background:var(--brand)">hoje</span>':''}</th>`; }).join('')}
        <th class="right tot">Total<br><b>${MESES[+m-1]}/${a}</b></th></tr></thead>
      <tbody>
        <tr class="r-ini"><th class="fc-rot">Saldo inicial do dia</th>${dias.map(d=>`<td class="right ${d===HOJE?'hj':''}">${fcSaldo(ini[d])}</td>`).join('')}<td class="right tot">${fcSaldo(saldoIni)}</td></tr>
        ${secao('Total previsão','r-sec')}
        ${linha('av')}${linha('rec')}${linha('atr','r-atr')}
        ${linha('trec','r-sec')}
        ${linha('tpag','r-pag')}
        ${linha('patr','r-pag r-atr')}
        <tr class="r-saldo"><th class="fc-rot">Saldo final</th>${dias.map(d=>`<td class="right ${fim[d]<0?'neg':''}">${fcSaldo(fim[d])}</td>`).join('')}<td class="right">${fcSaldo(saldoIni+totRec-totPag)}</td></tr>
        ${secao('▲ Entradas por centro de custo','r-sec r-ent')}
        ${evs.map(e=>linha('ev|'+e.id,'',e.nome)).join('') || `<tr><th class="fc-rot meta">Nenhuma entrada no mês</th><td colspan="${nDias+1}"></td></tr>`}
        ${secao('▼ Saídas por categoria','r-sec r-sai')}
        ${cats.map(c=>linha('cat|'+c,'',c)).join('')}
      </tbody></table></div>
    <p class="meta" style="margin:8px 0 0">Clique em qualquer valor para ver os pagamentos/recebimentos que formam aquele número. Pagamentos feitos entram na data em que foram pagos; os previstos, na data de vencimento. Os atrasados (vencidos e ainda não pagos/recebidos) aparecem nas linhas "Atrasado" e "Pagamentos atrasados", mas não entram nos totais nem no saldo final, como na sua planilha.</p></div>`;
}
function fcCelula(id, key){
  const L = fcLinha(key); if (!L) return;
  const base = movimentosFluxo().filter(m=>passaFC(m,{periodo:false}));
  const xs = base.filter(x=>(id.length===7 ? x.data.slice(0,7)===id : x.data===id) && L.f(x)).sort((p,q)=>p.data.localeCompare(q.data)||q.valor-p.valor);
  const tot = xs.reduce((q,x)=>q+x.valor,0);
  modal(`<h3>${h(L.nome)} · ${id.length===7?MESES[+id.slice(5)-1]+'/'+id.slice(0,4):fmt(id)}</h3>
  <div style="overflow-x:auto"><table class="cards"><thead><tr><th>Data</th><th>Nº</th><th>Centro de custo</th><th>Favorecido / origem</th><th>Situação</th><th class="right">Valor</th></tr></thead><tbody>
  ${xs.map(x=>{ const r=x.ref, ent=x.tipo==='entrada'; return `<tr class="click" data-act="${ent?'formReceb':'ver'}" data-id="${r.id}"><td>${fmt(x.data)}</td><td>${r.id}</td><td>${h(evento(r.eventoId).nome)}</td>
    <td style="white-space:normal">${h(ent?r.origem+' — '+r.descricao:pessoa(r.pessoaId).nome+' — '+r.categoria)}</td><td>${tagSit(x.sit)}</td><td class="right" style="font-weight:600;color:${ent?'#047857':'#b91c1c'}">${brl(r.valor)}</td></tr>`; }).join('')}
  </tbody><tfoot><tr><td colspan="5"><b>${xs.length} lançamento(s)</b></td><td class="right"><b>${brl(tot)}</b></td></tr></tfoot></table></div>
  <div class="actions"><button class="btn" data-act="fechar">Fechar</button></div>`, 820);
}
function csvDiario(){
  const ym = FC.diario; if (!ym) return;
  const div = document.createElement('div'); div.innerHTML = fluxoDiario(movimentosFluxo().filter(m=>passaFC(m,{periodo:false})));
  const linhas = [...div.querySelectorAll('.fc-plan tr')].map(tr=>[...tr.cells].map(c=>c.innerText.replace(/\s*\n\s*/g,' ').trim()));
  const csv = '﻿'+linhas.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'diario '+ym+(FC.evento.length?' - '+FC.evento.map(id=>evento(id).nome).join(', '):'')+'.csv'; a.click();
}

function fluxoPagamentos(lista){
  const ps = lista.filter(m=>m.tipo==='saida').sort((a,b)=>b.data.localeCompare(a.data));
  const tot = ps.reduce((a,m)=>a+m.valor,0);
  return `<div class="panel"><table class="filtravel cards" data-key="fcPag"><thead><tr><th>Data</th><th>Nº</th><th>Evento</th><th>Favorecido</th><th>Categoria</th><th>Forma</th><th>Situação</th><th class="right">Valor</th></tr></thead>
  <tbody>${ps.map(m=>{ const p=m.ref; return `<tr class="click" data-act="ver" data-id="${p.id}" data-valor="${p.valor}"><td data-v="${fmt(m.data)}">${fmt(m.data)}${m.realizado?'':'<br><span class="meta">vencimento</span>'}</td><td>${p.id}</td><td>${h(evento(p.eventoId).nome)}</td><td>${h(pessoa(p.pessoaId).nome)}</td><td>${h(p.categoria)}</td><td>${h(p.forma)}</td>
    <td data-v="${SIT[m.sit].nome}">${tagSit(m.sit)}${p.conc?' <span title="Conciliado com o banco">🏦✓</span>':''}</td><td class="right">${brl(p.valor)}</td></tr>`; }).join('') || '<tr><td colspan="8" class="empty">Nenhum pagamento com esses filtros</td></tr>'}</tbody>
  <tfoot><tr><td colspan="7"><b data-cnt="pagamentos">${ps.length} pagamentos</b> · pagos, aprovados a pagar e aguardando aprovação (sem recusados/cancelados)</td><td class="right"><b data-tot>${brl(tot)}</b></td></tr></tfoot></table></div>`;
}

function fluxoRecebimentos(lista){
  const rs = lista.filter(m=>m.tipo==='entrada').sort((a,b)=>b.data.localeCompare(a.data));
  const tot = rs.reduce((a,m)=>a+m.valor,0);
  return `<div class="panel"><table class="filtravel cards" data-key="fcRec"><thead><tr><th>Data</th><th>Nº</th><th>Evento</th><th>Origem</th><th>Descrição</th><th>Forma</th><th>Situação</th><th class="right">Valor</th><th></th></tr></thead>
  <tbody>${rs.map(m=>{ const x=m.ref; return `<tr class="click" data-act="formReceb" data-id="${x.id}" data-valor="${x.valor}"><td data-v="${fmt(m.data)}">${fmt(m.data)}${m.realizado?'':'<br><span class="meta">previsto</span>'}</td><td>${x.id}</td><td>${h(evento(x.eventoId).nome)}</td><td>${h(x.origem)}</td><td style="white-space:normal;min-width:180px">${h(x.descricao)}</td><td>${h(x.forma)}</td>
    <td data-v="${SIT[m.sit].nome}">${tagSit(m.sit)}</td><td class="right">${brl(x.valor)}</td><td>${m.realizado?'':`<button class="btn sm ok" data-act="receber" data-id="${x.id}">Marcar recebido</button>`}</td></tr>`; }).join('') || '<tr><td colspan="9" class="empty">Nenhum recebimento com esses filtros</td></tr>'}</tbody>
  <tfoot><tr><td colspan="7"><b data-cnt="recebimentos">${rs.length} recebimentos</b></td><td class="right"><b data-tot>${brl(tot)}</b></td><td></td></tr></tfoot></table></div>`;
}

function formReceb(id){
  if (!isAdmin()) return;
  const x = id ? recebimento(id) : {eventoId:FC.evento[0]||'', origem:'Bilheteria', descricao:'', valor:'', previsto:HOJE, recebidoEm:'', forma:'Transferência', historico:[]};
  modal(`<h3>${id?'Recebimento '+x.id:'Novo recebimento'}</h3>
  <form class="form" id="fReceb">
    <label class="full">Evento *<select name="eventoId" required><option value="">Escolha o evento…</option>${[...db.eventos].sort((a,b)=>b.data.localeCompare(a.data)).map(e=>`<option value="${e.id}" ${x.eventoId===e.id?'selected':''}>${h(e.nome)} · ${fmt(e.data)}</option>`).join('')}</select></label>
    <label>Origem *<select name="origem" required>${ORIGENS.map(o=>`<option ${x.origem===o?'selected':''}>${o}</option>`).join('')}</select></label>
    <label>Forma<select name="forma">${FORMAS.map(f=>`<option ${x.forma===f?'selected':''}>${f}</option>`).join('')}</select></label>
    <label class="full">Descrição<input name="descricao" value="${h(x.descricao)}" placeholder="Ex.: repasse da bilheteria, cota de patrocínio…"></label>
    <label>Valor (R$) *<input name="valor" type="number" step="0.01" min="0.01" required value="${x.valor}"></label>
    <label>Data prevista *<input name="previsto" type="date" required value="${x.previsto}"></label>
    <label>Recebido em <span class="meta">(vazio = ainda não entrou)</span><input name="recebidoEm" type="date" value="${x.recebidoEm||''}"></label>
    <label>Banco <span class="meta">(conta onde entrou)</span>${selectBanco('banco', x.banco||'')}</label>
  </form>
  ${id&&x.historico?.length?`<div style="margin-top:12px"><b style="font-size:13px">Histórico</b><div class="hist">${x.historico.map(a=>`<div>${h(a.acao)}<small>${fmt(a.quando)} · ${h(user(a.quem).nome)}</small></div>`).join('')}</div></div>`:''}
  <div class="actions">${id?`<button class="btn bad" data-act="excluirReceb" data-id="${id}" style="margin-right:auto">Excluir</button>`:''}<button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="salvarReceb" data-id="${id||''}">${id?'Salvar alterações':'Lançar recebimento'}</button></div>`, 620);
}

function csvFluxo(){
  const lista = movimentosFluxo().filter(m=>passaFC(m)).filter(m=>FC.aba==='resumo' || (FC.aba==='pagamentos')===(m.tipo==='saida')).sort((a,b)=>a.data.localeCompare(b.data));
  const linhas = [['Data','Tipo','Nº','Evento','Favorecido / Origem','Categoria / Descrição','Forma','Situação','Entrada','Saída']];
  const num = v => v.toFixed(2).replace('.',',');
  lista.forEach(m=>{ const x=m.ref, ent=m.tipo==='entrada';
    linhas.push([fmt(m.data), ent?'Recebimento':'Pagamento', x.id, evento(x.eventoId).nome, ent?x.origem:pessoa(x.pessoaId).nome, ent?x.descricao:x.categoria, x.forma, SIT[m.sit].nome, ent?num(x.valor):'', ent?'':num(x.valor)]); });
  const csv = '﻿'+linhas.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'fluxo de caixa - '+({resumo:'completo',pagamentos:'pagamentos',recebimentos:'recebimentos'})[FC.aba]+'.csv'; a.click();
}

Object.assign(acoes, {
  fcAba: id => { FC.aba = id; render(); },
  fcLimpar: () => { delete CFS.fcPag; delete CFS.fcRec; FC = {ano:FC.ano, mes:[], evento:[], situacao:[], aba:FC.aba, diario:null, dia:null}; render(); },
  // clique no mês (gráfico ou tabela) abre o diário daquele mês e filtra os totais/listas pelo mês
  fcMes: id => { const [a,m] = id.split('-'); FC.diario = id; FC.dia = null; FC.mes = [m]; if (!FC.ano.includes(a)) FC.ano = [a]; FC.aba = 'resumo'; render();
    document.querySelector('.fc-chart')?.scrollIntoView({behavior:'smooth', block:'start'}); },
  fcMesVoltar: () => { FC.diario = null; FC.dia = null; FC.mes = []; render(); },
  fcCel: (id,key) => fcCelula(id,key),
  fcCsvDiario: () => csvDiario(),
  fcEvento: id => { FC.evento = FC.evento.includes(id) ? FC.evento.filter(e=>e!==id) : [id]; render(); window.scrollTo(0,0); },
  fcCsv: () => csvFluxo(),
  formReceb: id => formReceb(id),
  csvReceber: () => csvReceber(),
  salvarReceb: id => { if(!isAdmin()) return; const d=lerForm('fReceb'); if(!d) return;
    const dados = {eventoId:d.eventoId, origem:d.origem, forma:d.forma, descricao:(d.descricao||'').trim()||d.origem, valor:Number(d.valor)||0, previsto:d.previsto, recebidoEm:d.recebidoEm||'', banco:lembrarBanco(d.banco)};
    if (id){ const x=recebimento(id), antes=!!x.recebidoEm; Object.assign(x,dados);
      x.historico.push({quando:agora(),quem:me.id,acao: !antes&&x.recebidoEm ? 'Marcou como recebido em '+fmt(x.recebidoEm) : antes&&!x.recebidoEm ? 'Voltou para "a receber"' : 'Editou o recebimento'}); toast('Recebimento atualizado'); }
    else { db.recSeq = (db.recSeq || db.recebimentos.length+1);

  receber: id => { if(!isAdmin()) return; const x=recebimento(id); if(!x || x.recebidoEm) return;

    <div class="actions"><button class="btn" data-act="fechar">Cancelar</button><button class="btn ok" data-act="receberOk" data-id="${id}">Confirmar recebimento</button></div>`, 520); },
  pagarConf: id => { const p=db.pedidos.find(x=>x.id===id); if(!podePagar(p)) return;
    modal(`<h3>✓ Confirmar pagamento ${p.id}</h3>
    <div class="kpi" style="margin-bottom:12px"><div class="l">${h(pessoa(p.pessoaId).nome)} · ${h(evento(p.eventoId).nome)} · venc. ${fmt(p.vencimento)}</div><div class="v" style="color:var(--recusado)">${brl(p.valor)}</div></div>
    <form class="form" id="fPagOk"><label>Pago em *<input type="date" name="data" required value="${HOJE}"></label>
    <label>Banco (conta de onde saiu)${selectBanco('banco', (db.contasBanco||[]).slice(-1)[0]||'')}</label></form>

  pagarOk: id => { const p=db.pedidos.find(x=>x.id===id); const d=lerForm('fPagOk'); if(!d || !podePagar(p)) return;
    p.status='pago'; p.pagoEm=d.data; p.bancoPag=lembrarBanco(d.banco);
    p.historico.push({quando:agora(),quem:me.id,acao:'Marcou como pago em '+fmt(d.data)+(p.bancoPag?' · '+p.bancoPag:'')}); save(); fechar(); render(); toast(id+' pago'); },
  receberOk: id => { if(!isAdmin()) return; const x=recebimento(id); const d=lerForm('fRecOk'); if(!x || !d) return;
    x.recebidoEm = d.data; x.banco = lembrarBanco(d.banco) || x.banco || '';

  excluirReceb: id => { if(!isAdmin()) return; const x=recebimento(id);
    modal(`<h3>Excluir ${x.id}?</h3><p style="color:var(--muted)">${h(x.descricao)} · ${brl(x.valor)} · ${h(evento(x.eventoId).nome)}<br>O recebimento sai do fluxo de caixa. Essa ação não pode ser desfeita.</p>
    <div class="actions"><button class="btn" data-act="formReceb" data-id="${id}">Voltar</button><button class="btn bad" data-act="confirmarExcluirReceb" data-id="${id}">Excluir</button></div>`); },
  confirmarExcluirReceb: id => { if(!isAdmin()) return; db.recebimentos = db.recebimentos.filter(x=>x.id!==id); save(); fechar(); render(); toast(id+' excluído'); }
});
document.addEventListener('change', e => { const k = e.target.dataset?.fc; if (k){ FC[k] = [...e.target.selectedOptions].map(o=>o.value).filter(Boolean);
  if (FC.diario){ const [a,m] = FC.diario.split('-'); if (FC.mes.length!==1 || FC.mes[0]!==m || (FC.ano.length && !FC.ano.includes(a))){ FC.diario = null; FC.dia = null; } }
  render(); } });

// ================= VERSÃO DO APP E AVISO DE ATUALIZAÇÃO =================
// A cada atualização do app, mudar APP_VERSAO aqui e no arquivo version.json.
// Quem estiver com o app aberto vê a faixa "Nova versão disponível" (sem detalhar o que mudou).
const APP_VERSAO = '4.7';
let versaoNova = null, avisoAdiadoAte = 0;
async function checarVersao(){
  if (location.protocol === 'file:') return;            // abrindo o arquivo direto não há servidor para consultar
  try {
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'}); if (!r.ok) return;
    const v = await r.json();
    if (v.versao && v.versao !== APP_VERSAO){ versaoNova = v; mostrarAvisoVersao(); }
  } catch(_) {}
}
function mostrarAvisoVersao(){
  if (!versaoNova || document.getElementById('avisoVersao') || Date.now() < avisoAdiadoAte) return;
  const d = document.createElement('div'); d.id = 'avisoVersao'; d.className = 'aviso-versao';
  d.innerHTML = `<div><b>🚀 Nova versão do app disponível</b> <span style="opacity:.9">— clique para atualizar.</span></div>
    <button class="btn sm" data-act="atualizarApp">Atualizar agora</button>
    <button class="aviso-x" data-act="adiarVersao" title="Lembrar mais tarde">×</button>`;
  document.body.appendChild(d);
}
setInterval(checarVersao, 60000);                          // confere a cada 1 minuto
window.addEventListener('focus', checarVersao);            // e sempre que a pessoa volta para a aba
document.addEventListener('visibilitychange', () => { if (!document.hidden) checarVersao(); });

// Sincronização entre abas/janelas: quando os dados mudam em outra aba, esta se atualiza sozinha.
// (Na versão real, com banco de dados, isso vale entre computadores e celulares diferentes.)
window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  try { db = JSON.parse(e.newValue); } catch(_) { return; }
  if (!db.zigMap) db.zigMap = {...ZIG_PADRAO}; if (!db.alteracoes) db.alteracoes = []; if (!db.extrato) db.extrato = []; if (!db.recebimentos) db.recebimentos = seedRecebimentos(db.eventos,db.pedidos);
  if (me) me = db.users.find(u=>u.id===me.id) || null;
  render();
  if (me) toast('🔄 Atualizado com alterações feitas em outra aba');
});

load(); render(); checarVersao();
</script>
<div id="dicaGraf"></div>
<script>
// dica (tooltip) dos gráficos: aparece na hora ao passar o mouse, também dentro da Central de Clientes
document.addEventListener('mousemove', e=>{
  const d = document.getElementById('dicaGraf'); if(!d) return;
  const t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
  if(!t){ d.style.display='none'; return; }
  d.textContent = t.getAttribute('data-tip'); d.style.display='block';
  const w = d.offsetWidth, hgt = d.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + hgt > innerHeight - 8) y = e.clientY - hgt - 14;
  d.style.left = Math.max(8,x)+'px'; d.style.top = Math.max(8,y)+'px';
});
document.addEventListener('mouseleave', ()=>{ const d=document.getElementById('dicaGraf'); if(d) d.style.display='none'; });
</script>
