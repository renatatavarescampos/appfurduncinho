<!doctype html>
<html lang="pt-BR">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="nuvem.js"></script>
<title>Pagamentos de Eventos</title>
<style>
:root{
  --bg:#f4efeb;--card:#fff;--text:#002620;--muted:#002620b3;--line:#c37f3640;
  --brand:#002620;--brand-soft:#efbb3c33;
  --aguardando:#efbb3c;--aprovado:#c37f36;--pago:#002620;--recusado:#ef4444;--cancelado:#0026208c;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,select,input,textarea{font:inherit}
.demo-bar{background:#002620;color:#fff;font-size:12px;padding:6px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.demo-bar button{background:transparent;border:1px solid #f4efeb55;color:#fff;border-radius:6px;padding:2px 8px;cursor:pointer}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.logo span{background:var(--brand);color:#fff;border-radius:8px;width:28px;height:28px;display:grid;place-items:center}
.who{margin-left:auto;display:flex;align-items:center;gap:8px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-weight:600}
nav{background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 12px;overflow-x:auto}
nav button{background:none;border:none;padding:12px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
main{padding:16px;max-width:1400px;margin:0 auto}
h2{margin:0 0 12px;font-size:18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select,.toolbar input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:#c37f3640}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ok{background:var(--pago);border-color:var(--pago);color:#fff}
.btn.blue{background:var(--aprovado);border-color:var(--aprovado);color:#fff}
.btn.bad{color:var(--recusado);border-color:#ef444433}
.btn.sm{padding:4px 8px;font-size:12px}
.spacer{flex:1}
/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#f4efeb;border-radius:12px;padding:10px;min-height:200px}
.col-h{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:8px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.col-h small{margin-left:auto;color:var(--muted);font-weight:500}
.col-total{font-size:12px;color:var(--muted);margin:-4px 0 8px 16px}
.card{background:var(--card);border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px #0026200d;cursor:pointer;border-left:3px solid var(--line)}
.card:hover{box-shadow:0 2px 8px #00262014}
/* Colunas finalizadas (pago, recusado, cancelado) mais claras para destacar as duas primeiras */
.col-fim{background:#f4efeb}
.col-fim .col-h,.col-fim .col-total{opacity:.6}
.col-fim .card{opacity:.55;box-shadow:none}
.col-fim .card:hover{opacity:1;box-shadow:0 2px 8px #00262014}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ev{font-size:11px;color:var(--brand);font-weight:600}
.val{font-weight:700;white-space:nowrap}
.fav{font-weight:600;margin:4px 0 2px}
.meta{font-size:12px;color:var(--muted)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:16px 0}
/* tabela */
.panel{background:var(--card);border-radius:12px;border:1px solid var(--line);padding:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
tr.click{cursor:pointer}
tr.click:hover td{background:#f4efeb}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;color:#fff;font-weight:600}
.right{text-align:right}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.hist-item{border-top:1px solid var(--line);padding:10px 0}
.hist-item:first-of-type{border-top:0}
.hist-x{position:absolute;top:8px;right:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:18px;line-height:1;cursor:pointer}
.hist-x:hover{background:#ef444414;color:var(--recusado);border-color:#ef444433}
.hist-tab{margin:6px 0 0 4px;width:auto}
.hist-tab td{border:0;padding:2px 8px 2px 0;white-space:normal;font-size:13px}
.kpi.click{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.kpi.click:hover{border-color:var(--brand);box-shadow:0 2px 10px #0026201f}
.kpi.click::after{content:'Ver lista →';display:block;font-size:11px;color:var(--brand);margin-top:6px;opacity:.75}
.kpi .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.chart{display:flex;align-items:flex-end;gap:6px;height:220px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;position:relative}
.bar .seg{width:100%}
.bar .seg:first-child{border-radius:4px 4px 0 0}
.bar .lab{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.bar .tot{font-size:10px;color:var(--muted);text-align:center;margin-bottom:2px;white-space:nowrap}
.hbar{display:grid;grid-template-columns:150px 1fr 110px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.hbar .track{background:#f4efeb;border-radius:4px;height:14px;overflow:hidden}
.hbar .fill{height:100%;background:var(--brand);border-radius:4px}
.hbar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:10px}
.evitem{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.evitem:hover{border-color:var(--pago);background:#00262012}
.evitem small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
/* modal */
.overlay{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:10}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:560px;padding:20px}
.modal h3{margin:0 0 14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:#fff}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.det{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:13px}
.det dt{color:var(--muted)}
.det dd{margin:0}
.hist{border-left:2px solid var(--line);margin:8px 0 0 4px;padding-left:12px}
.hist div{margin-bottom:8px;font-size:13px}
.hist small{color:var(--muted);display:block}
.note{background:#f4efeb;border:1px solid #efbb3c;color:#702b16;border-radius:8px;padding:8px 10px;font-size:12px;margin-top:12px}
/* login */
.login{max-width:520px;margin:40px auto;background:var(--card);border-radius:16px;padding:24px;border:1px solid var(--line)}
.login h1{font-size:20px;margin:0 0 4px}
.login p{color:var(--muted);margin:0 0 16px}
.ulist{display:grid;gap:8px}
.ubtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;text-align:left}
.ubtn:hover{border-color:var(--brand)}
.av{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.ubtn small{display:block;color:var(--muted)}
/* campo de escolha com busca */
/* filtro por coluna */
.cf-row th{padding:4px 6px 8px;background:transparent}
.cf-in{width:100%;min-width:90px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-weight:400;background:#f4efeb;color:var(--text)}
.cf-in:focus{outline:2px solid var(--brand-soft);border-color:var(--brand);background:#fff}
.cf-row .combo-in{padding:5px 22px 5px 8px;font-size:12px;background:#f4efeb;min-width:90px;font-weight:400}
.cf-row .combo::after{right:7px}
/* múltipla escolha */
.ms-btn{text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.ms-btn.ativo{border-color:var(--brand);background:var(--brand-soft)!important;color:var(--brand);font-weight:600}
.ms-painel{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #00262026;max-width:min(360px,92vw);display:flex;flex-direction:column}
.ms-busca{margin:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.ms-acoes{display:flex;justify-content:space-between;padding:0 10px 6px;font-size:12px}
.ms-acoes a{color:var(--brand);text-decoration:none}
.ms-ops{max-height:250px;overflow:auto;border-top:1px solid var(--line)}
.ms-op{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;font-size:13px;cursor:pointer;color:var(--text);font-weight:400}
.ms-op:hover{background:var(--brand-soft)}
.ms-op input{margin-top:2px;accent-color:var(--brand)}
.ms-rodape{border-top:1px solid var(--line);padding:8px;display:flex;justify-content:flex-end}
.combo{position:relative;display:block}
.toolbar .combo{display:inline-block;min-width:180px}
.combo::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:12px}
.combo-in{width:100%;padding:7px 28px 7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
.combo-in:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.combo-in:disabled{background:#f4efeb;color:var(--muted)}
.form .combo-in{padding:8px 28px 8px 10px}
.combo-sel{position:absolute!important;opacity:0;pointer-events:none;width:1px!important;height:1px!important;left:0;bottom:0;padding:0!important;border:0!important}
.combo-list{display:none;position:absolute;z-index:40;left:0;top:calc(100% + 4px);min-width:100%;width:max-content;max-width:min(420px,90vw);background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #00262022;max-height:260px;overflow:auto}
.combo-op{padding:8px 10px;cursor:pointer;font-size:13px;white-space:normal}
.combo-op:hover,.combo-op.at{background:var(--brand-soft)}
.combo-op.sel{font-weight:600;color:var(--brand)}
.combo-vazio{padding:8px 10px;color:var(--muted);font-size:13px}
/* aviso de nova versão */
.aviso-versao{position:fixed;top:0;left:0;right:0;z-index:70;background:var(--brand);color:#fff;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 48px 10px 16px;box-shadow:0 4px 16px #0003;font-size:14px}
.aviso-versao .btn{background:#fff;color:var(--brand);border-color:#fff;font-weight:700}
.aviso-x{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer;opacity:.8}
.novidades li{margin:6px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#002620;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;font-size:13px}
/* fluxo de caixa */
.fc-abas{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 12px;overflow-x:auto}
.fc-abas button{background:none;border:none;padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.fc-abas button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
.fc-chart{display:flex;align-items:stretch;gap:6px;height:220px;padding-top:10px;overflow-x:auto}
.fc-mes{flex:1;min-width:34px;display:flex;flex-direction:column;cursor:pointer;border-radius:6px;padding:0 2px}
.fc-mes:hover,.fc-mes.sel{background:var(--brand-soft)}
.fc-par{flex:1;display:flex;gap:2px;align-items:stretch}
.fc-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.fc-col .seg:first-child{border-radius:3px 3px 0 0}
.fc-plan{overflow:auto;max-height:75vh;border:1px solid var(--line);border-radius:8px}
.fc-plan table{border-collapse:separate;border-spacing:0;font-size:12px}
.fc-plan th,.fc-plan td{padding:4px 8px;border-bottom:1px solid #f4efeb;border-right:1px solid #f4efeb;min-width:92px}
.fc-plan thead th{position:sticky;top:0;z-index:2;background:#f6ece1;color:var(--text);font-weight:500;text-align:center;font-size:11px;line-height:1.35}
.fc-plan thead th.fds{background:#fcf1d8}
.fc-plan .fc-rot{position:sticky;left:0;z-index:1;background:#fff;text-align:left;min-width:220px;max-width:260px;white-space:normal;font-weight:400;color:var(--text);font-size:12px}
.fc-plan thead .fc-rot{z-index:3;background:#f6ece1;text-align:center}
.fc-plan td.hj{background:#f4efeb}
.fc-plan td.tot,.fc-plan th.tot{background:#f4efeb;font-weight:700}
.fc-plan td.click{cursor:pointer}
.fc-plan td.click:hover{outline:2px solid var(--brand);outline-offset:-2px}
.fc-plan tr.r-ini td,.fc-plan tr.r-ini th{color:var(--muted)}
.fc-plan tr.r-sec th,.fc-plan tr.r-sec td{background:#f4efeb;font-weight:700}
.fc-plan tr.r-pag th,.fc-plan tr.r-pag td{background:#fde3e3;font-weight:700}
.fc-plan tr.r-atr th{font-style:italic}
.fc-plan tr.r-saldo th,.fc-plan tr.r-saldo td{background:#002620;color:#fff;font-weight:700}
.fc-plan tr.r-saldo td.neg{background:#ef4444}
.fc-plan tr.r-ent th,.fc-plan tr.r-ent td{background:#edf0ef}
.fc-plan tr.r-sai th,.fc-plan tr.r-sai td{background:#fef0f0}
.fc-mes .lab{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
@media (max-width:760px){
  table.cards thead{display:block}
  table.cards thead tr:not(.cf-row){display:none}
  table.cards thead tr.cf-row{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 8px}
  table.cards thead tr.cf-row th{display:block;flex:1 1 140px;padding:0;border:0}
  table.cards thead tr.cf-row th:empty{display:none}
  table.cards tr{display:block;border-bottom:1px solid var(--line);padding:10px 0}
  table.cards td{display:block;border:none;padding:2px 0;white-space:normal!important;min-width:0!important}
  table.cards td.right{text-align:left;font-size:15px}
  table.cards td:empty{display:none}
  .grid2{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .hbar{grid-template-columns:100px 1fr 90px}
  .kanban{grid-template-columns:repeat(5,82vw)}
  .who .nm{display:none}
}
.sel-col{width:36px;text-align:center!important;padding-left:4px!important;padding-right:4px!important}
.sel-col input{width:17px;height:17px;accent-color:#002620;cursor:pointer;vertical-align:middle}
tr.sel-on td{background:#efbb3c33!important}
tr.inativo td{color:#8a8a8a}
tr.inativo td .meta{color:#8a8a8a}
.tag{color:#fff!important}
.dica-rola{display:none;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
@media (max-width:700px){.dica-rola{display:block}}
/* cabeçalho compacto */
.demo-bar{padding:3px 16px;font-size:11px;gap:8px;background:#002620}
.demo-bar button{padding:1px 7px;font-size:11px}
header{padding:6px 16px;gap:10px;border-bottom-width:2px}
header .logo{font-size:19px}
header .logo span.marca{width:30px!important;height:26px!important}
header .who .av{width:28px;height:28px;font-size:11px}
header .who .nm{font-size:13px;line-height:1.15;display:flex;align-items:center;gap:6px}
header .who .nm br{display:none}
header.emb{padding:4px 12px;background:#002620;border-bottom-width:1px}
.demo-mini{font-size:11px;color:#f4efebb3;display:flex;align-items:center;gap:8px;white-space:nowrap}
.demo-mini button{background:transparent;border:1px solid #f4efeb55;color:#f4efeb;border-radius:6px;padding:1px 7px;font-size:11px;cursor:pointer}
nav button{padding:9px 12px}
@media (max-width:640px){
  .demo-bar{font-size:10px;padding:3px 10px}
  header{padding:5px 10px}
  header .logo{font-size:16px}
  header .logo small{display:none}
  header .who .nm{display:none}
  .demo-mini button{display:none}
  nav button{padding:8px 10px;font-size:13px}
  .toolbar .combo{min-width:0;flex:1 1 calc(50% - 8px)}
  .toolbar .combo-in{font-size:13px}
}
.graf-rola{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
#dicaGraf{position:fixed;z-index:9999;pointer-events:none;display:none;background:#002620;color:#fff;font-size:12px;line-height:1.45;padding:7px 10px;border-radius:8px;white-space:pre-line;box-shadow:0 4px 14px #00262033;max-width:260px}
/* ===== Identidade visual Renata Campos · Inteligência Financeira ===== */
:root{--ouro:#efbb3c;--cobre:#c37f36;--terra:#702b16;--creme:#f4efeb;--line:#c37f3640;--muted:#002620b3;--text:#002620}
body{font-family:'Poppins',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,.modal h3,.login h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;letter-spacing:.2px}
h2{font-size:24px}.login h1{font-size:28px}.modal h3{font-size:22px}
header{background:#002620;color:var(--creme);border-bottom:3px solid var(--ouro)}
header .meta,header small{color:#f4efebb3!important}
header .btn{background:transparent;color:var(--creme);border-color:#f4efeb55}
header .btn:hover{border-color:var(--ouro)}

nav button.on{color:#002620;border-color:var(--cobre)}
.btn.pri{color:var(--creme)}
.btn.pri:hover{background:#002620;border-color:#002620;filter:none}
.badge{background:#efbb3c33;color:#702b16}
header .badge,.appbar .badge{background:#efbb3c!important;color:#002620!important}
header .av{background:#f4efeb!important;color:#002620!important}
.concPar tr.achou td{background:#e9f7ef}
.concPar td.meio{text-align:center;border-left:2px solid var(--line);border-right:2px solid var(--line);white-space:nowrap;width:1%}
.concPar td.meio .btn{display:block;margin:3px auto 0}
.achouTag{display:inline-block;font-size:11px;font-weight:600;color:#1a7f45;background:#d3f2df;border-radius:6px;padding:1px 6px}
.concPar td.procurar{color:var(--muted)}
.cf-aviso{margin:0 0 8px;padding:7px 10px;border-radius:8px;background:#efbb3c26;border:1px solid #efbb3c;font-size:13px;color:var(--text)}
.cf-aviso a{font-weight:600;margin-left:4px}
.fc-cheia{position:fixed;inset:0;z-index:9;background:var(--bg,#f4efeb);margin:0!important;border:0!important;padding:12px 14px!important;overflow:auto}
.fc-cheia .fc-plan{max-height:calc(100vh - 110px)}
.fc-cheia{display:flex;flex-direction:column;overflow:hidden!important}
.fc-cheia .fc-plan{flex:1;min-height:0;max-height:none}
.fc-cheia>p.meta{margin:6px 0 0;font-size:11px}
.fc-plan.compacto th,.fc-plan.compacto td{min-width:0;padding:3px 5px;white-space:nowrap}
.fc-plan.compacto .fc-rot{min-width:150px;max-width:190px}
.fc-plan.compacto thead th{font-size:10.5px}
.fc-plan .dc{display:none}
.fc-plan.compacto .dc{display:inline}
.fc-plan.compacto .dl{display:none}
.fc-plan.compacto .c0{display:none}

// Estas regras serão aplicadas também no banco de dados na versão real.
const isAdmin = () => me?.perfil==='admin';
const isDono = () => me?.perfil==='dono';
const isProd = () => me?.perfil==='produtor';
const podeVer = p => isAdmin() || isDono() || p.criadoPor===me.id;
const podeAprovar = p => p.status==='aguardando' && (isDono() || isAdmin());
const podeEditar = p => isAdmin() || (isProd() && p.criadoPor===me.id && p.status==='aguardando');
const podeCancelar = p => p.status==='aguardando' && (isAdmin() || (isProd() && p.criadoPor===me.id));
const podePagar = p => isAdmin() && p.status==='aprovado';

function visiveis(){ return db.pedidos.filter(podeVer); }
function filtrar(lista, {status=true, periodo=true}={}){
  return lista.filter(p =>
    (!periodo || passa(F.ano, p.vencimento.slice(0,4))) &&
    (!periodo || passa(F.mes, p.vencimento.slice(5,7))) &&
    passa(F.evento, p.eventoId) &&
    passa(F.categoria, p.categoria) &&
    (!status || passa(F.status, p.status)));
}

function render(){
  const app = document.getElementById('app');
  if (cadastroPor){ app.innerHTML = demoBar() + telaAutocadastro(); turbinarSelects(app); return; }
  // com login real: a pessoa do cliente entra direto no perfil cadastrado com o e-mail dela
  if (!me && window.NUVEM && !window.NUVEM.gestora){ const meus = usuariosDoLogin(); if (meus.length === 1){ me = meus[0]; view = 'dashboard'; } }
  if (!me){ app.innerHTML = demoBar() + telaLogin(); return; }
  if (!render._puxou && NAPI() && isAdmin()){ render._puxou = true; setTimeout(puxarEnvios, 300); }
  const abas = [['dashboard','Dashboard'],['lista', isProd()?'Meus pedidos':'Contas a pagar']];
  if (!isProd()) abas.splice(2,0,['aprovacoes','Aprovações ('+db.pedidos.filter(p=>p.status==='aguardando').length+')']);
  if (isAdmin()) abas.splice(2,0,['receber','Contas a receber'],['conciliacao','Conciliação']);
  if (isAdmin()) abas.push(['fluxo','Fluxo de caixa']);
  if (!isProd()) abas.push(['eventos','Eventos']);
  abas.push(['pessoas', 'Pessoas']);
  if (isAdmin()) abas.push(['usuarios','Equipe']);
  if (!abas.some(a=>a[0]===view) && !(view==='conciliacao' && isAdmin())) view='dashboard';
  const emb = (()=>{ try{ return window.self !== window.top; }catch(e){ return true; } })();
  app.innerHTML = (emb ? '' : demoBar()) + `
  <header class="${emb?'emb':''}">
    ${emb ? (window.NUVEM ? `<div class="demo-mini">☁ Dados na nuvem · v${APP_VERSAO}</div>` : `<div class="demo-mini" title="Dados fictícios, salvos só neste navegador">🧪 Demonstração · v${APP_VERSAO} <button data-act="reset" title="Restaurar dados de exemplo">↺ Restaurar exemplo</button></div>`)
          : `<div class="logo"><span class="marca">$</span>Pagamentos de Eventos <small class="meta" style="font-weight:400" title="Versão do app">v${APP_VERSAO}</small></div>`}
    <div class="who"><div class="av">${iniciais(me.nome)}</div><div class="nm">${h(me.nome)}<br><span class="badge">${PERFIS[me.perfil]}</span></div>
    <button class="btn sm" data-act="sair">Sair</button></div>
  </header>
  <nav>${abas.map(([k,n])=>`<button class="${view===k?'on':''}" data-act="aba" data-id="${k}">${n}</button>`).join('')}</nav>
  <main>${({kanban:telaKanban,conciliacao:telaConciliacao,aprovacoes:telaAprovacoes,lista:telaLista,receber:telaReceber,dashboard:telaDash,fluxo:telaFluxo,eventos:telaEventos,pessoas:telaPessoas,usuarios:telaUsuarios})[view]()}</main>`;
  turbinarSelects(app); filtrosDeColuna(app); fcAjustar();
}

  return `<div class="demo-bar">🧪 Versão de demonstração — dados fictícios, salvos só neste navegador.
    <button data-act="reset">Restaurar dados de exemplo</button>${cadastroPor?'<button data-act="sairAuto">Sair do formulário de autocadastro</button>':''}</div>`;

function usuariosDoLogin(){
  const ativos = db.users.filter(u=>u.ativo!==false);
  if (!window.NUVEM || window.NUVEM.gestora) return ativos;
  const em = String(window.NUVEM.email||'').toLowerCase();

function csvReceber(){
  const linhas = [['Data','Nº','Nome do evento','Data do evento','Valor','Centro de custo','Origem','Descrição','Forma','Situação','Banco']];
  (db.recebimentos||[]).forEach(x=>{ const d=x.recebidoEm||x.previsto; if(!(passa(F.ano,d.slice(0,4))&&passa(F.mes,d.slice(5,7))&&passa(F.evento,x.eventoId))) return;
    const e=evento(x.eventoId); linhas.push([fmt(d),x.id,e.nome,e.data?fmt(e.data):'',x.valor.toFixed(2).replace('.',','),e.centroCusto||'',x.origem,x.descricao,x.forma,x.status==='cancelado'?'Recusado':x.recebidoEm?'Recebido':(x.previsto<HOJE?'Atrasado':'A receber'),x.banco||'']); });
  const csv = '\ufeff'+linhas.map(l=>l.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = 'contas_a_receber.csv'; a.click();
}
// Coluna "Pagamento" de Contas a pagar: botão ✓ Pago (gestora), situação do pagamento e etiqueta de atraso — com filtro
function celPagamento(p){
  const atr = atrasadoPag(p), tagA = atr?'<span class="tag" style="background:var(--recusado)">⏰ Atrasado</span> ':'';
  let v, html;
  if (p.status==='pago'){ v='Pago'; const d=dataPagamento(p); html=`<span class="meta">✓ Pago${d?' em '+fmt(String(d).slice(0,10)):''}</span>`; }
  else if (p.status==='aprovado'){ v=atr?'Atrasado':'A pagar'; html=(atr?tagA:'<span class="tag" style="background:var(--aprovado)">A pagar</span> ')+(podePagar(p)?`<button class="btn sm" data-act="pagarConf" data-id="${p.id}" title="Registrar o pagamento">Marcar como pago</button>`:''); }
  else if (p.status==='aguardando'){ v=atr?'Aguardando aprovação · atrasado':'Aguardando aprovação'; html=tagA+'<span class="meta">Aguardando aprovação</span>'; }
  else { v='Recusado / cancelado'; html=`<span class="meta">${STATUS[p.status].nome}</span>`; }
  return `<td data-v="${v}" style="white-space:nowrap">${html}</td>`;
}

const SEL = new Set();

function selAtualizar(){
  const vis = selVisiveis(), marcadas = vis.filter(c=>c.checked);
  const todos = document.querySelector('input[data-sel-todos]');
  if (todos){ todos.checked = vis.length>0 && marcadas.length===vis.length; todos.indeterminate = marcadas.length>0 && marcadas.length<vis.length; }
  ['btnExclSel','btnEditSel'].forEach(idb=>{ const b = document.getElementById(idb); if (b){ b.style.display = marcadas.length?'':'none'; b.querySelector('[data-sel-n]').textContent = marcadas.length; } });
  document.querySelectorAll('input[data-sel]').forEach(c=>c.closest('tr').classList.toggle('sel-on', c.checked));
}
document.addEventListener('change', e => {

function docValido(d){

    s=0; for (let i=0;i<10;i++) s += +d[i]*(11-i); r=(s*10)%11%10; return r === +d[10]; }
  if (d.length===14){ if (/^(\d)\1+$/.test(d)) return false;
    const dv = n => { const w = n===12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2]; let s=0; for (let i=0;i<n;i++) s += +d[i]*w[i]; const r=s%11; return r<2 ? 0 : 11-r; };

      const p = {nome:v('nome'), doc, funcao:v('funcao'), tel:v('tel'), email:v('email'), pix:v('pix'), pixTipo:v('pixTipo'), banco:v('banco'), agencia:v('agencia'), conta:v('conta'), tipoConta:v('tipoConta')};
      if (!p.pixTipo) p.pixTipo = tipoPix(p.pix);
      const it = {linha: hdr+n+2, p, status:'ok', motivo:''}, kn = semAcento(p.nome).replace(/\s+/g,' ').trim();
      if (!p.nome) { it.status='erro'; it.motivo='sem nome'; }
      else if (!docN) { it.status='erro'; it.motivo='sem CPF/CNPJ'; }
      else if (docsApp[docN]) { it.status='ja'; it.motivo='já cadastrado como '+docsApp[docN].nome; }
      else if (!docValido(docN)) { it.status='erro'; it.motivo='CPF/CNPJ inválido'; }
      else if (nomesApp[kn]) { it.status='ja'; it.motivo='já existe alguém com este nome'; }
      else if (vistos[docN]) { it.status='ja'; it.motivo='repetido na planilha (linha '+vistos[docN]+')'; }
      if (docN && !vistos[docN]) vistos[docN] = it.linha;
      itens.push(it);
    });
    if (!itens.length) return toast('A planilha não tem nenhuma pessoa.');
    IMP_PES = itens; conferirPessoas(file.name);
  } catch(e){ console.error(e); toast('Não consegui ler o arquivo: ' + e.message); }
}

function modal(html, largura){ fechar(); const o=document.createElement('div'); o.className='overlay'; o.id='ov'; o.innerHTML=`<div class="modal" ${largura?`style="max-width:${largura}px"`:''}>${html}</div>`; // fecha clicando fora só se: o clique começou e terminou no fundo, não foi na barra de rolagem, e nada foi digitado no formulário
  let fora=false, mexeu=false; o.addEventListener('input',()=>{ mexeu=true; }); o.addEventListener('change',()=>{ mexeu=true; });
  o.addEventListener('mousedown',e=>{ fora = e.target===o && e.clientX < o.clientWidth && e.clientY < o.clientHeight; });
  o.addEventListener('click',e=>{ if(fora && e.target===o){ if(mexeu) toast('Para fechar sem salvar, use o botão Cancelar'); else fechar(); } fora=false; }); document.body.appendChild(o); turbinarSelects(o); filtrosDeColuna(o); }

// ================= FILTRO DE MÚLTIPLA ESCOLHA =================
// Para <select multiple>: abre uma lista com caixinhas de marcar + campo de busca.
// data-ph = texto quando nada está marcado; data-live="1" = aplica na hora (sem botão Aplicar).
function multiCombo(sel){
  const wrap = document.createElement('div'); wrap.className = 'combo ms';
  sel.parentNode.insertBefore(wrap, sel);
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'combo-in ms-btn';
  const painel = document.createElement('div'); painel.className = 'ms-painel';
  wrap.append(btn, sel); sel.classList.add('combo-sel'); sel.tabIndex = -1;
  const live = sel.dataset.live === '1', ph = sel.dataset.ph || 'Todos';
  const resumo = () => { const s = [...sel.selectedOptions];
    btn.classList.toggle('ativo', s.length > 0);
    btn.textContent = !s.length ? ph : s.length <= 2 ? s.map(o=>o.text).join(', ') : s.length + ' selecionados';
    btn.title = s.map(o=>o.text).join(', '); };
  resumo();
  let aberto = false, mudou = false, busca = '';
  const desenhar = () => { const f = semAcento(busca);
    const ops = [...sel.options].filter(o => !f || semAcento(o.text).includes(f));
    painel.querySelector('.ms-ops').innerHTML = ops.map(o=>`<label class="ms-op"><input type="checkbox" data-v="${h(o.value)}" ${o.selected?'checked':''}><span>${h(o.text)}</span></label>`).join('')
      || '<div class="combo-vazio">Nenhum resultado</div>'; };
  const reposicionar = () => { const r = btn.getBoundingClientRect();
    painel.style.minWidth = Math.max(r.width, 220) + 'px';
    painel.style.left = Math.max(8, Math.min(r.left, innerWidth - painel.offsetWidth - 8)) + 'px';
    painel.style.top = (r.bottom + 4) + 'px'; };
  const fora = e => { if (!painel.contains(e.target) && !btn.contains(e.target)) fechar(); };
  const fechar = () => { if (!aberto) return; aberto = false; painel.remove();
    document.removeEventListener('mousedown', fora, true); window.removeEventListener('scroll', reposicionar, true);
    if (mudou){ mudou = false; sel.dispatchEvent(new Event('change', {bubbles:true})); } };
  const avisar = () => { resumo(); if (live) sel.dispatchEvent(new Event('change', {bubbles:true})); else mudou = true; };
  btn.addEventListener('click', () => {
    if (aberto) return fechar();
    aberto = true; busca = '';
    painel.innerHTML = `<input class="ms-busca" placeholder="Digite para buscar…"><div class="ms-acoes"><a href="#" data-ms="todos">Marcar todos</a><a href="#" data-ms="limpar">Limpar</a></div><div class="ms-ops"></div>${live?'':'<div class="ms-rodape"><button type="button" class="btn sm pri" data-ms="ok">Aplicar</button></div>'}`;
    document.body.appendChild(painel); desenhar(); reposicionar();
    painel.querySelector('.ms-busca').focus();
    document.addEventListener('mousedown', fora, true); window.addEventListener('scroll', reposicionar, true);
  });
  painel.addEventListener('input', e => { if (e.target.classList.contains('ms-busca')){ busca = e.target.value; desenhar(); } });
  painel.addEventListener('change', e => { const v = e.target.dataset.v; if (v === undefined) return; e.stopPropagation();
    const o = [...sel.options].find(o=>o.value===v); if (o){ o.selected = e.target.checked; avisar(); } });
  painel.addEventListener('click', e => { const a = e.target.closest('[data-ms]'); if (!a) return; e.preventDefault(); e.stopPropagation();
    if (a.dataset.ms === 'ok') return fechar();
    const visiveis = [...painel.querySelectorAll('.ms-ops input')].map(i=>i.dataset.v);
    [...sel.options].forEach(o => { if (a.dataset.ms === 'limpar') o.selected = false; else if (visiveis.includes(o.value)) o.selected = true; });
    desenhar(); avisar(); });
  painel.addEventListener('keydown', e => {
    if (e.key === 'Escape') fechar();
    if (e.key === 'Enter'){ e.preventDefault(); const p = painel.querySelector('.ms-ops input'); if (busca && p) p.click(); else fechar(); } });
}

// ================= FILTRO POR COLUNA NAS TABELAS =================
// Em toda tabela com a classe "filtravel" aparece, embaixo dos títulos, um campo por coluna.
// É só digitar: o sistema sugere os nomes daquela coluna e esconde as linhas que não combinam.
const CFS = {};
const VAZIO = '\u2205vazio';   // valor do filtro de coluna para células em branco   // lembra o que foi digitado em cada tabela, mesmo quando a tela é redesenhada
function filtrosDeColuna(root){
  root.querySelectorAll('table.filtravel:not([data-cf])').forEach(tb => {
    tb.dataset.cf = '1';
    const key = tb.dataset.key, st = CFS[key] || (CFS[key] = {});
    const linhas = () => [...tb.tBodies[0].rows].filter(r => !r.querySelector('.empty'));
    // valor "principal" da célula (data-v quando existir, senão a 1ª linha do texto)
    const valor = (r, i) => { const c = r.cells[i]; const v = c ? (c.dataset.v ?? (c.innerText||'').split('\n')[0].trim()) : ''; return /^[—–-]?$/.test(v) ? VAZIO : v; };
    const linha = document.createElement('tr'); linha.className = 'cf-row';
    [...tb.tHead.rows[0].cells].forEach((th, i) => {
      const c = document.createElement('th');
      const titulo = th.textContent.trim();
      if (titulo){
        const todos = linhas().map(r => valor(r,i)), valores = [...new Set(todos.filter(v=>v!==VAZIO))].sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true}));
        if (todos.includes(VAZIO)) valores.unshift(VAZIO);
        c.innerHTML = `<select multiple data-col="${i}" data-live="1" data-ph="🔍 ${h(titulo)}">${valores.map(v=>`<option value="${h(v)}" ${(st[i]||[]).includes(v)?'selected':''}>${v===VAZIO?'(vazio)':h(v)}</option>`).join('')}</select>`;
      }
      linha.appendChild(c);
    });
    tb.tHead.appendChild(linha);
    turbinarSelects(linha);
    const aplicar = () => {
      const fs = Object.entries(st).map(([c,v]) => [+c, v]).filter(([,v]) => v && v.length);
      let n = 0, tot = 0;
      linhas().forEach(r => {
        const ok = fs.every(([c,v]) => v.includes(valor(r,c)));
        r.style.display = ok ? '' : 'none';
        if (ok){ n++; tot += +(r.dataset.valor||0); }
      });
      const cnt = tb.querySelector('[data-cnt]'); if (cnt) cnt.textContent = n+' '+cnt.dataset.cnt;
      const tt = tb.querySelector('[data-tot]'); if (tt) tt.textContent = brl(tot);
      let vazio = tb.tBodies[0].querySelector('.cf-vazio');
      if (!n && linhas().length){ if(!vazio){ vazio=document.createElement('tr'); vazio.className='cf-vazio'; vazio.innerHTML=`<td colspan="${tb.tHead.rows[0].cells.length}" class="empty">Nada encontrado com esse filtro</td>`; tb.tBodies[0].appendChild(vazio);} }
      else if (vazio) vazio.remove();
      // aviso de quais colunas estão filtrando (os filtros somam: a linha precisa passar em todos)
      let av = tb.previousElementSibling && tb.previousElementSibling.classList.contains('cf-aviso') ? tb.previousElementSibling : null;
      if (fs.length){
        if (!av){ av = document.createElement('div'); av.className = 'cf-aviso'; tb.parentNode.insertBefore(av, tb); }
        const nomes = [...tb.tHead.rows[0].cells].map(th=>th.textContent.trim());
        av.innerHTML = `🔎 Filtrando por <b>${fs.map(([c,v])=>h(nomes[c]||'coluna')+': '+h((x=>x.length>2?x.slice(0,2).join(', ')+' +'+(x.length-2):x.join(', '))(v.map(y=>y===VAZIO?'(vazio)':y)))).join('</b> e <b>')}</b> — mostrando ${n} de ${linhas().length}. <a href="#" data-cflimpa="1">Limpar filtros das colunas</a>`;
        av.querySelector('[data-cflimpa]').onclick = e => { e.preventDefault(); delete CFS[key]; render(); };
      } else if (av) av.remove();
    };
    tb.addEventListener('change', e => { const c = e.target.dataset.col; if (c !== undefined){ st[c] = [...e.target.selectedOptions].map(o=>o.value); aplicar(); } });
    aplicar();
  });
}

// ================= CAMPO DE ESCOLHA COM BUSCA =================
// Transforma todo <select> em um campo onde dá para digitar e o sistema sugere os nomes.
// O <select> original continua escondido por baixo, então formulários e filtros funcionam igual.
const semAcento = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function turbinarSelects(root){
  root.querySelectorAll('select:not([data-combo])').forEach(sel => {
    sel.dataset.combo = '1';
    if (sel.multiple) return multiCombo(sel);
    const wrap = document.createElement('div'); wrap.className = 'combo';
    sel.parentNode.insertBefore(wrap, sel);
    const inp = document.createElement('input');
    inp.type = 'text'; inp.className = 'combo-in'; inp.autocomplete = 'off'; inp.spellcheck = false;
    const vazio = [...sel.options].find(o=>o.value==='');
    inp.placeholder = (vazio && vazio.text !== '—' ? vazio.text : 'Digite para buscar…');
    inp.disabled = sel.disabled;
    const lista = document.createElement('div'); lista.className = 'combo-list';
    wrap.append(inp, lista, sel);           // o campo de texto vem antes para o rótulo focar nele
    sel.classList.add('combo-sel'); sel.tabIndex = -1;
    if (sel.required){ inp.required = true; sel.required = false; }
    const opts = () => [...sel.options];
    const textoAtual = () => { const o = sel.selectedOptions[0]; return o && o.value!=='' ? o.text : ''; };
    inp.value = textoAtual();
    let vis = [], ativo = -1;
    const desenhar = filtro => {
      const f = semAcento(filtro||'');
      vis = opts().filter(o => !f || semAcento(o.text).includes(f));
      lista.innerHTML = vis.map((o,i)=>`<div class="combo-op${o.value===sel.value?' sel':''}${i===ativo?' at':''}" data-i="${i}">${h(o.text)}</div>`).join('')
        || '<div class="combo-vazio">Nenhum resultado para "'+h(filtro)+'"</div>';
      lista.style.display = 'block';
      lista.querySelector('.at')?.scrollIntoView({block:'nearest'});
    };
    const escolher = o => {
      lista.style.display = 'none';
      inp.value = o.value==='' ? '' : o.text;
      if (o.value !== sel.value){ sel.value = o.value; sel.dispatchEvent(new Event('change',{bubbles:true})); }
    };
    inp.addEventListener('focus', () => { ativo = -1; desenhar(''); setTimeout(()=>inp.select(),0); });
    inp.addEventListener('input', () => { ativo = 0; desenhar(inp.value); });
    inp.addEventListener('keydown', e => {
      if (e.key==='ArrowDown'){ ativo = Math.min(ativo+1, vis.length-1); desenhar(inp.value); e.preventDefault(); }
      else if (e.key==='ArrowUp'){ ativo = Math.max(ativo-1, 0); desenhar(inp.value); e.preventDefault(); }
      else if (e.key==='Enter'){ if (lista.style.display==='block' && vis[ativo]) { escolher(vis[ativo]); } e.preventDefault(); }
      else if (e.key==='Escape'){ lista.style.display='none'; inp.value = textoAtual(); }
    });
    lista.addEventListener('mousedown', e => { const d = e.target.closest('.combo-op'); e.preventDefault(); if (d) { escolher(vis[+d.dataset.i]); inp.blur(); } });
    inp.addEventListener('blur', () => {
      lista.style.display = 'none';
      const t = semAcento(inp.value.trim());
      if (!t){ if (vazio && sel.value!=='') escolher(vazio); inp.value = textoAtual(); return; }

function salvarLote(lista){
  const d = Object.fromEntries(new FormData(document.getElementById('fLote')));

  if (d.eventoId) novo.eventoId = d.eventoId==='_empresa' ? '' : d.eventoId;
  ['categoria','vencimento','forma','pessoaId'].forEach(k=>{ if (d[k]) novo[k] = d[k]; });
  if (d.centroCusto) novo.centroCusto = d.centroCusto==='_limpar' ? '' : d.centroCusto;
  if ((d.descricao||'').trim()) novo.descricao = d.descricao.trim();
  if (!Object.keys(novo).length) return toast('Preencha pelo menos um campo para alterar.');
  const rot = {eventoId:['Evento',v=>evento(v).nome||'sem evento'],pessoaId:['Favorecido',v=>pessoa(v).nome],categoria:['Categoria',v=>v||'—'],vencimento:['Vencimento',v=>fmt(v)],forma:['Forma',v=>v],descricao:['Descrição',v=>v||'—'],centroCusto:['Centro de custo',v=>v||'—']};
  let n = 0;
  db.pedidos.filter(p=>lista.includes(p.id) && podeEditar(p)).forEach(p=>{
    const difs = Object.keys(novo).filter(k=>String(p[k]??'')!==String(novo[k])).map(k=>`${rot[k][0]}: ${rot[k][1](p[k])} → ${rot[k][1](novo[k])}`);
    if (!difs.length) return;
    Object.keys(novo).forEach(k=>{ p[k] = novo[k]; });
    p.historico.push({quando:agora(), quem:me.id, acao:'Alterou em lote — '+difs.join('; ')}); n++;
  });
  save(); fechar(); SEL.clear(); render(); toast(n ? n+' conta(s) alterada(s)' : 'Nada mudou: as contas já tinham esses dados');
}
function salvarPedido(id){
  const f = document.getElementById('fPedido'); if(!f.reportValidity()) return;
  const d = Object.fromEntries(new FormData(f));
  const dados = {eventoId:d.eventoId==='_empresa'?'':d.eventoId,pessoaId:d.pessoaId,categoria:d.categoria,valor:Number(d.valor),vencimento:d.vencimento,forma:d.forma,descricao:d.descricao.trim(),link:urlOk(d.link),centroCusto:(d.centroCusto||'').trim(),
    extras:Object.fromEntries(extras().map(c=>[c.id,(d['cx_'+c.id]??'').trim()]).filter(([,v])=>v!==''))};
  // opções novas digitadas nas listas suspensas entram na lista para as próximas vezes
  if (dados.centroCusto && !centrosDeCusto().includes(dados.centroCusto)) db.centrosCusto = [...centrosDeCusto(), dados.centroCusto];
  extras().filter(c=>c.tipo==='lista').forEach(c=>{ const v=dados.extras[c.id]; if (v && !(c.opcoes||[]).includes(v)) c.opcoes=[...(c.opcoes||[]), v]; });
  if (id){
    const p = db.pedidos.find(x=>x.id===id); if(!podeEditar(p)) return;
    // registra no histórico exatamente o que mudou (antes → depois)
    const rotulos = {eventoId:['Evento',v=>evento(v).nome],pessoaId:['Favorecido',v=>pessoa(v).nome],categoria:['Categoria',v=>v],valor:['Valor',v=>brl(v)],vencimento:['Vencimento',v=>fmt(v)],forma:['Forma',v=>v],descricao:['Descrição',v=>v||'—'],centroCusto:['Centro de custo',v=>v||'—'],link:['Link',v=>v||'—']};
    const difs = Object.keys(rotulos).filter(k=>String(p[k]??'')!==String(dados[k]??'')).map(k=>`${rotulos[k][0]}: ${rotulos[k][1](p[k])} → ${rotulos[k][1](dados[k])}`);
    extras().forEach(c=>{ const a=(p.extras||{})[c.id]||'', b=dados.extras[c.id]||''; if (String(a)!==String(b)) difs.push(`${c.nome}: ${valorExtra(p,c)||'—'} → ${valorExtra({extras:dados.extras},c)||'—'}`); });
    if (!difs.length){ fechar(); return toast('Nenhum dado foi alterado.'); }
    Object.assign(p, dados);
    p.historico.push({quando:agora(),quem:me.id,acao:'Editou o pedido — '+difs.join('; ')});
    toast('Pedido atualizado');
  } else {
    // despesa mensal: um pedido por mês, mesmo dia de vencimento (dia 31 vira o último dia do mês)
    const n = d.repetir==='mes' ? Math.min(36, Math.max(2, parseInt(d.meses)||12)) : 1;
    const rec = n>1 ? 'RC-'+Date.now().toString(36) : '';
    let p;
    for (let i=0;i<n;i++){
      p = {id:'PG-'+String(db.seq++).padStart(4,'0'),...dados,vencimento:somaMeses(dados.vencimento,i),status:'aguardando',criadoPor:me.id,criadoEm:HOJE,historico:[{quando:agora(),quem:me.id,acao:n>1?`Criou o pedido (despesa mensal, mês ${i+1} de ${n})`:'Criou o pedido'}]};
      if (n>1){ p.recorrencia = rec; p.descricao = (dados.descricao?dados.descricao+' · ':'')+`mês ${i+1}/${n}`; }
      db.pedidos.push(p);
    }
    save(); fechar(); render();
    if (isProd()) compartilhar(true); else toast(n>1 ? `${n} pedidos mensais criados (de ${fmt(dados.vencimento)} a ${fmt(p.vencimento)}) e enviados para aprovação` : 'Pedido '+p.id+' enviado para aprovação');
    return;
  }
  save(); fechar(); render();
}

let IT = {evento:'', ate:'', novos:true, data:''};
const BANCOS_COD = {'itau':'341','itaú':'341','bradesco':'237','nubank':'260','banco do brasil':'001','bb':'001','caixa':'104','caixa economica':'104','santander':'033','inter':'077','banco inter':'077','c6':'336','c6 bank':'336','sicoob':'756','sicredi':'748','btg':'208','original':'212','safra':'422','pagbank':'290','pagseguro':'290','mercado pago':'323','neon':'735','banrisul':'041'};
const codBanco = b => { const t=String(b||'').trim(); if(/^\d{3}$/.test(t)) return t; const m=t.match(/^(\d{3})\b/); if(m) return m[1]; return BANCOS_COD[t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^banco /,'')] || BANCOS_COD[t.toLowerCase()] || ''; };
const soDig = v => String(v??'').replace(/\D/g,'');
function itauSelecao(){
  return db.pedidos.filter(p => p.status==='aprovado'
    && (!IT.evento || p.eventoId===IT.evento)
    && (!IT.ate || p.vencimento<=IT.ate)

    .sort((a,b)=>a.vencimento.localeCompare(b.vencimento));

// Decide como cada pedido entra no arquivo (ou por que fica de fora)
function itauItem(p){
  const pe = pessoa(p.pessoaId), doc = soDig(pe.doc);
  if (p.forma==='PIX'){
    if (!pe.pix) return {erro:'sem chave PIX'};
    if (!doc) return {erro:'sem CPF/CNPJ'};
    const t = pe.pixTipo || tipoPix(pe.pix);
    let tipo, chave;
    if (t==='E-mail'){ tipo='02'; chave=pe.pix.trim(); }
    else if (t==='Telefone'){ tipo='01'; const d=soDig(pe.pix); chave='+'+(d.startsWith('55')&&d.length>11?d:'55'+d); }
    else if (t==='CPF'||t==='CNPJ'){ tipo='03'; chave=soDig(pe.pix); }
    else { tipo='04'; chave=pe.pix.trim(); }
    return {tipo:'pix', forma:'45', chaveTipo:tipo, chave, doc};
  }
  if (p.forma==='Transferência'){
    const b = codBanco(pe.banco);
    if (!b) return {erro:'banco não reconhecido ('+(pe.banco||'vazio')+')'};
    if (!soDig(pe.agencia) || !soDig(pe.conta)) return {erro:'sem agência/conta'};
    if (!doc) return {erro:'sem CPF/CNPJ'};
    const [ct, dv] = String(pe.conta).split('-');
    return {tipo:'ted', forma: b==='341'?'01':'41', banco:b, agencia:soDig(pe.agencia), conta:soDig(ct), dac:soDig(dv), doc};
  }
  if (p.forma==='Boleto') return {erro:'boleto: o pedido não tem a linha digitável, pague pelo app do banco'};
  return {erro:'forma "'+p.forma+'" não vai para o banco'};
}

function cnab240(conta, itens, dataPg){
  const up = v => String(v??'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x20-\x7E]/g,' ').toUpperCase();
  const X = (v,n) => up(v).slice(0,n).padEnd(n,' ');
  const N = (v,n) => { const d=soDig(v); if(d.length>n) throw new Error('Número maior que o campo: '+v); return d.padStart(n,'0'); };
  const C = v => Math.round((+v||0)*100);
  const V = (v,n) => String(C(v)).padStart(n,'0');
  const D = iso => iso ? iso.slice(8,10)+iso.slice(5,7)+iso.slice(0,4) : '00000000';
  const ti = doc => soDig(doc).length===11 ? '1' : '2';
  const chk = r => { if(r.length!==240) throw new Error('Registro com '+r.length+' posições'); return r; };
  const sp = n => ' '.repeat(n), z = n => '0'.repeat(n);
  const agc = (b, ag, ct, dac) => {
    dac = soDig(dac) || ' ';
    if (b==='341'||b==='409') return '0'+N(ag,4)+' '+'000000'+N(ct,6)+' '+dac[0];
    return N(ag,5)+' '+N(ct,12)+' '+dac[0];
  };
  const agora = new Date(), hh = String(agora.getHours()).padStart(2,'0')+String(agora.getMinutes()).padStart(2,'0')+String(agora.getSeconds()).padStart(2,'0');
  const e = conta;
  const L = [];
  L.push(chk('341'+'0000'+'0'+sp(6)+'080'+ti(e.cnpj)+N(e.cnpj,14)+sp(20)+N(e.agencia,5)+' '+N(e.conta,12)+' '+N(e.dac,1)
    +X(e.nome,30)+X('BANCO ITAU SA',30)+sp(10)+'1'+D(HOJE)+hh+z(9)+z(5)+sp(69)));
  const grupos = {};
  itens.forEach(x=>{ (grupos[x.it.forma] = grupos[x.it.forma] || []).push(x); });
  let nl = 0;
  Object.entries(grupos).forEach(([forma, lista])=>{
    nl++;
    L.push(chk('341'+N(nl,4)+'1'+'C'+'20'+forma+'040'+' '+ti(e.cnpj)+N(e.cnpj,14)+sp(20)+N(e.agencia,5)+' '+N(e.conta,12)+' '+N(e.dac,1)
      +X(e.nome,30)+sp(30)+sp(10)+X('',30)+N(0,5)+X('',15)+X('',20)+N(0,8)+X('',2)+sp(8)+sp(10)));
    let seq = 0, soma = 0;
    lista.forEach(({p,it})=>{
      const fav = pessoa(p.pessoaId).nome, seu = p.id;
      const segA = (camara, banco, ag, tipoConta) => chk('341'+N(nl,4)+'3'+N(++seq,5)+'A'+'000'+N(camara,3)+N(banco,3)+ag
        +X(fav,30)+X(seu,20)+D(dataPg)+'REA'+X('',8)+X(tipoConta,2)+z(5)+V(p.valor,15)
        +sp(15)+sp(5)+z(8)+z(15)+sp(20)+z(6)+N(it.doc,14)+sp(2)+sp(5)+sp(5)+'0'+sp(10));
      if (it.tipo==='pix'){
        L.push(segA('009','000',agc('000',0,0,'0'),'04'));
        L.push(chk('341'+N(nl,4)+'3'+N(++seq,5)+'B'+it.chaveTipo+' '+ti(it.doc)+N(it.doc,14)+sp(30)+sp(65)+String(it.chave).slice(0,100).padEnd(100,' ')+sp(3)+sp(10)));
      } else {
        L.push(segA(it.banco==='341'?'000':'018', it.banco, agc(it.banco,it.agencia,it.conta,it.dac), '  '));
      }
      soma += C(p.valor);
    });
    L.push(chk('341'+N(nl,4)+'5'+sp(9)+N(seq+2,6)+String(soma).padStart(18,'0')+z(18)+sp(171)+sp(10)));
  });
  L.push(chk('341'+'9999'+'9'+sp(9)+N(nl,6)+N(L.length+1,6)+sp(211)));
  return L.join('\r\n')+'\r\n';
}
function gerarItau(){
  if (!isAdmin()) return;
  const cp = db.contaPagadora || {};
  const ok = itauSelecao().map(p=>({p, it:itauItem(p)})).filter(x=>!x.it.erro);
  if (!ok.length) return;
  let txt;
  try{ txt = cnab240(cp, ok, IT.data || HOJE); }catch(err){ return toast('Não foi possível gerar: '+err.message); }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download = `SISPAG_${(IT.data||HOJE).replace(/-/g,'')}.REM`; a.click();
  const quando = agora();
  ok.forEach(({p}) => { p.exportadoItau = quando; p.historico.push({quando, quem:me.id, acao:'Exportado no arquivo SISPAG Itaú'}); });
  save(); fechar(); render(); toast(ok.length+' pagamento(s) no arquivo do Itaú. Suba no Itaú Empresas e autorize.');
}
// Gera um arquivo .xlsx de verdade (sem bibliotecas externas)
function xlsx(cab, linhas, larguras){
  const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const col = i => String.fromCharCode(65+i);
  const cel = (v, ref, cabecalho) => {
    if (v===''||v==null) return '';
    if (cabecalho) return `<c r="${ref}" s="3" t="inlineStr"><is><t>${esc(v)}</t></is></c>`;
    if (typeof v==='number') return `<c r="${ref}" s="2"><v>${v}</v></c>`;
    if (v.d!==undefined) return `<c r="${ref}" s="1"><v>${v.d}</v></c>`;
    return `<c r="${ref}" s="4" t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
  };
  const rows = [cab, ...linhas].map((l,r)=>`<row r="${r+1}">${l.map((v,i)=>cel(v, col(i)+(r+1), r===0)).join('')}</row>`).join('');
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${larguras.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rows}</sheetData></worksheet>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="2" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="49" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/><xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs></styleSheet>`;
  return zipar([
    {name:'[Content_Types].xml', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:'_rels/.rels', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'xl/worksheets/sheet1.xml', data:sheet},
    {name:'xl/styles.xml', data:styles}
  ]);
}
// Compacta arquivos no formato ZIP (sem compressão) — um .xlsx é um ZIP de arquivos XML
const CRC_T = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();

function zipar(arquivos){
  const enc = new TextEncoder(), partes = [], central = []; let off = 0;
  for (const f of arquivos){
    const nome = enc.encode(f.name), dado = enc.encode(f.data), crc = crc32(dado);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,dado.length,true); lh.setUint32(22,dado.length,true); lh.setUint16(26,nome.length,true);
    partes.push(new Uint8Array(lh.buffer), nome, dado);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,dado.length,true); ch.setUint32(24,dado.length,true); ch.setUint16(28,nome.length,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer), nome);
    off += 30 + nome.length + dado.length;
  }
  const tam = central.reduce((a,b)=>a+b.length,0);
  const fim = new DataView(new ArrayBuffer(22));
  fim.setUint32(0,0x06054b50,true); fim.setUint16(8,arquivos.length,true); fim.setUint16(10,arquivos.length,true); fim.setUint32(12,tam,true); fim.setUint32(16,off,true);
  return new Blob([...partes, ...central, new Uint8Array(fim.buffer)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

// ================= CONCILIAÇÃO BANCÁRIA (só gestora) =================
// Importa o extrato do banco (OFX, CSV ou Excel), sugere automaticamente qual pedido corresponde a cada
// saída (mesmo valor + data próxima + nome do favorecido) e permite conciliar manualmente.
const CONC_TOL_DIAS = 0;   // regra da gestora: sugestão só com a mesma data
let IMP = null;   // planilha aguardando a escolha das colunas
const diasEntre = (a,b) => Math.abs((new Date(a+'T12:00:00') - new Date(b+'T12:00:00'))/864e5);
const pedidosConciliaveis = () => db.pedidos.filter(p => ['aprovado','pago'].includes(p.status) && !p.conc);
const txPendentes = () => db.extrato.filter(t => !t.pedidoId && !t.ignorado && t.valor < 0);
const PALAVRAS_VAZIAS = ['ltda','pix','ted','doc','pagamento','pgto','pag','transf','transferencia','enviado','enviada','para','com','dos','das','sa','me','eireli','banco'];
const tokens = s => semAcento(s).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w => w.length>=3 && !PALAVRAS_VAZIAS.includes(w));
const simNome = (desc, nome) => { const a = new Set(tokens(desc)); return tokens(nome).filter(w => a.has(w)).length; };

// nome do favorecido no banco × cadastro: o primeiro nome e pelo menos mais um nome precisam bater (aceita 1 letra de diferença, ex.: Herreira × Herrera)
const PARTICULAS = ['da','de','do','das','dos','e'];
const nomesDe = s => semAcento(s).replace(/[^a-z ]/g,' ').split(/\s+/).filter(w => w.length>=2 && !PARTICULAS.includes(w));
function quaseIgual(a, b){ if (a===b) return true; const tol = Math.min(a.length,b.length) >= 6 ? 1 : 0; if (!tol || Math.abs(a.length-b.length) > tol) return false;
  const d = Array.from({length:a.length+1},(_,i)=>[i]); for (let j=1;j<=b.length;j++) d[0][j]=j;
  for (let i=1;i<=a.length;i++) for (let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length] <= tol; }
function mesmoFavorecido(t, pe){
  const doc = (pe.doc||'').replace(/\D/g,''); if (doc.length>=11 && String(t.desc||'').replace(/\D/g,'').includes(doc)) return true;
  const cad = nomesDe(pe.nome), banco = nomesDe([t.fav, t.desc].filter(Boolean).join(' ')); if (!cad.length || !banco.length) return false;
  const tem = w => banco.some(x => quaseIgual(w, x));
  if (!tem(cad[0])) return false;
  return cad.length === 1 || cad.slice(1).some(tem);
}
// sugestão: mesmo favorecido e mesmo valor são obrigatórios; a data (pagamento ou, se ainda não foi pago, vencimento)
// pode ter até CONC_TOL_DIAS dias de diferença — quando há mais de um pedido possível, fica o de data mais próxima
function sugestoes(){
  const usados = new Set(), out = [], cands = pedidosConciliaveis();
  txPendentes().sort((a,b)=>a.data.localeCompare(b.data)).forEach(t => {
    const v = Math.round(-t.valor*100);
    const ops = cands.filter(p => !usados.has(p.id) && Math.round(p.valor*100)===v && !(t.rejeitados||[]).includes(p.id) && mesmoFavorecido(t, pessoa(p.pessoaId)))
      .map(p => ({p, d: diasEntre(t.data, (dataPagamento(p)||'').slice(0,10) || p.vencimento)})).filter(x => x.d <= CONC_TOL_DIAS).sort((a,b) => a.d - b.d);
    if (ops.length){ const m = ops[0]; usados.add(m.p.id);
      out.push({t, p:m.p, motivo:'mesmo favorecido · mesmo valor · ' + (m.d===0 ? 'mesma data' : `${Math.round(m.d)} dia(s) de diferença na data`)}); }
  });
  return out;
}
function conciliar(txId, pedidoId, modo){
  const t = db.extrato.find(x=>x.id===txId), p = db.pedidos.find(x=>x.id===pedidoId);
  if (!t || !p || p.conc || t.pedidoId) return false;
  const mudouStatus = p.status === 'aprovado';
  const dif = Math.round((-t.valor - p.valor)*100)/100;
  p.conc = {tipo:modo, txId, data:t.data, desc:t.desc, valorBanco:-t.valor, banco:t.banco||p.bancoPag||'', quando:agora(), quem:me.id, mudouStatus};
  if (mudouStatus){ p.status = 'pago'; p.pagoEm = t.data; p.historico.push({quando:agora(), quem:me.id, acao:`Marcou como pago (conciliação bancária — pago no banco em ${fmt(t.data)})`}); }
  p.historico.push({quando:agora(), quem:me.id, acao:`Conciliado ${modo==='auto'?'automaticamente':'manualmente'} com o extrato: ${t.desc} · ${brl(-t.valor)} · ${fmt(t.data)}${dif?` (diferença de ${brl(dif)} em relação ao pedido)`:''}`});
  t.pedidoId = p.id;
  return true;
}
function desfazerConc(pedidoId){
  const p = db.pedidos.find(x=>x.id===pedidoId); if (!p || !p.conc) return;
  const t = db.extrato.find(x=>x.pedidoId===pedidoId); if (t) t.pedidoId = null;
  if (p.conc.mudouStatus){ p.status = 'aprovado'; delete p.pagoEm; }
  p.historico.push({quando:agora(), quem:me.id, acao:'Desfez a conciliação bancária'+(p.conc.mudouStatus?' (voltou para "Aprovado · a pagar")':'')});
  delete p.conc;
}

// ---- leitura de arquivos ----
async function lerTexto(file){ const b = await file.arrayBuffer();
  try { return new TextDecoder('utf-8',{fatal:true}).decode(b); } catch(_) { return new TextDecoder('windows-1252').decode(b); } }
function parseValor(s){
  if (typeof s === 'number') return s;
  s = String(s||'').trim(); if (!s) return NaN;
  const neg = /^\(.*\)$/.test(s) || s.includes('-') || /\sD$/i.test(s) || /^D\s/i.test(s);
  s = s.replace(/[^\d.,]/g,'');
  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const v = parseFloat(s); return isNaN(v) ? NaN : (neg ? -v : v);
}
function parseData(v){
  if (typeof v === 'number' && v > 20000 && v < 80000) return new Date(Date.UTC(1899,11,30) + v*864e5).toISOString().slice(0,10);
  const s = String(v||'').trim(); let m;
  if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))){ let y = m[3]; if (y.length===2) y = '20'+y; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  return '';
}
function lerOFX(txt){
  const tag = (b,t) => { const m = b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i')); return m ? m[1].trim() : ''; };
  return txt.split(/<STMTTRN>/i).slice(1).map(b => {
    let v = parseValor(tag(b,'TRNAMT')); const tipo = tag(b,'TRNTYPE').toUpperCase();
    if (v > 0 && ['DEBIT','PAYMENT','CHECK','ATM','POS','FEE','SRVCHG','DIRECTDEBIT'].includes(tipo)) v = -v;
    const d = tag(b,'DTPOSTED');
    return {data:`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`, valor:v, desc:[tag(b,'NAME'),tag(b,'MEMO')].filter(Boolean).join(' — ') || tipo, fitid:tag(b,'FITID')};
  }).filter(t => /^\d{4}-\d{2}-\d{2}$/.test(t.data) && !isNaN(t.valor) && t.valor);
}
function lerCSV(txt){
  txt = txt.replace(/^﻿/,'');
  const prim = txt.split(/\r?\n/)[0] || '', cnt = c => prim.split(c).length;
  const sep = [';','\t',','].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows = []; let row = [], cel = '', q = false;
  for (let i=0; i<txt.length; i++){ const c = txt[i];
    if (q){ if (c==='"'){ if (txt[i+1]==='"'){ cel+='"'; i++; } else q = false; } else cel += c; }
    else if (c==='"') q = true;
    else if (c===sep){ row.push(cel); cel=''; }
    else if (c==='\n' || c==='\r'){ if (c==='\r' && txt[i+1]==='\n') i++; row.push(cel); rows.push(row); row=[]; cel=''; }
    else cel += c; }
  if (cel || row.length){ row.push(cel); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim()));
}
async function lerXLSX(buf){
  if (typeof DecompressionStream === 'undefined') throw new Error('este navegador não abre Excel aqui — salve a planilha como CSV e importe de novo');
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1; for (let i=u8.length-22; i>=Math.max(0,u8.length-66000); i--){ if (dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }

  for (let k=0; k<n; k++){
    const met=dv.getUint16(off+10,true), cs=dv.getUint32(off+20,true), nl=dv.getUint16(off+28,true), el=dv.getUint16(off+30,true), cl=dv.getUint16(off+32,true), lo=dv.getUint32(off+42,true);
    arqs[new TextDecoder().decode(u8.subarray(off+46, off+46+nl))] = {met, cs, lo}; off += 46+nl+el+cl; }
  const ler = async nome => { const a = arqs[nome]; if (!a) return null;
    const nl = dv.getUint16(a.lo+26,true), el = dv.getUint16(a.lo+28,true), ini = a.lo+30+nl+el, dados = u8.subarray(ini, ini+a.cs);
    if (a.met === 0) return new TextDecoder().decode(dados);
    return await new Response(new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text(); };
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const ss = []; const sst = await ler('xl/sharedStrings.xml');
  if (sst) [...xml(sst).getElementsByTagName('si')].forEach(si => ss.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join('')));
  let caminho = 'xl/worksheets/sheet1.xml';
  try { const wb = xml(await ler('xl/workbook.xml')), rid = wb.getElementsByTagName('sheet')[0].getAttribute('r:id');
    const rel = [...xml(await ler('xl/_rels/workbook.xml.rels')).getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===rid);
    if (rel){ const t = rel.getAttribute('Target').replace(/^\//,''); caminho = t.startsWith('xl/') ? t : 'xl/'+t; } } catch(_) {}
  const linhas = [];
  [...xml(await ler(caminho)).getElementsByTagName('row')].forEach(r => { const lin = [];
    [...r.getElementsByTagName('c')].forEach(c => {
      const col = (c.getAttribute('r')||'').replace(/\d+/g,'').split('').reduce((a,ch)=>a*26+ch.charCodeAt(0)-64, 0) - 1;
      const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0]?.textContent ?? '';
      const val = t==='s' ? (ss[+v] ?? '') : t==='inlineStr' ? [...c.getElementsByTagName('t')].map(x=>x.textContent).join('') : (t==='str'||t==='b'||t==='e') ? v : (v==='' ? '' : Number(v));
      lin[col >= 0 ? col : lin.length] = val; });
    linhas.push(Array.from(lin, x => x ?? '')); });
  return linhas.filter(r => r.some(c => String(c).trim()));
}
async function importarArquivo(file){
  const nome = file.name.toLowerCase();
  try {
    if (nome.endsWith('.ofx')) return adicionarTx(lerOFX(await lerTexto(file)), file.name);
    let linhas;
    if (nome.endsWith('.csv') || nome.endsWith('.txt')) linhas = lerCSV(await lerTexto(file));
    else if (nome.endsWith('.xlsx')) linhas = await lerXLSX(await file.arrayBuffer());
    else return toast('Formato não suportado. Use OFX, CSV ou Excel (.xlsx).');
    if (!linhas.length) return toast('A planilha está vazia.');
    mapearColunas(linhas, file.name);
  } catch(e){ console.error(e); toast('Não consegui ler o arquivo: ' + e.message); }
}
function mapearColunas(linhas, nomeArq){
  let hdr = linhas.slice(0,15).findIndex(r => r.some(c=>/data|date/i.test(c)) && r.some(c=>/valor|amount|d[eé]bito|cr[eé]dito|sa[ií]da/i.test(c)));
  const larg = Math.max(...linhas.map(r=>r.length));
  const cab = Array.from({length:larg}, (_,i) => hdr>=0 && String(linhas[hdr][i]||'').trim() ? String(linhas[hdr][i]).trim() : 'Coluna '+String.fromCharCode(65+i));
  const acha = (re, fora=[]) => cab.findIndex((c,i) => !fora.includes(i) && re.test(semAcento(c)));
  // data do pagamento de fato (quando a planilha tem data do pedido e data do pagamento)
  let cData = acha(/data.*(pagamento|liquida|efetiv|credito|debito)|pago em|paid/); if (cData < 0) cData = acha(/data|date|dt/);
  const cValor = acha(/valor|amount|montante|quantia/, [cData]);
  const cSit = acha(/^status|situacao|estado/, [cData]), cExtra = acha(/motivo da solic|motivo|referencia|observ|descri/, [cData]);
  const cDeb = acha(/debito|saida/, [cData]), cCred = acha(/credito|entrada/, [cData]);
  let cDesc = acha(/descri|historico|memo/, [cData]); if (cDesc < 0) cDesc = acha(/lancamento|detalhe|favorecido|nome/, [cData]);
  // relatório de saques/pagamentos (ex.: histórico de carteira): os valores vêm positivos, mas são saídas
  const vals = linhas.slice(hdr+1).map(r=>parseValor(r[cValor>=0?cValor:cDeb])).filter(v=>!isNaN(v) && v);
  const topo = semAcento(linhas.slice(0, Math.max(hdr,0)+1).flat().join(' ') + ' ' + linhas.slice(hdr+1, hdr+30).map(r=>r.join(' ')).join(' '));
  const saidas = cValor>=0 && vals.length && vals.every(v=>v>0) && /saque|pagamento|transferencia enviada|pix enviado|debito/.test(topo);

  <p class="meta" style="margin:-8px 0 10px">Já deixei marcado o que encontrei. Confira olhando o exemplo abaixo.</p>

    <label>Data *${sel('data', cData)}</label>
    <label>Descrição / histórico${sel('desc', cDesc, true)}</label>

    <label>Crédito/Entrada (se for coluna separada)${sel('cred', cValor>=0?-1:cCred, true)}</label>
    <label>Complemento da descrição${sel('extra', cExtra === cDesc ? -1 : cExtra, true)}</label>
    <label>Situação (linhas recusadas ou canceladas ficam de fora)${sel('sit', cSit, true)}</label>
    <label class="full" style="flex-direction:row;align-items:center;gap:8px;color:var(--text)"><input type="checkbox" name="inverter" ${saidas?'checked':''}><span>As saídas aparecem com valor positivo nesta planilha (inverter o sinal)${saidas?'<br><span class="meta">Marquei porque é um relatório de saques/pagamentos.</span>':''}</span></label>
  </form>
  <div style="overflow-x:auto;margin-top:10px"><table><thead><tr>${cab.map(c=>`<th>${h(c)}</th>`).join('')}</tr></thead><tbody>
    ${ex.map(r=>`<tr>${cab.map((_,i)=>`<td>${h(r[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="actions"><button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="confirmarMapa">Importar lançamentos</button></div>`, 760);
}
function confirmarMapa(){
  const d = lerForm('fMapa'); if (!d || !IMP) return;
  const ci = k => +d[k], txs = [];
  IMP.linhas.slice(IMP.hdr+1).forEach(r => {
    if (ci('sit') >= 0 && /recusad|cancelad|estornad|falh|negad|rejeitad|pendente|em analise|aguardando/.test(semAcento(String(r[ci('sit')]??'')))) return;
    const data = parseData(r[ci('data')]); if (!data) return;
    let valor;
    if (ci('cred') >= 0){ const deb = parseValor(r[ci('valor')]), cred = parseValor(r[ci('cred')]);
      valor = (isNaN(cred)?0:Math.abs(cred)) - (isNaN(deb)?0:Math.abs(deb)); }
    else valor = parseValor(r[ci('valor')]);
    if (d.inverter) valor = -valor;
    if (isNaN(valor) || !valor) return;
    const desc = [ci('desc')>=0 ? String(r[ci('desc')]??'').trim() : '', ci('extra')>=0 && ci('extra')!==ci('desc') ? String(r[ci('extra')]??'').replace(/\s+/g,' ').trim() : ''].filter(x=>x && x!=='-').join(' — ');
    const cFav = [ci('desc'), ci('extra')].find(i => i>=0 && /favorecido|benefici|recebedor|destinat|^nome/.test(semAcento(String((IMP.linhas[IMP.hdr]||[])[i]||''))));

function gravarTx(txs, origem, banco){
  const esp = x => semAcento(String(x||'')).replace(/\s+/g,' ').trim();
  const chave = t => t.fitid ? 'f:'+t.fitid : `${t.data}|${t.valor}|${esp(t.desc).split(' — ').map(x=>x.trim()).sort().join('|')}`;
  // quantas vezes cada lançamento já existe (a mesma pessoa pode receber duas vezes no mesmo dia com o mesmo valor)
  const ja = {}; db.extrato.forEach(x => { const k = chave(x); (ja[k] = ja[k] || []).push(x); });
  let novos = 0, rep = 0, atu = 0;
  txs.forEach(t => { const k = chave(t);
    if (ja[k] && ja[k].length){ const x = ja[k].shift(); if (t.fav && x.fav !== t.fav){ x.fav = t.fav; x.desc = t.desc; } rep++; return; }
    // o mesmo lançamento importado antes sem o nome do favorecido: só completa a descrição (e a data de pagamento)
    const velho = !t.fitid && db.extrato.find(x => !x.fav && !x._completo && x.valor===t.valor && x.desc && diasEntre(x.data, t.data) <= 3 && esp(t.desc).includes(esp(x.desc)) && esp(t.desc) !== esp(x.desc));
    if (velho){ velho.desc = t.desc; velho.data = t.data; if (t.fav) velho.fav = t.fav; velho._completo = true; atu++; return; }
    db.extrato.push({id:uid('t'), ...t, banco, origem, importadoEm:agora(), importadoPor:me.id}); novos++; });
  db.extrato.forEach(x => delete x._completo);
  save(); view = 'conciliacao'; render();
  toast(`${novos} lançamento(s) importado(s) de ${origem}${atu?` · ${atu} completado(s) com o favorecido`:''}${rep?` · ${rep} repetido(s) ignorado(s)`:''}`);
}

    + `</BANKTRANLIST>\n<LEDGERBAL><BALAMT>0.00<DTASOF>${dt(HOJE)}</LEDGERBAL>\n</STMTRS></STMTTRNRS></BANKMSGSRSV1>\n</OFX>\n`;
  const csv = 'Data;Histórico;Valor\n' + linhas.map(t=>`${fmt(t.data)};${t.desc};${t.valor.toFixed(2).replace('.',',')}`).join('\n');
  if (retornar) return {ofx, csv};
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ofx],{type:'application/x-ofx'})); a.download = 'extrato_exemplo.ofx'; a.click();

// ================= FORMULÁRIO POR LINK (pessoas sem login) =================
// O link abre formulario.html, que fala só com duas funções do banco: abrir o formulário e enviar.
// O que chega fica numa "caixa de entrada" na nuvem; o app de quem é admin puxa e transforma em pedido aguardando aprovação.
const NAPI = () => window.NUVEM_API || null;
const FORM_TIPOS = {
  pedido:  {titulo:'🔗 Link do formulário de pedido', msg:'Olá! Para enviar um pedido de pagamento, preencha por este link:'},
  cadastro:{titulo:'🔗 Link para a pessoa se cadastrar', msg:'Olá! Para receber seus pagamentos, faça seu cadastro (dados pessoais e bancários) por este link:'},
};
function baseSite(){
  let href = location.href;
  try{ if (!/^https?:/.test(href)) href = window.top.location.href; }catch(e){}
  return href.split(/[?#]/)[0].replace(/[^\/]*$/, '');
}
const linkForm = token => baseSite() + 'formulario.html?f=' + encodeURIComponent(token);
function novoToken(){ const a = new Uint8Array(18); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function nomeEmpresa(){
  try{ const P = window.parent; if (P !== window && P.nomeClienteAberto) return P.nomeClienteAberto() || ''; }catch(e){}
  return (window.NUVEM && window.NUVEM.clienteNome) || '';
}
// PIX parcialmente escondido: quem tem o link confere se é a chave certa sem ver a chave inteira
// resumo curto do CPF/CNPJ para o formulário achar cadastro repetido sem receber o número (igual ao formulario.html)
function docResumo(d){ d = String(d||'').replace(/\D/g,''); if (!d) return ''; let h = 0x811c9dc5; for (let k = 0; k < d.length; k++){ h ^= d.charCodeAt(k); h = Math.imul(h, 16777619) >>> 0; } return ('00000' + (h >>> 8).toString(16)).slice(-6); }
// PIX completo para quem pede conferir (ou a conta, se não tiver PIX)
function pixCompleto(p){
  const k = String(p.pix||'').trim();
  if (!k) return p.banco && p.conta ? `${p.banco} · Ag ${p.agencia||'—'} · Conta ${p.conta}` : '';
  const t = p.pixTipo || tipoPix(k); return (t ? t + ': ' : '') + k;
}
function pixMascarado(p){
  const k = String(p.pix||'').trim();
  if (!k) return p.banco && p.conta ? `Conta ${p.banco} ••••${String(p.conta).replace(/\D/g,'').slice(-3)}` : '';
  if (k.includes('@')){ const [u, d] = k.split('@'); return u.slice(0, Math.min(3, Math.max(1, u.length-1))) + '•••@' + d; }
  const dig = k.replace(/\D/g,'');
  if (dig.length >= 8 && dig.length === k.replace(/[\s().\/-]/g,'').length) return (tipoPix(k) || 'Chave') + ' ••••' + dig.slice(-4);
  return k.slice(0, 4) + '•••' + k.slice(-4);
}
// id do cliente deste app (para o link de aprovação abrir o app certo)
function clienteAtual(){ const m = String(window.__P||'').match(/^cli_(.+)::$/); return m ? m[1] : (new URLSearchParams(location.search).get('c') || window.NUVEM?.cliente || ''); }
function opcoesForm(tipo){
  const base = {empresa: nomeEmpresa()};
  if (tipo !== 'pedido') return base;
  base.cliente = clienteAtual();
  const desde = addDias(HOJE, -120);
  return {...base,
    eventos: [...db.eventos].filter(e=>!e.data || e.data >= desde).sort((a,b)=>(a.data||'').localeCompare(b.data||'')).map(e=>({id:e.id, nome:e.nome, data:e.data||''})).concat([{id:'_empresa', nome:'Sem evento (despesa da empresa)', data:''}]),
    favorecidos: db.pessoas.filter(p=>p.ativo!==false).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).map(p=>({id:p.id, nome:p.nome, pix:pixCompleto(p), dh:docResumo(p.doc)})),
    categorias: [...db.categorias], formas: [...FORMAS],
    equipe: db.users.filter(u=>u.ativo!==false).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).map(u=>({id:u.id, nome:u.nome}))};
}
// cria (ou atualiza as opções de) o link deste cliente no banco
async function garantirForm(tipo, novo){
  const N = NAPI(); if (!N) throw new Error('sem nuvem');
  db.formLinks = db.formLinks || {};
  if (novo || !db.formLinks[tipo]){
    if (db.formLinks[tipo]) await N.api('DELETE', '/rest/v1/formularios?token=eq.' + encodeURIComponent(db.formLinks[tipo]), null, {'Prefer':'return=minimal'});
    else await N.api('DELETE', '/rest/v1/formularios?dados_id=eq.' + encodeURIComponent(N.dadosId()) + '&tipo=eq.' + tipo, null, {'Prefer':'return=minimal'});
    db.formLinks[tipo] = novoToken(); save();
  }
  await N.api('POST', '/rest/v1/formularios?on_conflict=token', [{token:db.formLinks[tipo], dados_id:N.dadosId(), tipo, opcoes:opcoesForm(tipo), ativo:true, atualizado_em:new Date().toISOString()}], {'Prefer':'resolution=merge-duplicates,return=minimal'});
  return db.formLinks[tipo];
}
