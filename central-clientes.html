<!doctype html>
<html lang="pt-BR">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="nuvem.js" data-pagina="central"></script>
<title>Central de Clientes</title>
<style>
:root{
  --bg:#f4efeb;--card:#fff;--text:#002620;--muted:#002620b3;--line:#c37f3640;
  --brand:#002620;--brand-soft:#efbb3c33;
  --aguardando:#efbb3c;--aprovado:#c37f36;--pago:#002620;--recusado:#ef4444;--cancelado:#0026208c;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,select,input,textarea{font:inherit}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo span{background:var(--brand);color:#fff;border-radius:8px;width:28px;height:28px;display:grid;place-items:center}
.who{margin-left:auto;display:flex;align-items:center;gap:8px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-weight:600}
nav{background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 12px;overflow-x:auto}
nav button{background:none;border:none;padding:12px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
main{padding:16px;max-width:1400px;margin:0 auto}
h2{margin:0 0 12px;font-size:18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select,.toolbar input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.toolbar input[type=search]{min-width:240px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#c37f3640}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{color:var(--recusado);border-color:#ef444433}
.btn.sm{padding:4px 8px;font-size:12px}
.spacer{flex:1}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.kpi:hover,.kpi.on{border-color:var(--brand);box-shadow:0 2px 10px #0026201f}
.kpi .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
/* cards de cliente */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.cli{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;position:relative;transition:border-color .15s,box-shadow .15s,transform .15s;border-top:4px solid var(--cor,var(--brand))}
.cli:hover{box-shadow:0 6px 18px #0026201a;transform:translateY(-2px)}
.cli.inativo{opacity:.6}
.cli.inativo:hover{opacity:1}
.cli-top{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:12px;background:var(--cor,var(--brand));color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.av.sm{width:30px;height:30px;border-radius:8px;font-size:12px}
.av.pessoa{border-radius:50%;background:#efbb3c33;color:#702b16}
.cli-nome{font-weight:700;font-size:15px;line-height:1.2}
.cli-seg{font-size:12px;color:var(--muted);margin-top:2px}
.fav{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;font-size:18px;color:#c37f3640;padding:2px;line-height:1}
.fav.on{color:#efbb3c}
.fav:hover{color:#efbb3c}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.tag.ok{background:#00262012;color:#002620}
.tag.off{background:#f4efeb;color:#002620b3}
.tag.lib{background:#c37f3626;color:#002620}
.tag.blk{background:#f4efeb;color:#702b16}
.tag.roxo{background:var(--brand-soft);color:#002620}
.tag.lnk{cursor:pointer}
.tag.lnk:hover{filter:brightness(.95)}
.meta{font-size:12px;color:var(--muted)}
.cli .meta{display:flex;flex-direction:column;gap:2px}
.cli-link{font-size:12px;color:var(--brand);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli-link.sem{color:var(--recusado)}
.cli-btns{display:flex;gap:6px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.cli-btns .btn.pri{flex:1;justify-content:center}
.novo{border:2px dashed #c37f3640;background:transparent;border-radius:14px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);cursor:pointer;font-size:14px}
.novo b{font-size:28px;font-weight:400;color:var(--brand)}
.novo:hover{border-color:var(--brand);color:var(--brand);background:#f4efeb}
.empty{color:var(--muted);text-align:center;padding:40px 0}
/* app aberto dentro do painel */
.appview{display:flex;flex-direction:column;height:100vh}
.appbar{background:#002620;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.appbar{padding:5px 12px;gap:8px;border-bottom:2px solid #efbb3c}
.appbar .btn.sm{padding:3px 8px}
.appbar select{padding:3px 8px!important}
.appbar .av.sm{width:24px;height:24px;font-size:10px}
@media (max-width:640px){
  .appbar{flex-wrap:nowrap;overflow-x:auto;padding:4px 8px;gap:6px}
  .appbar .btn,.appbar select,.appbar .nm{flex:none;white-space:nowrap}
  .appbar .spacer{display:none}
}
.appbar .btn{background:transparent;border-color:#f4efeb40;color:#fff}
.appbar .btn:hover{border-color:#fff}
.appbar .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.appbar select{background:#002620;color:#fff;border:1px solid #f4efeb40;border-radius:8px;padding:5px 8px}
.appwrap{flex:1;position:relative;background:#fff}
.appframe{position:absolute;inset:0;border:0;width:100%;height:100%;background:transparent;z-index:1}
.appfalha{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--muted);padding:24px}
.appfalha b{color:var(--text);font-size:16px}
/* acessos */
.panel{background:var(--card);border-radius:12px;border:1px solid var(--line);padding:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#f4efeb}
.pcell{display:flex;align-items:center;gap:10px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.acc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.acc.on{border-color:#efbb3c;background:#f4efeb}
.acc-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.acc-h label{flex-direction:row!important;align-items:center;gap:8px;color:var(--text)!important;font-size:13px!important;font-weight:600}
.acc-h select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;margin-left:auto}
.perms{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 12px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.perms label{flex-direction:row!important;align-items:center;gap:6px;color:var(--text)!important;font-size:12px!important}
.perms .grp{grid-column:1/-1;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:4px}
.bk-intro{margin:-6px 0 12px;color:var(--muted);font-size:13px}
.bk-grupo{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px}
.bk-grupo .lnk{background:none;border:none;padding:0;color:#c37f36;font:inherit;text-transform:none;letter-spacing:0;font-weight:600;cursor:pointer}
.bk-lista{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.bk-item{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff}
.bk-item:has(input:checked){border-color:#002620;background:#efbb3c14}
.bk-item input{margin-top:3px;width:16px;height:16px;accent-color:#002620;flex:none}
.bk-item span{display:flex;flex-direction:column;gap:2px;min-width:0}
.bk-item small{color:var(--muted);font-size:12px}
.bk-aviso{margin-top:12px;font-size:12px;background:#efbb3c26;border:1px solid #efbb3c80;border-radius:10px;padding:8px 10px}
.bk-rodape{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--muted)}
.bk-rodape .btn:disabled{opacity:.5;cursor:not-allowed}
/* modal */
.overlay{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:10}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:600px;padding:20px}
.modal.lg{max-width:760px}
.modal h3{margin:0 0 14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:#fff}
.form textarea{min-height:64px;resize:vertical}
.form .sec{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--text);margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
.cores{display:flex;gap:6px;flex-wrap:wrap}
.cores button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.cores button.on{box-shadow:0 0 0 2px var(--text)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;align-items:center}
.note{background:#f4efeb;border:1px solid #efbb3c;color:#702b16;border-radius:8px;padding:8px 10px;font-size:12px;margin-top:12px}
.info{background:#c37f3626;border:1px solid #c37f3666;color:#702b16;border-radius:8px;padding:8px 10px;font-size:12px}
.hint{font-size:11px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#002620;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;font-size:13px}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px #0026201a;padding:6px;min-width:220px;z-index:5;display:none}
.menu-pop.on{display:block}
.menu-pop button{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--text)}
.menu-pop button:hover{background:var(--bg)}
@media (max-width:600px){.form{grid-template-columns:1fr}.toolbar input[type=search]{min-width:0;flex:1}}
/* ===== Identidade visual Renata Campos · Inteligência Financeira ===== */

h2{font-size:24px}.login h1{font-size:28px}.modal h3{font-size:22px}
header{background:#002620;color:var(--creme);border-bottom:3px solid var(--ouro)}

header .btn{background:transparent;color:var(--creme);border-color:#f4efeb55}
header .btn:hover{border-color:var(--ouro)}

function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function load(){
  try{ db = JSON.parse(localStorage.getItem(KEY)); }catch(e){ db = null; }
  if(!db || !Array.isArray(db.clientes)) db = seed();
  if(!Array.isArray(db.pessoas)) db.pessoas = [];
  // versão anterior: e-mails liberados no cadastro do cliente viram pessoas
  db.clientes.forEach(c=>{
    if(c.acessoEmails){
      c.acessoEmails.split(/[,;\s]+/).filter(e=>e.includes('@')).forEach(email=>{
        let p = db.pessoas.find(x=>x.email.toLowerCase()===email.toLowerCase());
        if(!p){ p = {id:uid(), nome:email.split('@')[0], email, telefone:'', tipo:'cliente', status:'ativo', acessos:{}, criadoEm:new Date().toISOString()}; db.pessoas.push(p); }
        if(!p.acessos[c.id]) p.acessos[c.id] = {perfil:'leitura', perms:[...PERFIS.leitura.perms]};
      });
    }
    delete c.acessoEmails; delete c.acesso;
  });
  // Cada empresa tem os próprios dados. Só a primeira empresa cadastrada continua com os dados que já existiam no navegador.
  let dono = db.clientes.find(c=>c.dadosOriginais) || db.clientes.find(c=>c.dadosProprios!==true);
  db.clientes.forEach(c=>{
    if(c===dono){ c.dadosOriginais = true; c.dadosProprios = false; }
    else if(c.dadosProprios!==true){ c.dadosProprios = true; c.limpar = true; delete c.dadosOriginais; }
  });
  save();
}

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* arquivos dos apps guardados dentro da central (IndexedDB) */
const ARQ = {};           // id do cliente -> {nome, html}
let idbOk = true;
function idb(){ return new Promise((ok,er)=>{ try{ const r = indexedDB.open('central-clientes-apps',1); r.onupgradeneeded=()=>r.result.createObjectStore('arquivos'); r.onsuccess=()=>ok(r.result); r.onerror=()=>er(r.error); }catch(e){ er(e); } }); }
async function idbTodos(){ const d = await idb(); return new Promise((ok,er)=>{ const out={}; const t=d.transaction('arquivos'); const st=t.objectStore('arquivos'); const r=st.openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ out[c.key]=c.value; c.continue(); } else ok(out); }; r.onerror=()=>er(r.error); }); }
async function idbPut(k,v){ const d = await idb(); return new Promise((ok,er)=>{ const t=d.transaction('arquivos','readwrite'); v===null?t.objectStore('arquivos').delete(k):t.objectStore('arquivos').put(v,k); t.oncomplete=ok; t.onerror=()=>er(t.error); }); }
async function guardarArquivo(id, v){ if(v) ARQ[id]=v; else delete ARQ[id]; try{ await idbPut(id, v); }catch(e){ idbOk=false; toast('Atenção: este navegador não deixou guardar o arquivo. Ele vale só até fechar a página.'); } }
/* App padrão de pagamentos, embutido nesta central (cópia do demo-fluxo-caixa.html) */
const APP_PADRAO_VERSAO = '9.5';
let _appPadrao = null;
function appPadrao(){
  if(!_appPadrao){
    const b = atob(document.getElementById('appPadraoB64').textContent.trim());
    const u = new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
    _appPadrao = {nome:'App de pagamentos (padrão v'+APP_PADRAO_VERSAO+')', html:new TextDecoder('utf-8').decode(u)};
  }
  return _appPadrao;
}
// Se o arquivo guardado for uma versão mais antiga do mesmo app de pagamentos, a central usa a versão nova embutida
const verNum = v => String(v||'0').split('.').map(Number).reduce((a,n,i)=>a+n/Math.pow(1000,i),0);
function arquivoAntigo(c){
  const a = ARQ[c.id]; if(!a) return false;
  const m = a.html.match(/const APP_VERSAO = '([^']+)'/);
  return !!m && /Pagamentos de Eventos/.test(a.html) && verNum(m[1]) < verNum(APP_PADRAO_VERSAO);
}
function usaPadrao(c){ const l = String(c.link||'').trim(); return (!ARQ[c.id] || arquivoAntigo(c)) && (arquivoAntigo(c) || !l || /demo-fluxo-caixa[^\/]*\.html?$/i.test(l)); }
function fonte(c){ return usaPadrao(c) ? appPadrao() : (ARQ[c.id] || null); }
function temArquivo(c){ return !!(ARQ[c.id] || usaPadrao(c)); }
function temApp(c){ return temArquivo(c) || !!linkSeguro(c.link); }
function kb(n){ return n>1048576 ? (n/1048576).toFixed(1).replace('.',',')+' MB' : Math.max(1,Math.round(n/1024))+' KB'; }
// Cada cliente ganha uma "gaveta" própria de dados, mesmo que dois clientes usem o mesmo arquivo de app
function htmlDoApp(id){
  const h0 = fonte(achar(id)).html;
  if(!achar(id)?.dadosProprios) return h0;   // usa os mesmos dados do app aberto direto no navegador
  const pre = 'cli_'+id+'::';
  const shim = `<script>(function(){try{var P=${JSON.stringify(pre)};window.__P=P;var S=Storage.prototype,g=S.getItem,s=S.setItem,r=S.removeItem,k=S.key,c=S.clear;
S.getItem=function(x){return g.call(this,P+x)};S.setItem=function(x,v){return s.call(this,P+x,v)};S.removeItem=function(x){return r.call(this,P+x)};
S.clear=function(){var a=[];for(var i=0;i<this.length;i++){var n=k.call(this,i);if(n&&n.indexOf(P)===0)a.push(n)}for(var j=0;j<a.length;j++)r.call(this,a[j])};}catch(e){}})();<\/script>`;
  const h = h0;
  const m = h.match(/<head[^>]*>/i);
  return m ? h.replace(m[0], m[0]+shim) : shim + h;
}

function lerArquivo(inp, id){

// Cria um novo cliente igual a este (mesmo app), com dados próprios começando do zero
async function duplicar(id){
  const o = achar(id); if(!o) return;
  const nid = uid();
  const copia = {...JSON.parse(JSON.stringify(o)), id:nid, nome:o.nome+' (cópia)', fav:false, criadoEm:new Date().toISOString(), ultimoAcesso:null, dadosProprios:true, limpar:true, dadosOriginais:false};
  db.clientes.push(copia);
  if(ARQ[id]) await guardarArquivo(nid, {...ARQ[id], em:new Date().toISOString()});
  save(); render();
  toast('Cliente duplicado. Ajuste o nome e os dados.');
  abrirForm(nid);

function excluir(id){
  const b = document.getElementById('btnExcluir');

  if(ARQ[id]) guardarArquivo(id, null);
  db.pessoas.forEach(p=>{ if(p.acessos) delete p.acessos[id]; });
  save(); fechar(); render(); toast('Cliente excluído');
}

/* Backup: o arquivo pode ter o cadastro da Central e os dados do app de cada cliente.
   Os dados de cada cliente são guardados sem o prefixo do navegador, para voltarem no lugar certo. */
const APP_CHAVE = /^demo-pagamentos-eventos-v\d+$/;
function chavesDoCliente(c){
  const out = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i); if(!k) continue;
    if(c.dadosProprios){ const pre='cli_'+c.id+'::'; if(k.indexOf(pre)===0) out[k.slice(pre.length)] = localStorage.getItem(k); }
    else if(APP_CHAVE.test(k)) out[k] = localStorage.getItem(k);
  }
  return out;
}
function resumoDados(d){
  let n=0, t=0;
  Object.values(d).forEach(v=>{ t += String(v).length; try{ const o=JSON.parse(v); n += (o.pedidos||[]).length; }catch(e){} });
  return {lanc:n, tam:t};
}
function linhaBk(id, titulo, sub, marcado){
  return `<label class="bk-item"><input type="checkbox" class="bk-ck" value="${esc(id)}" ${marcado?'checked':''} onchange="bkConta()">
    <span><b>${esc(titulo)}</b><small>${sub}</small></span></label>`;
}
function abrirBackup(){
  document.getElementById('menuPop')?.classList.remove('on');
  const itens = db.clientes.map(c=>{
    const d = chavesDoCliente(c), r = resumoDados(d), vazio = !Object.keys(d).length;
    const sub = vazio ? 'Ainda sem dados (o app nunca foi aberto)' : `${r.lanc} pedido(s) de pagamento, eventos, equipe e extrato · ${kb(r.tam)}`;
    return linhaBk(c.id, c.nome, sub, !vazio);
  }).join('');
  document.getElementById('modal').innerHTML = `
  <div class="overlay" onclick="if(event.target===this)fechar()">
    <div class="modal">
      <h3>Exportar backup</h3>
      <p class="bk-intro">Escolha o que vai no arquivo. Ele fica salvo no seu computador e pode ser restaurado depois pelo botão Backup.</p>
      <div class="bk-grupo">Central</div>
      ${linhaBk('_central','Cadastro da Central', `${db.clientes.length} cliente(s) e ${db.pessoas.length} pessoa(s) com acesso`, true)}
      <div class="bk-grupo">Dados dos apps <button type="button" class="lnk" onclick="bkTodos(true)">marcar todos</button> · <button type="button" class="lnk" onclick="bkTodos(false)">desmarcar</button></div>
      <div class="bk-lista">${itens}</div>
      <div class="bk-rodape">
        <span id="bkConta"></span>
        <div class="spacer"></div>
        <button class="btn" onclick="fechar()">Cancelar</button>
        <button class="btn pri" id="bkGo" onclick="exportarBackup()">⬇ Baixar arquivo</button>
      </div>
    </div>
  </div>`;
  bkConta();
}
function bkSel(){ return [...document.querySelectorAll('.bk-ck')].filter(x=>x.checked).map(x=>x.value); }
function bkTodos(v){ document.querySelectorAll('.bk-lista .bk-ck').forEach(x=>x.checked=v); bkConta(); }
function bkConta(){
  const n = bkSel().length, el = document.getElementById('bkConta'), go = document.getElementById('bkGo');

function baixarJSON(obj, nome){
  const blob = new Blob([JSON.stringify(obj,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function nomeArq(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase() || 'cliente'; }
function exportarBackup(){
  const sel = bkSel(); if(!sel.length) return;
  const bk = {tipo:'backup-central', versao:2, criadoEm:new Date().toISOString(), clientesDados:{}};
  if(sel.includes('_central')) bk.central = JSON.parse(JSON.stringify(db));
  sel.filter(x=>x!=='_central').forEach(id=>{ const c = achar(id); if(c) bk.clientesDados[id] = {nome:c.nome, dados:chavesDoCliente(c)}; });
  const ids = Object.keys(bk.clientesDados), dia = new Date().toISOString().slice(0,10);
  const nome = (!bk.central && ids.length===1) ? 'backup-'+nomeArq(bk.clientesDados[ids[0]].nome)+'-'+dia+'.json'
             : (bk.central && !ids.length) ? 'backup-central-'+dia+'.json' : 'backup-completo-'+dia+'.json';
  baixarJSON(bk, nome); fechar(); toast('Backup baixado: '+nome);
}
/* Restaurar */
let bkArquivo = null;
function importar(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    inp.value='';
    let d; try{ d = JSON.parse(r.result); }catch(e){ return toast('Arquivo inválido. Use um backup exportado por este painel.'); }
    if(d && d.tipo==='backup-central') return abrirRestaurar(d, f.name);
    if(d && Array.isArray(d.clientes)) return abrirRestaurar({tipo:'backup-central', versao:1, central:d, clientesDados:{}}, f.name);  // backup antigo, só a Central
    toast('Arquivo inválido. Use um backup exportado por este painel.');
  };
  r.readAsText(f);
}
function abrirRestaurar(bk, nomeArquivo){
  bkArquivo = bk;
  const quando = bk.criadoEm ? ' de '+dataBR(bk.criadoEm) : '';
  const c0 = bk.central ? linhaBk('_central','Cadastro da Central', `${(bk.central.clientes||[]).length} cliente(s) e ${(bk.central.pessoas||[]).length} pessoa(s). Junta com o que já existe; não apaga ninguém.`, true) : '';
  const nomesCentral = {}; (bk.central?.clientes||[]).forEach(c=>nomesCentral[c.id]=c.nome);
  const itens = Object.entries(bk.clientesDados||{}).map(([id,v])=>{
    const r = resumoDados(v.dados||{}), existe = !!achar(id) || !!nomesCentral[id];
    const sub = existe ? `${r.lanc} pedido(s) · substitui os dados atuais deste cliente` : 'Este cliente não existe mais na Central. Marque também o Cadastro da Central para recriá-lo.';
    return linhaBk(id, v.nome || nomesCentral[id] || 'Cliente', sub, existe);
  }).join('');
  document.getElementById('modal').innerHTML = `
  <div class="overlay" onclick="if(event.target===this)fechar()">
    <div class="modal">
      <h3>Restaurar backup</h3>
      <p class="bk-intro">Arquivo <b>${esc(nomeArquivo)}</b>${esc(quando)}. Escolha o que quer trazer de volta.</p>
      ${c0?'<div class="bk-grupo">Central</div>'+c0:''}
      ${itens?'<div class="bk-grupo">Dados dos apps</div><div class="bk-lista">'+itens+'</div>':''}
      <div class="bk-aviso">⚠ Os dados dos apps marcados <b>substituem</b> os dados atuais desses clientes, para todos que têm acesso. Se tiver dúvida, exporte um backup de agora antes.</div>
      <div class="bk-rodape">
        <span id="bkConta"></span>
        <div class="spacer"></div>
        <button class="btn" onclick="fechar()">Cancelar</button>
        <button class="btn pri" id="bkGo" onclick="restaurarBackup()">⬆ Restaurar selecionados</button>
      </div>
    </div>
  </div>`;
  bkConta();
}
function restaurarBackup(){
  const bk = bkArquivo, sel = bkSel(); if(!bk || !sel.length) return;
  let n=0, m=0, a=0;
  if(sel.includes('_central') && bk.central){
    const d = bk.central;
    (d.clientes||[]).forEach(c=>{ if(c && c.nome){ const ex = c.id && achar(c.id); if(ex) Object.assign(ex,c); else db.clientes.push({...c, id:c.id||uid()}); n++; } });
    (d.pessoas||[]).forEach(p=>{ if(p && p.email){ const ex = (p.id && pessoa(p.id)) || db.pessoas.find(x=>x.email.toLowerCase()===String(p.email).toLowerCase()); if(ex) Object.assign(ex,p,{id:ex.id}); else db.pessoas.push({acessos:{}, ...p, id:p.id||uid()}); m++; } });
  }
  sel.filter(x=>x!=='_central').forEach(id=>{
    const c = achar(id), v = (bk.clientesDados||{})[id]; if(!c || !v) return;
    const pre = c.dadosProprios ? 'cli_'+id+'::' : '';
    Object.entries(v.dados||{}).forEach(([k,val])=>{ try{ localStorage.setItem(pre+k, val); }catch(e){} });
    delete c.limpar;   // não apagar os dados restaurados ao abrir o app
    a++;
