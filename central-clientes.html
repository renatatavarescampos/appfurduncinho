<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Clientes</title>
<style>
:root{
  --bg:#f4f5f8;--card:#fff;--text:#1d2330;--muted:#6b7280;--line:#e5e7eb;
  --brand:#5b3df5;--brand-soft:#ede9fe;
  --aguardando:#f59e0b;--aprovado:#3b82f6;--pago:#10b981;--recusado:#ef4444;--cancelado:#9ca3af;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,select,input,textarea{font:inherit}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo span{background:var(--brand);color:#fff;border-radius:8px;width:28px;height:28px;display:grid;place-items:center}
.who{margin-left:auto;display:flex;align-items:center;gap:8px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-weight:600}
nav{background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 12px;overflow-x:auto}
nav button{background:none;border:none;padding:12px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
main{padding:16px;max-width:1400px;margin:0 auto}
h2{margin:0 0 12px;font-size:18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select,.toolbar input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.toolbar input[type=search]{min-width:240px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#c7cad1}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{color:var(--recusado);border-color:#fecaca}
.btn.sm{padding:4px 8px;font-size:12px}
.spacer{flex:1}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.kpi:hover,.kpi.on{border-color:var(--brand);box-shadow:0 2px 10px #5b3df51f}
.kpi .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
/* cards de cliente */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.cli{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;position:relative;transition:border-color .15s,box-shadow .15s,transform .15s;border-top:4px solid var(--cor,var(--brand))}
.cli:hover{box-shadow:0 6px 18px #0000001a;transform:translateY(-2px)}
.cli.inativo{opacity:.6}
.cli.inativo:hover{opacity:1}
.cli-top{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:12px;background:var(--cor,var(--brand));color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.av.sm{width:30px;height:30px;border-radius:8px;font-size:12px}
.av.pessoa{border-radius:50%;background:#e0e7ff;color:#3730a3}
.cli-nome{font-weight:700;font-size:15px;line-height:1.2}
.cli-seg{font-size:12px;color:var(--muted);margin-top:2px}
.fav{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;font-size:18px;color:#d1d5db;padding:2px;line-height:1}
.fav.on{color:#f59e0b}
.fav:hover{color:#f59e0b}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.tag.ok{background:#ecfdf5;color:#047857}
.tag.off{background:#f3f4f6;color:#6b7280}
.tag.lib{background:#eff6ff;color:#1d4ed8}
.tag.blk{background:#fff7ed;color:#9a3412}
.tag.roxo{background:var(--brand-soft);color:#5b21b6}
.tag.lnk{cursor:pointer}
.tag.lnk:hover{filter:brightness(.95)}
.meta{font-size:12px;color:var(--muted)}
.cli .meta{display:flex;flex-direction:column;gap:2px}
.cli-link{font-size:12px;color:var(--brand);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli-link.sem{color:var(--recusado)}
.cli-btns{display:flex;gap:6px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.cli-btns .btn.pri{flex:1;justify-content:center}
.novo{border:2px dashed #d1d5db;background:transparent;border-radius:14px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);cursor:pointer;font-size:14px}
.novo b{font-size:28px;font-weight:400;color:var(--brand)}
.novo:hover{border-color:var(--brand);color:var(--brand);background:#faf9ff}
.empty{color:var(--muted);text-align:center;padding:40px 0}
/* app aberto dentro do painel */
.appview{display:flex;flex-direction:column;height:100vh}
.appbar{background:#1d2330;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.appbar .btn{background:transparent;border-color:#ffffff40;color:#fff}
.appbar .btn:hover{border-color:#fff}
.appbar .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.appbar select{background:#2b3242;color:#fff;border:1px solid #ffffff40;border-radius:8px;padding:5px 8px}
.appwrap{flex:1;position:relative;background:#fff}
.appframe{position:absolute;inset:0;border:0;width:100%;height:100%;background:transparent;z-index:1}
.appfalha{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--muted);padding:24px}
.appfalha b{color:var(--text);font-size:16px}
/* acessos */
.panel{background:var(--card);border-radius:12px;border:1px solid var(--line);padding:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#fafafa}
.pcell{display:flex;align-items:center;gap:10px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.acc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.acc.on{border-color:#c4b5fd;background:#faf9ff}
.acc-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.acc-h label{flex-direction:row!important;align-items:center;gap:8px;color:var(--text)!important;font-size:13px!important;font-weight:600}
.acc-h select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;margin-left:auto}
.perms{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 12px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.perms label{flex-direction:row!important;align-items:center;gap:6px;color:var(--text)!important;font-size:12px!important}
.perms .grp{grid-column:1/-1;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:4px}
/* modal */
.overlay{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:10}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:600px;padding:20px}
.modal.lg{max-width:760px}
.modal h3{margin:0 0 14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:#fff}
.form textarea{min-height:64px;resize:vertical}
.form .sec{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--text);margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
.cores{display:flex;gap:6px;flex-wrap:wrap}
.cores button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.cores button.on{box-shadow:0 0 0 2px var(--text)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;align-items:center}
.note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:8px 10px;font-size:12px;margin-top:12px}
.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:8px;padding:8px 10px;font-size:12px}
.hint{font-size:11px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2330;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;font-size:13px}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px #0000001a;padding:6px;min-width:220px;z-index:5;display:none}
.menu-pop.on{display:block}
.menu-pop button{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--text)}
.menu-pop button:hover{background:var(--bg)}
@media (max-width:600px){.form{grid-template-columns:1fr}.toolbar input[type=search]{min-width:0;flex:1}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importar(this)">

<script>
const KEY = 'central-clientes-v1';
const CORES = ['#5b3df5','#3b82f6','#10b981','#f59e0b','#ef4444','#ec4899','#0ea5e9','#14b8a6','#8b5cf6','#1d2330'];

// O que cada pessoa pode ver ou fazer dentro do app de um cliente
const PERMS = [
  ['Pagamentos', [
    ['ver_pedidos','Ver pedidos de pagamento'],
    ['solicitar','Solicitar pagamentos'],
    ['aprovar','Aprovar ou recusar pagamentos'],
    ['pagar','Marcar como pago'],
  ]],
  ['Financeiro', [
    ['dashboard','Dashboard'],
    ['fluxo','Fluxo de caixa'],
    ['conciliacao','Conciliação bancária'],
    ['recebimentos','Recebimentos'],
  ]],
  ['Cadastros', [
    ['eventos','Eventos'],
    ['favorecidos','Pessoas / favorecidos'],
    ['equipe','Equipe e usuários'],
  ]],
];
const TODAS = PERMS.flatMap(g=>g[1].map(p=>p[0]));
const PERFIS = {
  admin:      {nome:'Administrador', desc:'Vê e altera tudo', perms:TODAS},
  aprovador:  {nome:'Aprovador (sócio)', desc:'Vê tudo e aprova pagamentos', perms:['ver_pedidos','aprovar','dashboard','fluxo','recebimentos','eventos','favorecidos']},
  solicitante:{nome:'Solicitante', desc:'Pede pagamentos e acompanha os seus', perms:['ver_pedidos','solicitar']},
  leitura:    {nome:'Somente leitura', desc:'Só consulta, não altera nada', perms:['ver_pedidos','dashboard','fluxo','recebimentos']},
  custom:     {nome:'Personalizado', desc:'Você escolhe item por item', perms:[]},
};
const TIPOS = {interno:'Minha equipe', cliente:'Pessoa do cliente'};

let db, tela = 'clientes', filtro = 'todos', appAberto = null, filtroCliente = '';

function seed(){
  const id = uid();
  return { clientes: [{
    id, nome:'Pagamentos de Eventos', segmento:'Eventos', cnpj:'', responsavel:'', email:'', telefone:'',
    link:'demo-fluxo-caixa.html', cor:'#5b3df5', status:'ativo',
    obs:'Cliente de exemplo. App de solicitação e aprovação de pagamentos, conciliação bancária e fluxo de caixa.',
    fav:true, criadoEm:new Date().toISOString(), ultimoAcesso:null
  }], pessoas: [] };
}
function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function load(){
  try{ db = JSON.parse(localStorage.getItem(KEY)); }catch(e){ db = null; }
  if(!db || !Array.isArray(db.clientes)) db = seed();
  if(!Array.isArray(db.pessoas)) db.pessoas = [];
  // versão anterior: e-mails liberados no cadastro do cliente viram pessoas
  db.clientes.forEach(c=>{
    if(c.acessoEmails){
      c.acessoEmails.split(/[,;\s]+/).filter(e=>e.includes('@')).forEach(email=>{
        let p = db.pessoas.find(x=>x.email.toLowerCase()===email.toLowerCase());
        if(!p){ p = {id:uid(), nome:email.split('@')[0], email, telefone:'', tipo:'cliente', status:'ativo', acessos:{}, criadoEm:new Date().toISOString()}; db.pessoas.push(p); }
        if(!p.acessos[c.id]) p.acessos[c.id] = {perfil:'leitura', perms:[...PERFIS.leitura.perms]};
      });
    }
    delete c.acessoEmails; delete c.acesso;
  });
  // Cada empresa tem os próprios dados. Só a primeira empresa cadastrada continua com os dados que já existiam no navegador.
  let dono = db.clientes.find(c=>c.dadosOriginais) || db.clientes.find(c=>c.dadosProprios!==true);
  db.clientes.forEach(c=>{
    if(c===dono){ c.dadosOriginais = true; c.dadosProprios = false; }
    else if(c.dadosProprios!==true){ c.dadosProprios = true; c.limpar = true; delete c.dadosOriginais; }
  });
  save();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
function iniciais(nome){ const w = String(nome||'?').trim().split(/\s+/).filter(x=>x.length>2); const b = w.length?w:[String(nome||'?').trim()||'?']; return (b[0][0] + (b[1]?b[1][0]:'')).toUpperCase(); }
function dataBR(iso){ if(!iso) return ''; const d=new Date(iso); return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function linkSeguro(l){ l = String(l||'').trim(); if(!l) return ''; if(/^\s*(javascript|data|vbscript):/i.test(l)) return ''; return l; }
function achar(id){ return db.clientes.find(c=>c.id===id); }
/* arquivos dos apps guardados dentro da central (IndexedDB) */
const ARQ = {};           // id do cliente -> {nome, html}
let idbOk = true;
function idb(){ return new Promise((ok,er)=>{ try{ const r = indexedDB.open('central-clientes-apps',1); r.onupgradeneeded=()=>r.result.createObjectStore('arquivos'); r.onsuccess=()=>ok(r.result); r.onerror=()=>er(r.error); }catch(e){ er(e); } }); }
async function idbTodos(){ const d = await idb(); return new Promise((ok,er)=>{ const out={}; const t=d.transaction('arquivos'); const st=t.objectStore('arquivos'); const r=st.openCursor(); r.onsuccess=()=>{ const c=r.result; if(c){ out[c.key]=c.value; c.continue(); } else ok(out); }; r.onerror=()=>er(r.error); }); }
async function idbPut(k,v){ const d = await idb(); return new Promise((ok,er)=>{ const t=d.transaction('arquivos','readwrite'); v===null?t.objectStore('arquivos').delete(k):t.objectStore('arquivos').put(v,k); t.oncomplete=ok; t.onerror=()=>er(t.error); }); }
async function guardarArquivo(id, v){ if(v) ARQ[id]=v; else delete ARQ[id]; try{ await idbPut(id, v); }catch(e){ idbOk=false; toast('Atenção: este navegador não deixou guardar o arquivo. Ele vale só até fechar a página.'); } }
/* App padrão de pagamentos, embutido nesta central (cópia do demo-fluxo-caixa.html) */
const APP_PADRAO_VERSAO = '4.7';
let _appPadrao = null;
function appPadrao(){
  if(!_appPadrao){
    const b = atob(document.getElementById('appPadraoB64').textContent.trim());
    const u = new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
    _appPadrao = {nome:'App de pagamentos (padrão v'+APP_PADRAO_VERSAO+')', html:new TextDecoder('utf-8').decode(u)};
  }
  return _appPadrao;
}
// Se o arquivo guardado for uma versão mais antiga do mesmo app de pagamentos, a central usa a versão nova embutida
const verNum = v => String(v||'0').split('.').map(Number).reduce((a,n,i)=>a+n/Math.pow(1000,i),0);
function arquivoAntigo(c){
  const a = ARQ[c.id]; if(!a) return false;
  const m = a.html.match(/const APP_VERSAO = '([^']+)'/);
  return !!m && /Pagamentos de Eventos/.test(a.html) && verNum(m[1]) < verNum(APP_PADRAO_VERSAO);
}
function usaPadrao(c){ const l = String(c.link||'').trim(); return (!ARQ[c.id] || arquivoAntigo(c)) && (arquivoAntigo(c) || !l || /demo-fluxo-caixa[^\/]*\.html?$/i.test(l)); }
function fonte(c){ return usaPadrao(c) ? appPadrao() : (ARQ[c.id] || null); }
function temArquivo(c){ return !!(ARQ[c.id] || usaPadrao(c)); }
function temApp(c){ return temArquivo(c) || !!linkSeguro(c.link); }
function kb(n){ return n>1048576 ? (n/1048576).toFixed(1).replace('.',',')+' MB' : Math.max(1,Math.round(n/1024))+' KB'; }
// Cada cliente ganha uma "gaveta" própria de dados, mesmo que dois clientes usem o mesmo arquivo de app
function htmlDoApp(id){
  const h0 = fonte(achar(id)).html;
  if(!achar(id)?.dadosProprios) return h0;   // usa os mesmos dados do app aberto direto no navegador
  const pre = 'cli_'+id+'::';
  const shim = `<script>(function(){try{var P=${JSON.stringify(pre)},S=Storage.prototype,g=S.getItem,s=S.setItem,r=S.removeItem,k=S.key,c=S.clear;
S.getItem=function(x){return g.call(this,P+x)};S.setItem=function(x,v){return s.call(this,P+x,v)};S.removeItem=function(x){return r.call(this,P+x)};
S.clear=function(){var a=[];for(var i=0;i<this.length;i++){var n=k.call(this,i);if(n&&n.indexOf(P)===0)a.push(n)}for(var j=0;j<a.length;j++)r.call(this,a[j])};}catch(e){}})();<\/script>`;
  const h = h0;
  const m = h.match(/<head[^>]*>/i);
  return m ? h.replace(m[0], m[0]+shim) : shim + h;
}
function pessoa(id){ return db.pessoas.find(p=>p.id===id); }
function pessoasDo(cid){ return db.pessoas.filter(p=>p.acessos && p.acessos[cid]); }

/* ---------- estrutura ---------- */
function render(){
  const app = document.getElementById('app');
  if(appAberto){ return renderApp(app); }
  app.innerHTML = `
  <header>
    <div class="logo" onclick="irPara('clientes')"><span>◆</span>Central de Clientes</div>
    <div class="who">
      <span class="badge">Painel da gestora</span>
      <div class="menu">
        <button class="btn sm" onclick="toggleMenu(event)">⋯ Backup</button>
        <div class="menu-pop" id="menuPop">
          <button onclick="exportar()">⬇ Exportar dados (arquivo)</button>
          <button onclick="document.getElementById('imp').click()">⬆ Importar dados</button>
        </div>
      </div>
    </div>
  </header>
  <nav>
    <button class="${tela==='clientes'?'on':''}" onclick="irPara('clientes')">Clientes</button>
    <button class="${tela==='acessos'?'on':''}" onclick="irPara('acessos')">Controle de acessos (${db.pessoas.length})</button>
  </nav>
  <main id="main"></main>`;
  if(tela==='acessos') renderAcessos(); else renderClientes();
}
function irPara(t, cid){ tela = t; filtroCliente = cid || ''; appAberto = null; render(); window.scrollTo(0,0); }

/* ---------- clientes ---------- */
function renderClientes(){
  const c = db.clientes;
  const k = [
    {id:'todos', l:'Clientes', v:c.length, s:'cadastrados', cor:'var(--brand)'},
    {id:'ativo', l:'Ativos', v:c.filter(x=>x.status==='ativo').length, s:'em operação', cor:'var(--pago)'},
    {id:'acesso', l:'Com acessos liberados', v:c.filter(x=>pessoasDo(x.id).length).length, s:db.pessoas.length+' pessoa(s) cadastrada(s)', cor:'var(--aprovado)'},
    {id:'inativo', l:'Inativos', v:c.filter(x=>x.status!=='ativo').length, s:'pausados ou encerrados', cor:'var(--cancelado)'},
  ];
  document.getElementById('main').innerHTML = `
  <div class="kpis">${k.map(x=>`
    <div class="kpi ${filtro===x.id?'on':''}" onclick="setFiltro('${x.id}')" title="Filtrar">
      <div class="l"><span class="dot" style="background:${x.cor}"></span>${x.l}</div>
      <div class="v">${x.v}</div><div class="s">${x.s}</div>
    </div>`).join('')}</div>
  <div class="toolbar">
    <h2 style="margin:0">Apps dos clientes</h2>
    <div class="spacer"></div>

      <option value="fav">Favoritos primeiro</option>
      <option value="nome">Nome (A–Z)</option>
      <option value="recente">Acessados recentemente</option>
    </select>
    <button class="btn pri" onclick="abrirForm()">+ Novo cliente</button>
  </div>
  <div class="grid" id="grid"></div>`;
  renderGrid();
}
function setFiltro(f){ filtro = (filtro===f && f!=='todos') ? 'todos' : f; renderClientes(); }
function renderGrid(){
  const q = (document.getElementById('busca')?.value||'').trim().toLowerCase();
  const ordem = document.getElementById('ordem')?.value || 'fav';
  let lista = db.clientes.filter(c=>{
    if(filtro==='ativo' && c.status!=='ativo') return false;
    if(filtro==='inativo' && c.status==='ativo') return false;
    if(filtro==='acesso' && !pessoasDo(c.id).length) return false;
    if(q){ const t = [c.nome,c.segmento,c.cnpj,c.responsavel,c.email].join(' ').toLowerCase(); if(!t.includes(q)) return false; }
    return true;
  });
  lista.sort((a,b)=>{
    if(ordem==='recente') return (b.ultimoAcesso||'').localeCompare(a.ultimoAcesso||'');
    if(ordem==='fav' && !!b.fav !== !!a.fav) return b.fav ? 1 : -1;
    return a.nome.localeCompare(b.nome,'pt-BR');
  });
  let html = lista.map(card).join('');
  if(!lista.length && (q || filtro!=='todos')) html = `<div class="empty" style="grid-column:1/-1">Nenhum cliente encontrado com esse filtro.</div>`;
  if(!q && filtro==='todos') html += `<button class="novo" onclick="abrirForm()"><b>+</b>Adicionar cliente</button>`;
  document.getElementById('grid').innerHTML = html;
}
function card(c){

    <button class="fav ${c.fav?'on':''}" onclick="event.stopPropagation();favoritar('${c.id}')" title="${c.fav?'Remover dos favoritos':'Marcar como favorito'}">${c.fav?'★':'☆'}</button>
    <div class="cli-top">
      <div class="av">${esc(iniciais(c.nome))}</div>
      <div style="min-width:0;padding-right:20px">

    <div class="cli-link ${temApp(c)?'':'sem'}">${usaPadrao(c)?'📦 App de pagamentos (padrão v'+APP_PADRAO_VERSAO+')':ARQ[c.id]?'📄 App guardado na central: '+esc(ARQ[c.id].nome):link?'🔗 '+esc(link):'⚠ Sem app cadastrado'}</div>

      <button class="btn pri sm" onclick="event.stopPropagation();abrirApp('${c.id}')">Abrir app</button>

/* ---------- app do cliente aberto dentro do painel ---------- */
function abrirApp(id){
  const c = achar(id); if(!c) return;
  if(!temApp(c)){ toast('Esse cliente ainda não tem app. Cadastre em "Editar".'); return abrirForm(id); }
  c.ultimoAcesso = new Date().toISOString(); save();
  appAberto = id;
  try{ history.pushState({app:id}, ''); }catch(e){}
  render();
}
function fecharApp(){ if(!appAberto) return; appAberto = null; render(); }
window.addEventListener('popstate', ()=>{ if(appAberto){ appAberto = null; render(); } });
function renderApp(app){
  const c = achar(appAberto); if(!c){ appAberto=null; return render(); }
  const arq = temArquivo(c);
  const link = linkSeguro(c.link);
  // arquivo local sem cópia guardada: mostra primeiro o botão de carregar, em vez da tela de erro do navegador
  const soArquivoLocal = !arq && !/^https?:\/\//i.test(link) && !window._tentarLink;
  window._tentarLink = false;
  let abs = link; try{ abs = new URL(link, location.href).href; }catch(e){}
  if(arq){ try{ if(window._blobUrl) URL.revokeObjectURL(window._blobUrl); window._blobUrl = URL.createObjectURL(new Blob([htmlDoApp(c.id)],{type:'text/html'})); abs = window._blobUrl; }catch(e){} }
  const outros = db.clientes.filter(temApp).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  const n = pessoasDo(c.id).length;
  app.innerHTML = `
  <div class="appview">
    <div class="appbar">
      <button class="btn sm" onclick="history.length>1&&history.state&&history.state.app?history.back():fecharApp()">← Central</button>
      <div class="nm"><div class="av sm" style="--cor:${esc(c.cor)}">${esc(iniciais(c.nome))}</div>${esc(c.nome)}</div>
      <div class="spacer"></div>
      <select onchange="trocarApp(this.value)" title="Trocar de cliente">
        ${outros.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.nome)}</option>`).join('')}
      </select>
      ${arq?'':`<button class="btn sm" style="background:var(--brand);border-color:var(--brand)" onclick="abrirForm('${c.id}',true)" title="Guardar o arquivo do app dentro da central">📄 Carregar arquivo do app</button>`}
      <button class="btn sm" onclick="irPara('acessos','${c.id}')">👥 Acessos (${n})</button>
      <button class="btn sm" onclick="renderApp(document.getElementById('app'))">↻ Recarregar</button>
      <a class="btn sm" href="${esc(abs)}" target="_blank" rel="noopener">Abrir em nova aba ↗</a>
    </div>
    <div class="appwrap">
      <div class="appfalha">
        <b>${soArquivoLocal?'Falta carregar o app de '+esc(c.nome):'O app de '+esc(c.nome)+' não apareceu aqui?'}</b>
        ${arq?`<span>Tente "Recarregar". Se continuar em branco, carregue o arquivo do app de novo em "Editar".</span>`:`<span>O link cadastrado é <code>${esc(link)}</code>.</span>
        <span><b style="font-size:14px">Jeito mais fácil:</b> clique em "Carregar arquivo do app" e escolha o arquivo .html do cliente no seu computador.<br>Ele fica guardado dentro da central e abre aqui em qualquer lugar.</span>`}
        <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center"><button class="btn pri" onclick="abrirForm('${c.id}',true)">📄 Carregar arquivo do app</button><a class="btn" href="${esc(abs)}" target="_blank" rel="noopener">Abrir em nova aba ↗</a>${soArquivoLocal?`<button class="btn" onclick="window._tentarLink=true;renderApp(document.getElementById('app'))">Tentar pelo link</button>`:''}</div>
      </div>
      ${soArquivoLocal?'':`<iframe id="frame" class="appframe" ${arq?'':`src="${esc(abs)}"`} title="App de ${esc(c.nome)}"></iframe>`}
    </div>
  </div>`;
  const fr = document.getElementById('frame');
  if(arq && fr){
    fr.addEventListener('load', ()=>{ if(limparDados(c, fr)) return; entrarComoGestora(fr); });
    fr.srcdoc = htmlDoApp(c.id);
  }
}
// Empresa nova ou duplicada: começa sem lançamentos, sem eventos, sem favorecidos e sem equipe (só a gestora).
// Mantém apenas as configurações (categorias e mapa da planilha Zig).
function limparDados(c, fr){
  if(!c.limpar) return false;
  try{
    const w = fr.contentWindow;
    const ok = w.eval(`(function(){ if(typeof db==='undefined'||!db) return false;
      var adm = (db.users||[]).filter(function(u){return u.perfil==='admin'}).slice(0,1);
      db.users = adm.length?adm:[{id:'u1',nome:'Gestora Financeira',email:'',perfil:'admin'}];
      db.eventos=[]; db.pessoas=[]; db.pedidos=[]; db.recebimentos=[]; db.extrato=[]; db.alteracoes=[];
      db.seq=1; db.recSeq=1;
      if(typeof save==='function') save();
      return true; })()`);
    if(!ok) return false;
  }catch(e){ return false; }
  delete c.limpar; save();
  renderApp(document.getElementById('app'));   // recarrega o app já limpo
  return true;
}
// Você é a gestora: entra direto como Admin, sem passar pela tela de escolha de perfil
function entrarComoGestora(fr){
  try{
    const d = fr.contentDocument; if(!d) return;
    const bts = [...d.querySelectorAll('[data-act="entrar"]')];
    const b = bts.find(x=>/admin/i.test(x.textContent)) ;
    if(b) b.click();
  }catch(e){}
}
function trocarApp(id){ const c = achar(id); if(!c) return; c.ultimoAcesso = new Date().toISOString(); save(); appAberto = id; render(); }

          <a href="#" onclick="event.preventDefault();fechar();irPara('acessos','${id}')">Gerenciar acessos →</a></div>`:''}

function renderArqBox(id){
  const atual = arqPend===undefined ? (id && ARQ[id]) : arqPend;
  document.getElementById('arqBox').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <b style="font-size:13px">📄 Arquivo do app</b>
      <span>${atual?esc(atual.nome)+' · '+kb(atual.html.length):'Usando o app de pagamentos padrão (v'+APP_PADRAO_VERSAO+')'}</span>
      <div class="spacer"></div>
      <button type="button" class="btn sm" onclick="document.getElementById('f_arq').click()">${atual?'Trocar arquivo':'Usar outro arquivo'}</button>
      ${atual?`<button type="button" class="btn sm bad" onclick="arqPend=null;renderArqBox('${id||''}')">Remover</button>`:''}
    </div>

function lerArquivo(inp, id){
  const f = inp.files[0]; if(!f) return;
  if(!/\.html?$/i.test(f.name)) { toast('Escolha um arquivo .html'); return; }
  const r = new FileReader();
  r.onload = () => { arqPend = {nome:f.name, html:String(r.result), em:new Date().toISOString()}; renderArqBox(id); toast('Arquivo carregado. Clique em Salvar.'); };
  r.readAsText(f);
}
function escolherCor(k){ corSel = k; document.querySelectorAll('#cores button').forEach(b=>b.classList.toggle('on', b.dataset.c===k)); }
function fechar(){ document.getElementById('modal').innerHTML=''; }
function salvar(id){
  const v = k => document.getElementById('f_'+k).value.trim();
  const nome = v('nome'), link = v('link');
  if(!nome) return toast('Informe o nome do cliente.');
  if(link && !linkSeguro(link)) return toast('Esse link não é permitido. Use um arquivo .html ou um endereço https://');
  const dados = { nome, segmento:v('segmento'), cnpj:v('cnpj'), responsavel:v('responsavel'), telefone:v('telefone'), email:v('email'),
    link, status:v('status'), cor:corSel, obs:v('obs') };
  const temArq = arqPend!==undefined ? !!arqPend : !!(id && ARQ[id]);
  if(!id){ id = uid(); db.clientes.push({ id, dadosProprios:true, limpar:true, fav:false, criadoEm:new Date().toISOString(), ultimoAcesso:null, ...dados }); toast('Cliente adicionado'); }
  else { Object.assign(achar(id), dados); toast('Cliente atualizado'); }
  if(arqPend!==undefined) guardarArquivo(id, arqPend);
  save(); fechar(); render();
}
// Cria um novo cliente igual a este (mesmo app), com dados próprios começando do zero
async function duplicar(id){
  const o = achar(id); if(!o) return;
  const nid = uid();
  const copia = {...JSON.parse(JSON.stringify(o)), id:nid, nome:o.nome+' (cópia)', fav:false, criadoEm:new Date().toISOString(), ultimoAcesso:null, dadosProprios:true, limpar:true, dadosOriginais:false};
  db.clientes.push(copia);
  if(ARQ[id]) await guardarArquivo(nid, {...ARQ[id], em:new Date().toISOString()});
  save(); render();
  toast('Cliente duplicado. Ajuste o nome e os dados.');
  abrirForm(nid);
}
function excluir(id){
  const b = document.getElementById('btnExcluir');
  if(b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='Clique de novo para confirmar'; b.style.background='#fef2f2'; return; }
  db.clientes = db.clientes.filter(c=>c.id!==id);
  if(ARQ[id]) guardarArquivo(id, null);
  db.pessoas.forEach(p=>{ if(p.acessos) delete p.acessos[id]; });
  save(); fechar(); render(); toast('Cliente excluído');
}

        ${id?`<button class="btn bad" id="btnExcluirP" onclick="excluirPessoa('${id}')">Remover pessoa</button><div class="spacer"></div>`:''}
        <button class="btn" onclick="fechar()">Cancelar</button>
        <button class="btn pri" onclick="salvarPessoa(${id?`'${id}'`:'null'})">${id?'Salvar':'Cadastrar pessoa'}</button>
      </div>
    </div>
  </div>`;
  renderAccList();
  setTimeout(()=>document.getElementById('p_nome').focus(), 30);
}
function renderAccList(){
  const el = document.getElementById('accList');
  if(!db.clientes.length){ el.innerHTML = '<div class="meta">Cadastre um cliente primeiro.</div>'; return; }
  el.innerHTML = db.clientes.map(c=>{
    const a = rascunho[c.id];
    return `<div class="acc ${a?'on':''}">
      <div class="acc-h">
        <label><input type="checkbox" ${a?'checked':''} onchange="toggleAcc('${c.id}',this.checked)">
          <span class="av sm" style="--cor:${esc(c.cor)};width:22px;height:22px;font-size:10px;border-radius:6px">${esc(iniciais(c.nome))}</span>${esc(c.nome)}</label>
        ${a?`<select onchange="setPerfil('${c.id}',this.value)">
          ${Object.entries(PERFIS).map(([k,v])=>`<option value="${k}" ${a.perfil===k?'selected':''}>${v.nome}</option>`).join('')}
        </select>`:'<span class="meta" style="margin-left:auto">Sem acesso</span>'}
      </div>
      ${a?`<div class="hint" style="margin-top:4px">${esc(PERFIS[a.perfil]?.desc||'')}</div>
      <div class="perms">${PERMS.map(([g,itens])=>`<div class="grp">${g}</div>`+itens.map(([k,n])=>
        `<label><input type="checkbox" ${a.perms.includes(k)?'checked':''} onchange="setPerm('${c.id}','${k}',this.checked)">${n}</label>`).join('')).join('')}</div>`:''}
    </div>`;
  }).join('');
}
function toggleAcc(cid, on){ if(on) rascunho[cid] = {perfil:'solicitante', perms:[...PERFIS.solicitante.perms]}; else delete rascunho[cid]; renderAccList(); }
function setPerfil(cid, perfil){ const a = rascunho[cid]; a.perfil = perfil; if(perfil!=='custom') a.perms = [...PERFIS[perfil].perms]; renderAccList(); }
function setPerm(cid, k, on){
  const a = rascunho[cid];
  a.perms = on ? [...new Set([...a.perms, k])] : a.perms.filter(x=>x!==k);
  const igual = Object.entries(PERFIS).find(([pk,v])=>pk!=='custom' && v.perms.length===a.perms.length && v.perms.every(x=>a.perms.includes(x)));
  a.perfil = igual ? igual[0] : 'custom';
  renderAccList();
}
function salvarPessoa(id){
  const v = k => document.getElementById('p_'+k).value.trim();
  const nome = v('nome'), email = v('email');
  if(!nome) return toast('Informe o nome.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('Informe um e-mail válido.');
  if(db.pessoas.some(p=>p.id!==id && p.email.toLowerCase()===email.toLowerCase())) return toast('Já existe uma pessoa com esse e-mail.');
  const vazio = Object.entries(rascunho).find(([,a])=>!a.perms.length);
  if(vazio) return toast(`Marque pelo menos uma permissão em ${achar(vazio[0])?.nome||'um cliente'}, ou tire o acesso.`);
  const dados = {nome, email, telefone:v('telefone'), tipo:v('tipo'), status:v('status'), acessos:rascunho};
  if(id){ Object.assign(pessoa(id), dados); toast('Acessos atualizados'); }
  else { db.pessoas.push({id:uid(), criadoEm:new Date().toISOString(), ...dados}); toast('Pessoa cadastrada'); }
  save(); fechar(); render();
}
function excluirPessoa(id){
  const b = document.getElementById('btnExcluirP');
  if(b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='Clique de novo para confirmar'; b.style.background='#fef2f2'; return; }
  db.pessoas = db.pessoas.filter(p=>p.id!==id); save(); fechar(); render(); toast('Pessoa removida');
}

/* ---------- backup ---------- */
function toggleMenu(e){ e.stopPropagation(); document.getElementById('menuPop').classList.toggle('on'); }
document.addEventListener('click', ()=>document.getElementById('menuPop')?.classList.remove('on'));
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(document.getElementById('modal').innerHTML) fechar(); } });
function exportar(){
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'central-clientes-' + new Date().toISOString().slice(0,10) + '.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000); toast('Arquivo de backup baixado');
}
function importar(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.clientes)) throw 0;
      let n=0, m=0;
      d.clientes.forEach(c=>{ if(c && c.nome){ const ex = c.id && achar(c.id); if(ex) Object.assign(ex,c); else db.clientes.push({...c, id:c.id||uid()}); n++; } });
      (d.pessoas||[]).forEach(p=>{ if(p && p.email){ const ex = (p.id && pessoa(p.id)) || db.pessoas.find(x=>x.email.toLowerCase()===String(p.email).toLowerCase()); if(ex) Object.assign(ex,p,{id:ex.id}); else db.pessoas.push({acessos:{}, ...p, id:p.id||uid()}); m++; } });
      save(); load(); render(); toast(`${n} cliente(s) e ${m} pessoa(s) importados`);
    }catch(e){ toast('Arquivo inválido. Use um backup exportado por este painel.'); }
    inp.value='';
  };
  r.readAsText(f);
}

load(); render();
idbTodos().then(t=>{ Object.assign(ARQ, t); render(); }).catch(()=>{ idbOk=false; });
</script>
