<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagamentos de Eventos</title>
<style>
:root{
  --bg:#f4f5f8;--card:#fff;--text:#1d2330;--muted:#6b7280;--line:#e5e7eb;
  --brand:#5b3df5;--brand-soft:#ede9fe;
  --aguardando:#f59e0b;--aprovado:#3b82f6;--pago:#10b981;--recusado:#ef4444;--cancelado:#9ca3af;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button,select,input,textarea{font:inherit}
.demo-bar{background:#1d2330;color:#fff;font-size:12px;padding:6px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.demo-bar button{background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:6px;padding:2px 8px;cursor:pointer}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.logo span{background:var(--brand);color:#fff;border-radius:8px;width:28px;height:28px;display:grid;place-items:center}
.who{margin-left:auto;display:flex;align-items:center;gap:8px}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-weight:600}
nav{background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 12px;overflow-x:auto}
nav button{background:none;border:none;padding:12px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
main{padding:16px;max-width:1400px;margin:0 auto}
h2{margin:0 0 12px;font-size:18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select,.toolbar input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:#c7cad1}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ok{background:var(--pago);border-color:var(--pago);color:#fff}
.btn.blue{background:var(--aprovado);border-color:var(--aprovado);color:#fff}
.btn.bad{color:var(--recusado);border-color:#fecaca}
.btn.sm{padding:4px 8px;font-size:12px}
.spacer{flex:1}
/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#eceef3;border-radius:12px;padding:10px;min-height:200px}
.col-h{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:8px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.col-h small{margin-left:auto;color:var(--muted);font-weight:500}
.col-total{font-size:12px;color:var(--muted);margin:-4px 0 8px 16px}
.card{background:var(--card);border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px #0000000d;cursor:pointer;border-left:3px solid var(--line)}
.card:hover{box-shadow:0 2px 8px #00000014}
/* Colunas finalizadas (pago, recusado, cancelado) mais claras para destacar as duas primeiras */
.col-fim{background:#f5f6f9}
.col-fim .col-h,.col-fim .col-total{opacity:.6}
.col-fim .card{opacity:.55;box-shadow:none}
.col-fim .card:hover{opacity:1;box-shadow:0 2px 8px #00000014}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ev{font-size:11px;color:var(--brand);font-weight:600}
.val{font-weight:700;white-space:nowrap}
.fav{font-weight:600;margin:4px 0 2px}
.meta{font-size:12px;color:var(--muted)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:16px 0}
/* tabela */
.panel{background:var(--card);border-radius:12px;border:1px solid var(--line);padding:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
tr.click{cursor:pointer}
tr.click:hover td{background:#fafafa}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;color:#fff;font-weight:600}
.right{text-align:right}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.hist-item{border-top:1px solid var(--line);padding:10px 0}
.hist-item:first-of-type{border-top:0}
.hist-x{position:absolute;top:8px;right:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:18px;line-height:1;cursor:pointer}
.hist-x:hover{background:#fef2f2;color:var(--recusado);border-color:#fecaca}
.hist-tab{margin:6px 0 0 4px;width:auto}
.hist-tab td{border:0;padding:2px 8px 2px 0;white-space:normal;font-size:13px}
.kpi.click{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.kpi.click:hover{border-color:var(--brand);box-shadow:0 2px 10px #5b3df51f}
.kpi.click::after{content:'Ver lista →';display:block;font-size:11px;color:var(--brand);margin-top:6px;opacity:.75}
.kpi .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.chart{display:flex;align-items:flex-end;gap:6px;height:220px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;position:relative}
.bar .seg{width:100%}
.bar .seg:first-child{border-radius:4px 4px 0 0}
.bar .lab{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.bar .tot{font-size:10px;color:var(--muted);text-align:center;margin-bottom:2px;white-space:nowrap}
.hbar{display:grid;grid-template-columns:150px 1fr 110px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.hbar .track{background:#f0f1f4;border-radius:4px;height:14px;overflow:hidden}
.hbar .fill{height:100%;background:var(--brand);border-radius:4px}
.hbar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:10px}
.evitem{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.evitem:hover{border-color:var(--pago);background:#f0fdf4}
.evitem small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
/* modal */
.overlay{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:10}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:560px;padding:20px}
.modal h3{margin:0 0 14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:#fff}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.det{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:13px}
.det dt{color:var(--muted)}
.det dd{margin:0}
.hist{border-left:2px solid var(--line);margin:8px 0 0 4px;padding-left:12px}
.hist div{margin-bottom:8px;font-size:13px}
.hist small{color:var(--muted);display:block}
.note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:8px 10px;font-size:12px;margin-top:12px}
/* login */
.login{max-width:520px;margin:40px auto;background:var(--card);border-radius:16px;padding:24px;border:1px solid var(--line)}
.login h1{font-size:20px;margin:0 0 4px}
.login p{color:var(--muted);margin:0 0 16px}
.ulist{display:grid;gap:8px}
.ubtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;text-align:left}
.ubtn:hover{border-color:var(--brand)}
.av{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.ubtn small{display:block;color:var(--muted)}
/* campo de escolha com busca */
/* filtro por coluna */
.cf-row th{padding:4px 6px 8px;background:transparent}
.cf-in{width:100%;min-width:90px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-weight:400;background:#fafbfc;color:var(--text)}
.cf-in:focus{outline:2px solid var(--brand-soft);border-color:var(--brand);background:#fff}
.cf-row .combo-in{padding:5px 22px 5px 8px;font-size:12px;background:#fafbfc;min-width:90px;font-weight:400}
.cf-row .combo::after{right:7px}
/* múltipla escolha */
.ms-btn{text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.ms-btn.ativo{border-color:var(--brand);background:var(--brand-soft)!important;color:var(--brand);font-weight:600}
.ms-painel{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #00000026;max-width:min(360px,92vw);display:flex;flex-direction:column}
.ms-busca{margin:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.ms-acoes{display:flex;justify-content:space-between;padding:0 10px 6px;font-size:12px}
.ms-acoes a{color:var(--brand);text-decoration:none}
.ms-ops{max-height:250px;overflow:auto;border-top:1px solid var(--line)}
.ms-op{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;font-size:13px;cursor:pointer;color:var(--text);font-weight:400}
.ms-op:hover{background:var(--brand-soft)}
.ms-op input{margin-top:2px;accent-color:var(--brand)}
.ms-rodape{border-top:1px solid var(--line);padding:8px;display:flex;justify-content:flex-end}
.combo{position:relative;display:block}
.toolbar .combo{display:inline-block;min-width:180px}
.combo::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:12px}
.combo-in{width:100%;padding:7px 28px 7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
.combo-in:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.combo-in:disabled{background:#f3f4f6;color:var(--muted)}
.form .combo-in{padding:8px 28px 8px 10px}
.combo-sel{position:absolute!important;opacity:0;pointer-events:none;width:1px!important;height:1px!important;left:0;bottom:0;padding:0!important;border:0!important}
.combo-list{display:none;position:absolute;z-index:40;left:0;top:calc(100% + 4px);min-width:100%;width:max-content;max-width:min(420px,90vw);background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #00000022;max-height:260px;overflow:auto}
.combo-op{padding:8px 10px;cursor:pointer;font-size:13px;white-space:normal}
.combo-op:hover,.combo-op.at{background:var(--brand-soft)}
.combo-op.sel{font-weight:600;color:var(--brand)}
.combo-vazio{padding:8px 10px;color:var(--muted);font-size:13px}
/* aviso de nova versão */
.aviso-versao{position:fixed;top:0;left:0;right:0;z-index:70;background:var(--brand);color:#fff;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 48px 10px 16px;box-shadow:0 4px 16px #0003;font-size:14px}
.aviso-versao .btn{background:#fff;color:var(--brand);border-color:#fff;font-weight:700}
.aviso-x{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer;opacity:.8}
.novidades li{margin:6px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2330;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;font-size:13px}
@media (max-width:760px){
  table.cards thead{display:block}
  table.cards thead tr:not(.cf-row){display:none}
  table.cards thead tr.cf-row{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 8px}
  table.cards thead tr.cf-row th{display:block;flex:1 1 140px;padding:0;border:0}
  table.cards thead tr.cf-row th:empty{display:none}
  table.cards tr{display:block;border-bottom:1px solid var(--line);padding:10px 0}
  table.cards td{display:block;border:none;padding:2px 0;white-space:normal!important;min-width:0!important}
  table.cards td.right{text-align:left;font-size:15px}
  table.cards td:empty{display:none}
  .grid2{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .hbar{grid-template-columns:100px 1fr 90px}
  .kanban{grid-template-columns:repeat(5,82vw)}
  .who .nm{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ================= CONFIGURAÇÃO =================
const STATUS = {
  aguardando:{nome:'Aguardando aprovação',cor:'var(--aguardando)'},
  aprovado:{nome:'Aprovado · a pagar',cor:'var(--aprovado)'},
  pago:{nome:'Pago',cor:'var(--pago)'},
  recusado:{nome:'Recusado',cor:'var(--recusado)'},
  cancelado:{nome:'Cancelado',cor:'var(--cancelado)'}
};
const ORDEM = ['aguardando','aprovado','pago','recusado','cancelado'];
const PERFIS = {admin:'Admin master',dono:'Sócio',produtor:'Produtor'};
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const FORMAS = ['PIX','Transferência','Boleto','Dinheiro'];
const KEY = 'demo-pagamentos-eventos-v5';
const HOJE = new Date().toISOString().slice(0,10);

let db, me = null, view = 'kanban';
// ================= PLATAFORMA ZIG =================
// Plano de contas copiado da planilha modelo "contas_a_pagar_exemplo_plataforma_zig.xlsx"
const ZIG_PLANO = ["01.03.06.01.00 - ICMS","01.03.06.02.00 - PIS","01.03.06.03.00 - Cofins","01.03.06.04.00 - ISS","02.01.01.01.00 - APP","02.01.01.02.00 - Credito","02.01.01.03.00 - Debito","02.01.01.04.00 - VR/VA","02.01.01.05.00 - MBWAY","02.01.01.06.00 - PIX","02.01.01.07.00 - Valor Antecipado","02.01.02.01.00 - Credito","02.01.02.02.00 - Debito","02.01.02.03.00 - PIX","02.01.02.04.00 - VR/VA","02.01.02.05.00 - Fee integração","02.01.02.06.00 - Taxa Ifood","02.01.03.00.00 - Aluguel de Terminais","02.03.99.00.00 - Entrada de notas - Compra de mercadorias","02.04.01.01.01 - Pagamento de Salários Operações","02.04.01.01.02 - Horas Extras Operações","02.04.01.01.03 - Rescisões Operações","02.04.01.02.01 - GPS - INSS","02.04.01.02.02 - DARF","02.04.01.02.03 - IRRFS","02.04.01.02.04 - FGTS","02.04.01.02.05 - RAT","02.04.01.02.06 - Exames","02.04.01.02.07 - Sindicato","02.04.01.03.01 - Vale Transporte Operações","02.04.01.03.02 - Vale Alimentação Operações","02.04.01.03.03 - Vale Refeição Operações","02.04.01.03.04 - Uniformes","02.04.01.03.05 - Outros benefícios de Operações","02.04.02.00.00 - Coleta de Lixo","02.04.03.00.00 - Outras remunerações operacionais","02.05.01.00.00 - Bandas e DJs","02.05.02.00.00 - Direitos Autorais - ECAD","02.06.01.00.00 - Taxas ZIG","02.06.02.01.00 - Mensalidades","02.06.03.01.00 - Taxa sobre vendas de bar","02.06.03.02.00 - Taxa sobre vendas de bilheteria","02.07.01.01.01 - Pagamento de Salários ADM","02.07.01.01.02 - Horas Extras ADM","02.07.01.01.03 - Rescisões ADM","02.07.01.02.01 - Prolabore Sócio 1","02.07.01.03.01 - GPS - INSS","02.07.01.03.02 - DARF","02.07.01.03.03 - IRRFS","02.07.01.03.04 - FGTS","02.07.01.03.05 - RAT","02.07.01.03.06 - Exames","02.07.01.03.07 - Sindicato","02.07.01.04.01 - Vale Transporte","02.07.01.04.02 - Vale Alimentação","02.07.01.04.03 - Vale Refeição","02.07.01.04.04 - Outros benefícios","03.01.02.01.00 - Acessoria Jurídica","03.01.02.02.00 - Despesas com Viagens","03.01.02.03.00 - Agência de Mkt","03.01.02.04.00 - Contabilidade","03.01.02.05.00 - Consultorias","03.01.02.06.00 - Materiais e brindes promocionais","03.01.02.07.00 - Campanhas de mkt","03.01.02.08.00 - Acessoria Financeira","03.01.02.09.00 - Outros Serviços","03.01.02.10.00 - Serviços e suporte de TI","03.01.03.01.00 - Seguros Gerais","03.01.03.02.00 - Associações","03.01.03.03.00 - Materiais de escritorio","03.01.03.04.00 - Energia elétrica","03.01.03.05.00 - Telefonia","03.01.03.06.00 - Aluguel","03.01.03.07.00 - Ajustes Zig","03.01.03.08.00 - Outras despesas administrativas","03.02.01.00.00 - Taxa de Antecipação","03.02.02.01.00 - Tarifas bancárias","03.02.02.02.00 - Zig","03.02.02.03.00 - Outros Serviços Bancários","03.02.02.04.00 - Juros e Multa","03.02.02.05.00 - Juros sobre empréstimos","03.03.01.00.00 - Provisão IRPJ","03.03.02.00.00 - Provisão CSLL","03.04.01.00.00 - Instalações","03.04.02.00.00 - Máquinas e Equipamentos","03.04.03.00.00 - Móveis e Decoração","03.04.04.00.00 - Equipamentos de Iluminação","03.04.05.00.00 - Equipamentos de Som","03.04.06.00.00 - Copos, Taças e Talheres","03.04.07.00.00 - Equipamento de TI","03.04.08.00.00 - Veiculos","03.04.09.00.00 - Outros Investimentos"];
// Sugestão inicial: categoria do app -> plano de contas Zig (a gestora pode trocar na tela de exportação)
const ZIG_PADRAO = {'Cachê artístico':'02.05.01.00.00 - Bandas e DJs','Segurança':'03.01.02.09.00 - Outros Serviços','Bar e bebidas':'02.03.99.00.00 - Entrada de notas - Compra de mercadorias','Som e iluminação':'03.01.02.09.00 - Outros Serviços','Estrutura e locação':'03.01.03.06.00 - Aluguel','Divulgação':'03.01.02.07.00 - Campanhas de mkt','Limpeza':'03.01.02.09.00 - Outros Serviços','Equipe de apoio':'02.04.03.00.00 - Outras remunerações operacionais','Fotografia e vídeo':'03.01.02.09.00 - Outros Serviços','Outros':'03.01.03.08.00 - Outras despesas administrativas'};
// Forma de pagamento do app -> opções aceitas pela Zig
const ZIG_FORMA = {'PIX':'Pix','Transferência':'Transferência bancária','Boleto':'Boleto','Dinheiro':'Dinheiro'};
let Z = {evento:'', ate:'', novos:true};

// Filtros: cada um guarda uma LISTA (dá para escolher mais de um item). Lista vazia = todos.
let F = {ano:[String(new Date().getFullYear())], mes:[], evento:[], categoria:[], status:[], produtor:[]};
const passa = (lista, v) => !lista.length || lista.includes(v);
// Link de aprovação recebido pelo WhatsApp (ex.: ...?aprovar=u4)
let linkAprovar = new URLSearchParams(location.search).get('aprovar');
// Link de autocadastro (ex.: ...?cadastro=u4): abre o formulário público, sem login
let cadastroPor = new URLSearchParams(location.search).get('cadastro');
let autoOk = null;

// ================= UTILITÁRIOS =================
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brlK = v => v>=1000 ? 'R$ '+(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil' : brl(v);
const fmt = d => { if(!d) return ''; const [dt,tm]=d.split('T'); const s=dt.split('-').reverse().join('/'); return tm ? s+' '+tm.slice(0,5) : s; };
const agora = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };
const addDias = (s,n) => { const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const uid = p => p + Math.random().toString(36).slice(2,8);

// ================= PERMISSÕES =================
// Estas regras serão aplicadas também no banco de dados na versão real.
const isAdmin = () => me?.perfil==='admin';
const isDono = () => me?.perfil==='dono';
const isProd = () => me?.perfil==='produtor';
const podeVer = p => isAdmin() || isDono() || p.criadoPor===me.id;
const podeAprovar = p => p.status==='aguardando' && (isDono() || isAdmin());
const podeEditar = p => isAdmin() || (isProd() && p.criadoPor===me.id && p.status==='aguardando');
const podeCancelar = p => p.status==='aguardando' && (isAdmin() || (isProd() && p.criadoPor===me.id));
const podePagar = p => isAdmin() && p.status==='aprovado';

function visiveis(){ return db.pedidos.filter(podeVer); }
function filtrar(lista, {status=true, periodo=true}={}){
  return lista.filter(p =>
    (!periodo || passa(F.ano, p.vencimento.slice(0,4))) &&
    (!periodo || passa(F.mes, p.vencimento.slice(5,7))) &&
    passa(F.evento, p.eventoId) &&
    passa(F.categoria, p.categoria) &&
    (!status || passa(F.status, p.status)));
}

// <select multiple> que vira um filtro de múltipla escolha (ver turbinarSelects)
const filtroMulti = (k, todos, ops) => `<select multiple data-f="${k}" data-ph="${h(todos)}">${ops.map(([v,t])=>`<option value="${h(v)}" ${F[k].includes(v)?'selected':''}>${h(t)}</option>`).join('')}</select>`;
function filtrosHTML({periodo=true,status=true,categoria=true}={}){
  const anos = [...new Set(db.pedidos.map(p=>p.vencimento.slice(0,4)))].sort();
  return `
   ${periodo?filtroMulti('ano','Todos os anos',anos.map(a=>[a,a]))+filtroMulti('mes','Todos os meses',MESES.map((m,i)=>[String(i+1).padStart(2,'0'),m])):''}
   ${filtroMulti('evento','Todos os eventos',db.eventos.map(e=>[e.id,e.nome]))}
   ${categoria?filtroMulti('categoria','Todas as categorias',db.categorias.map(c=>[c,c])):''}
   ${status?filtroMulti('status','Todos os status',ORDEM.map(s=>[s,STATUS[s].nome])):''}
   <button class="btn sm" data-act="limpar">Limpar filtros</button>`;
}

function botoes(p){
  let b='';
  if (podeAprovar(p)) b += `<button class="btn sm blue" data-act="aprovar" data-id="${p.id}">Aprovar</button><button class="btn sm bad" data-act="motivo" data-id="${p.id}" data-arg="recusado">Recusar</button>`;
  if (podePagar(p)) b += `<button class="btn sm ok" data-act="pagar" data-id="${p.id}">Marcar como pago</button>`;
  if (podeEditar(p) && !isAdmin()) b += `<button class="btn sm" data-act="form" data-id="${p.id}">Editar</button>`;
  if (podeCancelar(p) && isProd()) b += `<button class="btn sm bad" data-act="motivo" data-id="${p.id}" data-arg="cancelado">Cancelar</button>`;
  return b;
}

  return `<div class="card" style="border-left-color:${STATUS[p.status].cor}" data-act="ver" data-id="${p.id}">

}

function docValido(d){
  d = (d||'').replace(/\D/g,'');
  if (d.length===11){ if (/^(\d)\1+$/.test(d)) return false;
    let s=0; for (let i=0;i<9;i++) s += +d[i]*(10-i); let r=(s*10)%11%10; if (r !== +d[9]) return false;
    s=0; for (let i=0;i<10;i++) s += +d[i]*(11-i); r=(s*10)%11%10; return r === +d[10]; }
  if (d.length===14){ if (/^(\d)\1+$/.test(d)) return false;
    const dv = n => { const w = n===12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2]; let s=0; for (let i=0;i<n;i++) s += +d[i]*w[i]; const r=s%11; return r<2 ? 0 : 11-r; };
    return dv(12) === +d[12] && dv(13) === +d[13]; }

}

function modal(html, largura){ fechar(); const o=document.createElement('div'); o.className='overlay'; o.id='ov'; o.innerHTML=`<div class="modal" ${largura?`style="max-width:${largura}px"`:''}>${html}</div>`; o.addEventListener('mousedown',e=>{ if(e.target===o) fechar(); }); document.body.appendChild(o); turbinarSelects(o); filtrosDeColuna(o); }

// ================= FILTRO DE MÚLTIPLA ESCOLHA =================
// Para <select multiple>: abre uma lista com caixinhas de marcar + campo de busca.
// data-ph = texto quando nada está marcado; data-live="1" = aplica na hora (sem botão Aplicar).
function multiCombo(sel){
  const wrap = document.createElement('div'); wrap.className = 'combo ms';
  sel.parentNode.insertBefore(wrap, sel);
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'combo-in ms-btn';
  const painel = document.createElement('div'); painel.className = 'ms-painel';
  wrap.append(btn, sel); sel.classList.add('combo-sel'); sel.tabIndex = -1;
  const live = sel.dataset.live === '1', ph = sel.dataset.ph || 'Todos';
  const resumo = () => { const s = [...sel.selectedOptions];
    btn.classList.toggle('ativo', s.length > 0);
    btn.textContent = !s.length ? ph : s.length <= 2 ? s.map(o=>o.text).join(', ') : s.length + ' selecionados';
    btn.title = s.map(o=>o.text).join(', '); };
  resumo();
  let aberto = false, mudou = false, busca = '';
  const desenhar = () => { const f = semAcento(busca);
    const ops = [...sel.options].filter(o => !f || semAcento(o.text).includes(f));
    painel.querySelector('.ms-ops').innerHTML = ops.map(o=>`<label class="ms-op"><input type="checkbox" data-v="${h(o.value)}" ${o.selected?'checked':''}><span>${h(o.text)}</span></label>`).join('')
      || '<div class="combo-vazio">Nenhum resultado</div>'; };
  const reposicionar = () => { const r = btn.getBoundingClientRect();
    painel.style.minWidth = Math.max(r.width, 220) + 'px';
    painel.style.left = Math.max(8, Math.min(r.left, innerWidth - painel.offsetWidth - 8)) + 'px';
    painel.style.top = (r.bottom + 4) + 'px'; };
  const fora = e => { if (!painel.contains(e.target) && !btn.contains(e.target)) fechar(); };
  const fechar = () => { if (!aberto) return; aberto = false; painel.remove();
    document.removeEventListener('mousedown', fora, true); window.removeEventListener('scroll', reposicionar, true);
    if (mudou){ mudou = false; sel.dispatchEvent(new Event('change', {bubbles:true})); } };
  const avisar = () => { resumo(); if (live) sel.dispatchEvent(new Event('change', {bubbles:true})); else mudou = true; };
  btn.addEventListener('click', () => {
    if (aberto) return fechar();
    aberto = true; busca = '';
    painel.innerHTML = `<input class="ms-busca" placeholder="Digite para buscar…"><div class="ms-acoes"><a href="#" data-ms="todos">Marcar todos</a><a href="#" data-ms="limpar">Limpar</a></div><div class="ms-ops"></div>${live?'':'<div class="ms-rodape"><button type="button" class="btn sm pri" data-ms="ok">Aplicar</button></div>'}`;
    document.body.appendChild(painel); desenhar(); reposicionar();
    painel.querySelector('.ms-busca').focus();
    document.addEventListener('mousedown', fora, true); window.addEventListener('scroll', reposicionar, true);
  });
  painel.addEventListener('input', e => { if (e.target.classList.contains('ms-busca')){ busca = e.target.value; desenhar(); } });
  painel.addEventListener('change', e => { const v = e.target.dataset.v; if (v === undefined) return; e.stopPropagation();
    const o = [...sel.options].find(o=>o.value===v); if (o){ o.selected = e.target.checked; avisar(); } });
  painel.addEventListener('click', e => { const a = e.target.closest('[data-ms]'); if (!a) return; e.preventDefault(); e.stopPropagation();
    if (a.dataset.ms === 'ok') return fechar();
    const visiveis = [...painel.querySelectorAll('.ms-ops input')].map(i=>i.dataset.v);
    [...sel.options].forEach(o => { if (a.dataset.ms === 'limpar') o.selected = false; else if (visiveis.includes(o.value)) o.selected = true; });
    desenhar(); avisar(); });
  painel.addEventListener('keydown', e => {
    if (e.key === 'Escape') fechar();
    if (e.key === 'Enter'){ e.preventDefault(); const p = painel.querySelector('.ms-ops input'); if (busca && p) p.click(); else fechar(); } });
}

// ================= FILTRO POR COLUNA NAS TABELAS =================
// Em toda tabela com a classe "filtravel" aparece, embaixo dos títulos, um campo por coluna.
// É só digitar: o sistema sugere os nomes daquela coluna e esconde as linhas que não combinam.
const CFS = {};   // lembra o que foi digitado em cada tabela, mesmo quando a tela é redesenhada
function filtrosDeColuna(root){
  root.querySelectorAll('table.filtravel:not([data-cf])').forEach(tb => {
    tb.dataset.cf = '1';
    const key = tb.dataset.key, st = CFS[key] || (CFS[key] = {});
    const linhas = () => [...tb.tBodies[0].rows].filter(r => !r.querySelector('.empty'));
    // valor "principal" da célula (data-v quando existir, senão a 1ª linha do texto)
    const valor = (r, i) => { const c = r.cells[i]; return c ? (c.dataset.v ?? (c.innerText||'').split('\n')[0].trim()) : ''; };
    const linha = document.createElement('tr'); linha.className = 'cf-row';
    [...tb.tHead.rows[0].cells].forEach((th, i) => {
      const c = document.createElement('th');
      const titulo = th.textContent.trim();
      if (titulo){
        const valores = [...new Set(linhas().map(r => valor(r,i)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true}));
        c.innerHTML = `<select multiple data-col="${i}" data-live="1" data-ph="🔍 ${h(titulo)}">${valores.map(v=>`<option value="${h(v)}" ${(st[i]||[]).includes(v)?'selected':''}>${h(v)}</option>`).join('')}</select>`;
      }
      linha.appendChild(c);
    });
    tb.tHead.appendChild(linha);
    turbinarSelects(linha);
    const aplicar = () => {
      const fs = Object.entries(st).map(([c,v]) => [+c, v]).filter(([,v]) => v && v.length);
      let n = 0, tot = 0;
      linhas().forEach(r => {
        const ok = fs.every(([c,v]) => v.includes(valor(r,c)));
        r.style.display = ok ? '' : 'none';
        if (ok){ n++; tot += +(r.dataset.valor||0); }
      });
      const cnt = tb.querySelector('[data-cnt]'); if (cnt) cnt.textContent = n+' '+cnt.dataset.cnt;
      const tt = tb.querySelector('[data-tot]'); if (tt) tt.textContent = brl(tot);
      let vazio = tb.tBodies[0].querySelector('.cf-vazio');
      if (!n && linhas().length){ if(!vazio){ vazio=document.createElement('tr'); vazio.className='cf-vazio'; vazio.innerHTML=`<td colspan="${tb.tHead.rows[0].cells.length}" class="empty">Nada encontrado com esse filtro</td>`; tb.tBodies[0].appendChild(vazio);} }
      else if (vazio) vazio.remove();
    };
    tb.addEventListener('change', e => { const c = e.target.dataset.col; if (c !== undefined){ st[c] = [...e.target.selectedOptions].map(o=>o.value); aplicar(); } });
    aplicar();
  });
}

// ================= CAMPO DE ESCOLHA COM BUSCA =================
// Transforma todo <select> em um campo onde dá para digitar e o sistema sugere os nomes.
// O <select> original continua escondido por baixo, então formulários e filtros funcionam igual.
const semAcento = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function turbinarSelects(root){
  root.querySelectorAll('select:not([data-combo])').forEach(sel => {
    sel.dataset.combo = '1';
    if (sel.multiple) return multiCombo(sel);
    const wrap = document.createElement('div'); wrap.className = 'combo';
    sel.parentNode.insertBefore(wrap, sel);
    const inp = document.createElement('input');
    inp.type = 'text'; inp.className = 'combo-in'; inp.autocomplete = 'off'; inp.spellcheck = false;
    const vazio = [...sel.options].find(o=>o.value==='');
    inp.placeholder = (vazio && vazio.text !== '—' ? vazio.text : 'Digite para buscar…');
    inp.disabled = sel.disabled;
    const lista = document.createElement('div'); lista.className = 'combo-list';
    wrap.append(inp, lista, sel);           // o campo de texto vem antes para o rótulo focar nele
    sel.classList.add('combo-sel'); sel.tabIndex = -1;
    if (sel.required){ inp.required = true; sel.required = false; }
    const opts = () => [...sel.options];
    const textoAtual = () => { const o = sel.selectedOptions[0]; return o && o.value!=='' ? o.text : ''; };
    inp.value = textoAtual();
    let vis = [], ativo = -1;
    const desenhar = filtro => {
      const f = semAcento(filtro||'');
      vis = opts().filter(o => !f || semAcento(o.text).includes(f));
      lista.innerHTML = vis.map((o,i)=>`<div class="combo-op${o.value===sel.value?' sel':''}${i===ativo?' at':''}" data-i="${i}">${h(o.text)}</div>`).join('')
        || '<div class="combo-vazio">Nenhum resultado para "'+h(filtro)+'"</div>';
      lista.style.display = 'block';
      lista.querySelector('.at')?.scrollIntoView({block:'nearest'});
    };
    const escolher = o => {
      lista.style.display = 'none';
      inp.value = o.value==='' ? '' : o.text;
      if (o.value !== sel.value){ sel.value = o.value; sel.dispatchEvent(new Event('change',{bubbles:true})); }
    };
    inp.addEventListener('focus', () => { ativo = -1; desenhar(''); setTimeout(()=>inp.select(),0); });
    inp.addEventListener('input', () => { ativo = 0; desenhar(inp.value); });
    inp.addEventListener('keydown', e => {
      if (e.key==='ArrowDown'){ ativo = Math.min(ativo+1, vis.length-1); desenhar(inp.value); e.preventDefault(); }
      else if (e.key==='ArrowUp'){ ativo = Math.max(ativo-1, 0); desenhar(inp.value); e.preventDefault(); }
      else if (e.key==='Enter'){ if (lista.style.display==='block' && vis[ativo]) { escolher(vis[ativo]); } e.preventDefault(); }
      else if (e.key==='Escape'){ lista.style.display='none'; inp.value = textoAtual(); }
    });
    lista.addEventListener('mousedown', e => { const d = e.target.closest('.combo-op'); e.preventDefault(); if (d) { escolher(vis[+d.dataset.i]); inp.blur(); } });
    inp.addEventListener('blur', () => {
      lista.style.display = 'none';
      const t = semAcento(inp.value.trim());
      if (!t){ if (vazio && sel.value!=='') escolher(vazio); inp.value = textoAtual(); return; }
      const achou = opts().find(o => semAcento(o.text)===t) || (vis.length===1 ? vis[0] : null);
      if (achou) escolher(achou); else inp.value = textoAtual();
    });
  });
}

function salvarPedido(id){
  const f = document.getElementById('fPedido'); if(!f.reportValidity()) return;
  const d = Object.fromEntries(new FormData(f));
  const arq = f.anexo.files[0]?.name;
  const dados = {eventoId:d.eventoId,pessoaId:d.pessoaId,categoria:d.categoria,valor:Number(d.valor),vencimento:d.vencimento,forma:d.forma,descricao:d.descricao.trim()};
  if (id){
    const p = db.pedidos.find(x=>x.id===id); if(!podeEditar(p)) return;
    // registra no histórico exatamente o que mudou (antes → depois)
    const rotulos = {eventoId:['Evento',v=>evento(v).nome],pessoaId:['Favorecido',v=>pessoa(v).nome],categoria:['Categoria',v=>v],valor:['Valor',v=>brl(v)],vencimento:['Vencimento',v=>fmt(v)],forma:['Forma',v=>v],descricao:['Descrição',v=>v||'—']};
    const difs = Object.keys(rotulos).filter(k=>String(p[k]??'')!==String(dados[k]??'')).map(k=>`${rotulos[k][0]}: ${rotulos[k][1](p[k])} → ${rotulos[k][1](dados[k])}`);
    if (arq) difs.push(`Anexo: ${p.anexo||'—'} → ${arq}`);
    if (!difs.length){ fechar(); return toast('Nenhum dado foi alterado.'); }
    Object.assign(p, dados); if(arq) p.anexo=arq;
    p.historico.push({quando:agora(),quem:me.id,acao:'Editou o pedido — '+difs.join('; ')});
    toast('Pedido atualizado');
  } else {
    const p = {id:'PG-'+String(db.seq++).padStart(4,'0'),...dados,anexo:arq||'',status:'aguardando',criadoPor:me.id,criadoEm:HOJE,historico:[{quando:agora(),quem:me.id,acao:'Criou o pedido'}]};
    db.pedidos.push(p);
    save(); fechar(); render();
    if (isProd()) compartilhar(true); else toast('Pedido '+p.id+' enviado para aprovação');
    return;
  }
  save(); fechar(); render();
}

const serialExcel = s => (Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10)) - Date.UTC(1899,11,30)) / 864e5;
const zigFornecedor = pe => `${pe.nome} - ${(pe.doc||'').replace(/\D/g,'')}`;
function zigSelecao(){

// Gera um arquivo .xlsx de verdade (sem bibliotecas externas)
function xlsx(cab, linhas, larguras){
  const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const col = i => String.fromCharCode(65+i);
  const cel = (v, ref, cabecalho) => {
    if (v===''||v==null) return '';
    if (cabecalho) return `<c r="${ref}" s="3" t="inlineStr"><is><t>${esc(v)}</t></is></c>`;
    if (typeof v==='number') return `<c r="${ref}" s="2"><v>${v}</v></c>`;
    if (v.d!==undefined) return `<c r="${ref}" s="1"><v>${v.d}</v></c>`;
    return `<c r="${ref}" s="4" t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
  };
  const rows = [cab, ...linhas].map((l,r)=>`<row r="${r+1}">${l.map((v,i)=>cel(v, col(i)+(r+1), r===0)).join('')}</row>`).join('');
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${larguras.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rows}</sheetData></worksheet>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="2" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="49" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/><xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs></styleSheet>`;
  return zipar([
    {name:'[Content_Types].xml', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:'_rels/.rels', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:'xl/workbook.xml', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'xl/worksheets/sheet1.xml', data:sheet},

// Compacta arquivos no formato ZIP (sem compressão) — um .xlsx é um ZIP de arquivos XML
const CRC_T = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
const crc32 = b => { let c=~0; for(let i=0;i<b.length;i++) c = CRC_T[(c^b[i])&255]^(c>>>8); return (~c)>>>0; };
function zipar(arquivos){
  const enc = new TextEncoder(), partes = [], central = []; let off = 0;
  for (const f of arquivos){
    const nome = enc.encode(f.name), dado = enc.encode(f.data), crc = crc32(dado);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(12,0x21,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,dado.length,true); lh.setUint32(22,dado.length,true); lh.setUint16(26,nome.length,true);
    partes.push(new Uint8Array(lh.buffer), nome, dado);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(14,0x21,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,dado.length,true); ch.setUint32(24,dado.length,true); ch.setUint16(28,nome.length,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer), nome);
    off += 30 + nome.length + dado.length;
  }
  const tam = central.reduce((a,b)=>a+b.length,0);
  const fim = new DataView(new ArrayBuffer(22));
  fim.setUint32(0,0x06054b50,true); fim.setUint16(8,arquivos.length,true); fim.setUint16(10,arquivos.length,true); fim.setUint32(12,tam,true); fim.setUint32(16,off,true);
  return new Blob([...partes, ...central, new Uint8Array(fim.buffer)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

// ================= CONCILIAÇÃO BANCÁRIA (só gestora) =================
// Importa o extrato do banco (OFX, CSV ou Excel), sugere automaticamente qual pedido corresponde a cada
// saída (mesmo valor + data próxima + nome do favorecido) e permite conciliar manualmente.
const CONC_TOL_DIAS = 10;
let IMP = null;   // planilha aguardando a escolha das colunas
const diasEntre = (a,b) => Math.abs((new Date(a+'T12:00:00') - new Date(b+'T12:00:00'))/864e5);
const pedidosConciliaveis = () => db.pedidos.filter(p => ['aprovado','pago'].includes(p.status) && !p.conc);
const txPendentes = () => db.extrato.filter(t => !t.pedidoId && !t.ignorado && t.valor < 0);
const PALAVRAS_VAZIAS = ['ltda','pix','ted','doc','pagamento','pgto','pag','transf','transferencia','enviado','enviada','para','com','dos','das','sa','me','eireli','banco'];
const tokens = s => semAcento(s).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w => w.length>=3 && !PALAVRAS_VAZIAS.includes(w));
const simNome = (desc, nome) => { const a = new Set(tokens(desc)); return tokens(nome).filter(w => a.has(w)).length; };

function sugestoes(){
  const usados = new Set(), out = [], cands = pedidosConciliaveis();
  txPendentes().sort((a,b)=>a.data.localeCompare(b.data)).forEach(t => {
    const v = Math.round(-t.valor*100);
    const ops = cands.filter(p => !usados.has(p.id) && Math.round(p.valor*100)===v && !(t.rejeitados||[]).includes(p.id))
      .map(p => { const pe = pessoa(p.pessoaId), ref = (dataPagamento(p)||'').slice(0,10) || p.vencimento;
        const d = diasEntre(t.data, ref), n = simNome(t.desc, pe.nome);
        const doc = (pe.doc||'').replace(/\D/g,''), temDoc = doc.length>=11 && t.desc.replace(/\D/g,'').includes(doc);
        return {p, d, n, temDoc, score: (temDoc?100:0) + n*10 - d}; })
      .filter(x => x.d <= CONC_TOL_DIAS || x.n || x.temDoc)
      .sort((a,b) => b.score - a.score);
    if (ops.length){ const m = ops[0]; usados.add(m.p.id);
      out.push({t, p:m.p, motivo:[ 'mesmo valor', m.d<=CONC_TOL_DIAS ? (m.d===0?'mesma data':`${Math.round(m.d)} dia(s) de diferença`) : '', m.n?'nome do favorecido':'', m.temDoc?'CPF/CNPJ':'' ].filter(Boolean).join(' · ')}); }
  });
  return out;
}
function conciliar(txId, pedidoId, modo){
  const t = db.extrato.find(x=>x.id===txId), p = db.pedidos.find(x=>x.id===pedidoId);
  if (!t || !p || p.conc || t.pedidoId) return false;
  const mudouStatus = p.status === 'aprovado';
  const dif = Math.round((-t.valor - p.valor)*100)/100;
  p.conc = {tipo:modo, txId, data:t.data, desc:t.desc, valorBanco:-t.valor, quando:agora(), quem:me.id, mudouStatus};
  if (mudouStatus){ p.status = 'pago'; p.pagoEm = t.data; p.historico.push({quando:agora(), quem:me.id, acao:`Marcou como pago (conciliação bancária — pago no banco em ${fmt(t.data)})`}); }
  p.historico.push({quando:agora(), quem:me.id, acao:`Conciliado ${modo==='auto'?'automaticamente':'manualmente'} com o extrato: ${t.desc} · ${brl(-t.valor)} · ${fmt(t.data)}${dif?` (diferença de ${brl(dif)} em relação ao pedido)`:''}`});
  t.pedidoId = p.id;
  return true;
}
function desfazerConc(pedidoId){
  const p = db.pedidos.find(x=>x.id===pedidoId); if (!p || !p.conc) return;
  const t = db.extrato.find(x=>x.pedidoId===pedidoId); if (t) t.pedidoId = null;
  if (p.conc.mudouStatus){ p.status = 'aprovado'; delete p.pagoEm; }
  p.historico.push({quando:agora(), quem:me.id, acao:'Desfez a conciliação bancária'+(p.conc.mudouStatus?' (voltou para "Aprovado · a pagar")':'')});
  delete p.conc;
}

// ---- leitura de arquivos ----
async function lerTexto(file){ const b = await file.arrayBuffer();
  try { return new TextDecoder('utf-8',{fatal:true}).decode(b); } catch(_) { return new TextDecoder('windows-1252').decode(b); } }
function parseValor(s){
  if (typeof s === 'number') return s;
  s = String(s||'').trim(); if (!s) return NaN;
  const neg = /^\(.*\)$/.test(s) || s.includes('-') || /\sD$/i.test(s) || /^D\s/i.test(s);
  s = s.replace(/[^\d.,]/g,'');
  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const v = parseFloat(s); return isNaN(v) ? NaN : (neg ? -v : v);
}
function parseData(v){
  if (typeof v === 'number' && v > 20000 && v < 80000) return new Date(Date.UTC(1899,11,30) + v*864e5).toISOString().slice(0,10);
  const s = String(v||'').trim(); let m;
  if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))){ let y = m[3]; if (y.length===2) y = '20'+y; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  return '';
}
function lerOFX(txt){
  const tag = (b,t) => { const m = b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i')); return m ? m[1].trim() : ''; };
  return txt.split(/<STMTTRN>/i).slice(1).map(b => {
    let v = parseValor(tag(b,'TRNAMT')); const tipo = tag(b,'TRNTYPE').toUpperCase();
    if (v > 0 && ['DEBIT','PAYMENT','CHECK','ATM','POS','FEE','SRVCHG','DIRECTDEBIT'].includes(tipo)) v = -v;
    const d = tag(b,'DTPOSTED');
    return {data:`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`, valor:v, desc:[tag(b,'NAME'),tag(b,'MEMO')].filter(Boolean).join(' — ') || tipo, fitid:tag(b,'FITID')};
  }).filter(t => /^\d{4}-\d{2}-\d{2}$/.test(t.data) && !isNaN(t.valor) && t.valor);
}
function lerCSV(txt){
  txt = txt.replace(/^﻿/,'');
  const prim = txt.split(/\r?\n/)[0] || '', cnt = c => prim.split(c).length;
  const sep = [';','\t',','].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows = []; let row = [], cel = '', q = false;
  for (let i=0; i<txt.length; i++){ const c = txt[i];
    if (q){ if (c==='"'){ if (txt[i+1]==='"'){ cel+='"'; i++; } else q = false; } else cel += c; }
    else if (c==='"') q = true;
    else if (c===sep){ row.push(cel); cel=''; }
    else if (c==='\n' || c==='\r'){ if (c==='\r' && txt[i+1]==='\n') i++; row.push(cel); rows.push(row); row=[]; cel=''; }
    else cel += c; }
  if (cel || row.length){ row.push(cel); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim()));
}
async function lerXLSX(buf){
  if (typeof DecompressionStream === 'undefined') throw new Error('este navegador não abre Excel aqui — salve a planilha como CSV e importe de novo');
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1; for (let i=u8.length-22; i>=Math.max(0,u8.length-66000); i--){ if (dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if (eocd < 0) throw new Error('arquivo Excel inválido');
  const n = dv.getUint16(eocd+10,true); let off = dv.getUint32(eocd+16,true); const arqs = {};
  for (let k=0; k<n; k++){
    const met=dv.getUint16(off+10,true), cs=dv.getUint32(off+20,true), nl=dv.getUint16(off+28,true), el=dv.getUint16(off+30,true), cl=dv.getUint16(off+32,true), lo=dv.getUint32(off+42,true);
    arqs[new TextDecoder().decode(u8.subarray(off+46, off+46+nl))] = {met, cs, lo}; off += 46+nl+el+cl; }
  const ler = async nome => { const a = arqs[nome]; if (!a) return null;
    const nl = dv.getUint16(a.lo+26,true), el = dv.getUint16(a.lo+28,true), ini = a.lo+30+nl+el, dados = u8.subarray(ini, ini+a.cs);
    if (a.met === 0) return new TextDecoder().decode(dados);
    return await new Response(new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text(); };
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const ss = []; const sst = await ler('xl/sharedStrings.xml');
  if (sst) [...xml(sst).getElementsByTagName('si')].forEach(si => ss.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join('')));
  let caminho = 'xl/worksheets/sheet1.xml';
  try { const wb = xml(await ler('xl/workbook.xml')), rid = wb.getElementsByTagName('sheet')[0].getAttribute('r:id');
    const rel = [...xml(await ler('xl/_rels/workbook.xml.rels')).getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===rid);
    if (rel){ const t = rel.getAttribute('Target').replace(/^\//,''); caminho = t.startsWith('xl/') ? t : 'xl/'+t; } } catch(_) {}
  const linhas = [];
  [...xml(await ler(caminho)).getElementsByTagName('row')].forEach(r => { const lin = [];
    [...r.getElementsByTagName('c')].forEach(c => {
      const col = (c.getAttribute('r')||'').replace(/\d+/g,'').split('').reduce((a,ch)=>a*26+ch.charCodeAt(0)-64, 0) - 1;
      const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0]?.textContent ?? '';
      const val = t==='s' ? (ss[+v] ?? '') : t==='inlineStr' ? [...c.getElementsByTagName('t')].map(x=>x.textContent).join('') : (t==='str'||t==='b'||t==='e') ? v : (v==='' ? '' : Number(v));
      lin[col >= 0 ? col : lin.length] = val; });
    linhas.push(Array.from(lin, x => x ?? '')); });
  return linhas.filter(r => r.some(c => String(c).trim()));
}
async function importarArquivo(file){
  const nome = file.name.toLowerCase();
  try {
    if (nome.endsWith('.ofx')) return adicionarTx(lerOFX(await lerTexto(file)), file.name);
    let linhas;
    if (nome.endsWith('.csv') || nome.endsWith('.txt')) linhas = lerCSV(await lerTexto(file));
    else if (nome.endsWith('.xlsx')) linhas = await lerXLSX(await file.arrayBuffer());
    else return toast('Formato não suportado. Use OFX, CSV ou Excel (.xlsx).');
    if (!linhas.length) return toast('A planilha está vazia.');
    mapearColunas(linhas, file.name);
  } catch(e){ console.error(e); toast('Não consegui ler o arquivo: ' + e.message); }
}
function mapearColunas(linhas, nomeArq){
  let hdr = linhas.slice(0,15).findIndex(r => r.some(c=>/data|date/i.test(c)) && r.some(c=>/valor|amount|d[eé]bito|cr[eé]dito|sa[ií]da/i.test(c)));
  const larg = Math.max(...linhas.map(r=>r.length));
  const cab = Array.from({length:larg}, (_,i) => hdr>=0 && String(linhas[hdr][i]||'').trim() ? String(linhas[hdr][i]).trim() : 'Coluna '+String.fromCharCode(65+i));
  const acha = (re, fora=[]) => cab.findIndex((c,i) => !fora.includes(i) && re.test(semAcento(c)));
  const cData = acha(/data|date|dt/), cValor = acha(/valor|amount|montante|quantia/, [cData]);
  const cDeb = acha(/debito|saida/, [cData]), cCred = acha(/credito|entrada/, [cData]);
  let cDesc = acha(/descri|historico|memo/, [cData]); if (cDesc < 0) cDesc = acha(/lancamento|detalhe|favorecido|nome/, [cData]);
  IMP = {linhas, hdr, nomeArq};
  const sel = (nome, atual, opcional) => `<select name="${nome}">${opcional?'<option value="-1">— nenhuma —</option>':''}${cab.map((c,i)=>`<option value="${i}" ${i===atual?'selected':''}>${h(c)}</option>`).join('')}</select>`;
  const ex = linhas.slice(hdr+1, hdr+6);
  modal(`<h3>📄 ${h(nomeArq)} — quais colunas usar?</h3>
  <p class="meta" style="margin:-8px 0 10px">Já deixei marcado o que encontrei. Confira olhando o exemplo abaixo.</p>
  <form class="form" id="fMapa">
    <label>Data *${sel('data', cData)}</label>
    <label>Descrição / histórico${sel('desc', cDesc, true)}</label>
    <label>Valor (ou Débito/Saída) *${sel('valor', cValor>=0?cValor:cDeb)}</label>
    <label>Crédito/Entrada (se for coluna separada)${sel('cred', cValor>=0?-1:cCred, true)}</label>
    <label class="full" style="flex-direction:row;align-items:center;gap:8px;color:var(--text)"><input type="checkbox" name="inverter"> As saídas aparecem com valor positivo nesta planilha (inverter o sinal)</label>
  </form>
  <div style="overflow-x:auto;margin-top:10px"><table><thead><tr>${cab.map(c=>`<th>${h(c)}</th>`).join('')}</tr></thead><tbody>
    ${ex.map(r=>`<tr>${cab.map((_,i)=>`<td>${h(r[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="actions"><button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="confirmarMapa">Importar lançamentos</button></div>`, 760);
}
function confirmarMapa(){
  const d = lerForm('fMapa'); if (!d || !IMP) return;
  const ci = k => +d[k], txs = [];
  IMP.linhas.slice(IMP.hdr+1).forEach(r => {
    const data = parseData(r[ci('data')]); if (!data) return;
    let valor;
    if (ci('cred') >= 0){ const deb = parseValor(r[ci('valor')]), cred = parseValor(r[ci('cred')]);
      valor = (isNaN(cred)?0:Math.abs(cred)) - (isNaN(deb)?0:Math.abs(deb)); }
    else valor = parseValor(r[ci('valor')]);
    if (d.inverter) valor = -valor;
    if (isNaN(valor) || !valor) return;
    txs.push({data, valor:Math.round(valor*100)/100, desc: ci('desc')>=0 ? String(r[ci('desc')]??'').trim() : ''});
  });
  fechar(); adicionarTx(txs, IMP.nomeArq); IMP = null;
}
function adicionarTx(txs, origem){
  const chave = t => t.fitid ? 'f:'+t.fitid : `${t.data}|${t.valor}|${semAcento(t.desc)}`;
  const existentes = new Set(db.extrato.map(chave));
  let novos = 0, rep = 0;
  txs.forEach(t => { if (existentes.has(chave(t))){ rep++; return; } existentes.add(chave(t));
    db.extrato.push({id:uid('t'), ...t, origem, importadoEm:agora(), importadoPor:me.id}); novos++; });
  save(); view = 'conciliacao'; render();
  toast(`${novos} lançamento(s) importado(s) de ${origem}${rep?` · ${rep} repetido(s) ignorado(s)`:''}`);
}

function extratoExemplo(retornar){
  // Monta um extrato fictício a partir dos pedidos da demonstração (pagos + alguns aprovados), com tarifas e entradas
  const linhas = [];
  const ano = HOJE.slice(0,4);
  db.pedidos.filter(p => p.status==='pago' && !p.conc && (dataPagamento(p)||'').startsWith(ano)).forEach((p,i) => {
    const pe = pessoa(p.pessoaId), d = (dataPagamento(p)||p.vencimento).slice(0,10);
    const desc = i%3===0 ? `PIX ENVIADO ${pe.nome.toUpperCase()}` : i%3===1 ? `TED ${pe.nome.toUpperCase()} ${(pe.doc||'').replace(/\D/g,'')}` : `PAGAMENTO ${pe.funcao.toUpperCase()}`;
    linhas.push({data:addDias(d, i%4===0?1:0), valor:-p.valor, desc});
  });
  db.pedidos.filter(p => p.status==='aprovado' && !p.conc).slice(0,3).forEach((p,i) => {
    const pe = pessoa(p.pessoaId);
    linhas.push({data:addDias(p.vencimento,-1), valor:-(i===2 ? p.valor-50 : p.valor), desc:`PIX ENVIADO ${pe.nome.toUpperCase()}`});
  });
  linhas.push({data:`${ano}-10-05`, valor:-39.90, desc:'TARIFA PACOTE DE SERVICOS'});
  linhas.push({data:`${ano}-10-28`, valor:-350, desc:'PIX ENVIADO JOAO DA SILVA'});
  linhas.push({data:`${ano}-11-03`, valor:25000, desc:'TED RECEBIDA REPASSE BILHETERIA'});
  linhas.sort((a,b)=>a.data.localeCompare(b.data));
  const dt = s => s.replace(/-/g,'') + '120000[-3:BRT]';
  const ofx = `OFXHEADER:100\nDATA:OFXSGML\nVERSION:102\nSECURITY:NONE\nENCODING:USASCII\nCHARSET:1252\nCOMPRESSION:NONE\nOLDFILEUID:NONE\nNEWFILEUID:NONE\n\n<OFX>\n<SIGNONMSGSRSV1><SONRS><STATUS><CODE>0<SEVERITY>INFO</STATUS><DTSERVER>${dt(HOJE)}<LANGUAGE>POR</SONRS></SIGNONMSGSRSV1>\n<BANKMSGSRSV1><STMTTRNRS><TRNUID>1<STATUS><CODE>0<SEVERITY>INFO</STATUS>\n<STMTRS><CURDEF>BRL<BANKACCTFROM><BANKID>0341<ACCTID>12345-6<ACCTTYPE>CHECKING</BANKACCTFROM>\n<BANKTRANLIST><DTSTART>${dt(linhas[0].data)}<DTEND>${dt(linhas.at(-1).data)}\n`
    + linhas.map((t,i)=>`<STMTTRN>\n<TRNTYPE>${t.valor<0?'DEBIT':'CREDIT'}\n<DTPOSTED>${dt(t.data)}\n<TRNAMT>${t.valor.toFixed(2)}\n<FITID>DEMO${String(i+1).padStart(5,'0')}\n<MEMO>${t.desc}\n</STMTTRN>\n`).join('')
    + `</BANKTRANLIST>\n<LEDGERBAL><BALAMT>0.00<DTASOF>${dt(HOJE)}</LEDGERBAL>\n</STMTRS></STMTTRNRS></BANKMSGSRSV1>\n</OFX>\n`;
  const csv = 'Data;Histórico;Valor\n' + linhas.map(t=>`${fmt(t.data)};${t.desc};${t.valor.toFixed(2).replace('.',',')}`).join('\n');
  if (retornar) return {ofx, csv};
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ofx],{type:'application/x-ofx'})); a.download = 'extrato_exemplo.ofx'; a.click();
  toast('Extrato de exemplo baixado — agora clique em "Importar extrato" e escolha o arquivo');
}

function pedirMotivo(id, tipo){
  modal(`<h3>${tipo==='recusado'?'Recusar':'Cancelar'} pedido ${id}</h3>
  <form class="form" id="fMotivo"><label class="full">Motivo *<textarea name="motivo" rows="3" required></textarea></label></form>
  <div class="actions"><button class="btn" data-act="fechar">Voltar</button><button class="btn bad" data-act="confirmarMotivo" data-id="${id}" data-arg="${tipo}">Confirmar</button></div>`);
}

function formEvento(id){
  if(!isAdmin()) return;
  const e = id ? evento(id) : {nome:'',data:'',local:'',orcamento:''};
  modal(`<h3>${id?'Editar evento':'Novo evento'}</h3>
  <form class="form" id="fEvento">
    <label class="full">Nome do evento *<input name="nome" required value="${h(e.nome)}"></label>
    <label>Data *<input name="data" type="date" required value="${e.data}"></label>
    <label>Local<input name="local" value="${h(e.local)}"></label>
    <label>Orçamento previsto (R$)<input name="orcamento" type="number" step="0.01" value="${e.orcamento}"></label>
  </form>
  <div class="actions"><button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="salvarEvento" data-id="${id||''}">Salvar</button></div>`);
}
function formPessoa(id){
  const p = id ? pessoa(id) : {nome:'',doc:'',funcao:'',pix:'',tel:'',banco:'',agencia:'',conta:'',tipoConta:'Corrente',pixTipo:''};
  const sel = (nome, ops, v) => `<select name="${nome}"><option value="">—</option>${ops.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
  modal(`<h3>${id?'Editar cadastro — '+h(p.nome):'Novo cadastro'}</h3>
  ${id?`<div class="note" style="margin:-4px 0 12px;background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a">A alteração vale na hora e fica registrada no histórico com data, hora e o seu nome. <a href="#" data-act="verHist" data-id="${id}">Ver histórico</a></div>`:''}
  <form class="form" id="fPessoa">
    <label class="full">Nome / Razão social *<input name="nome" required value="${h(p.nome)}"></label>
    <label>CPF ou CNPJ *<input name="doc" required value="${h(p.doc)}"></label>
    <label>Função *<input name="funcao" required placeholder="DJ, segurança, bar…" value="${h(p.funcao)}"></label>
    <label>Telefone<input name="tel" value="${h(p.tel)}"></label>
    <label>E-mail<input name="email" type="email" value="${h(p.email||'')}"></label>
    <div class="full" style="font-weight:600;margin-top:6px;border-top:1px solid var(--line);padding-top:10px">🏦 Dados bancários</div>
    <label>Banco<input name="banco" value="${h(p.banco||'')}" placeholder="Ex.: Itaú, Nubank…"></label>
    <label>Tipo de conta${sel('tipoConta',['Corrente','Poupança','Corrente PJ','Pagamento'],p.tipoConta||'')}</label>
    <label>Agência<input name="agencia" value="${h(p.agencia||'')}"></label>
    <label>Conta (com dígito)<input name="conta" value="${h(p.conta||'')}"></label>
    <label>Tipo da chave PIX${sel('pixTipo',['CPF','CNPJ','E-mail','Telefone','Aleatória'],p.pixTipo||'')}</label>
    <label>Chave PIX<input name="pix" value="${h(p.pix)}"></label>
  </form>
  <div class="actions"><button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="salvarPessoa" data-id="${id||''}">Salvar</button></div>`);
}
function formUser(id, perfilNovo){
  if(!isAdmin()) return;
  const u = id ? user(id) : {nome:'',email:'',tel:'',perfil:perfilNovo||'produtor',ativo:true};
  const euMesmo = id===me.id;
  const titulo = id ? 'Editar '+PERFIS[u.perfil].toLowerCase() : 'Novo '+PERFIS[u.perfil].toLowerCase();
  modal(`<h3>${titulo}</h3>
  <form class="form" id="fUser">
    <label class="full">Nome *<input name="nome" required value="${h(u.nome)}"></label>
    <label>E-mail *<input name="email" type="email" required value="${h(u.email)}"></label>
    <label>Telefone / WhatsApp<input name="tel" value="${h(u.tel||'')}"></label>
    <label>Perfil<select name="perfil" ${euMesmo?'disabled':''}>${Object.entries(PERFIS).map(([k,n])=>`<option value="${k}" ${u.perfil===k?'selected':''}>${n}</option>`).join('')}</select></label>
    ${id?`<label>Situação<select name="ativo" ${euMesmo?'disabled':''}><option value="1" ${u.ativo!==false?'selected':''}>Ativo</option><option value="0" ${u.ativo===false?'selected':''}>Inativo (não consegue entrar)</option></select></label>`:''}
  </form>
  ${euMesmo?'<div class="note">Você não pode mudar o próprio perfil nem se desativar, para não perder o acesso de administrador.</div>':''}
  <div class="actions"><button class="btn" data-act="fechar">Cancelar</button><button class="btn pri" data-act="salvarUser" data-id="${id||''}">${id?'Salvar alterações':'Cadastrar e enviar convite'}</button></div>`);
}
function lerDadosPessoa(){
  const d=lerForm('fPessoa'); if(!d) return null; const t=k=>(d[k]||'').trim();
  return {nome:t('nome'),doc:t('doc'),funcao:t('funcao'),tel:t('tel'),email:t('email'),banco:t('banco'),agencia:t('agencia'),conta:t('conta'),tipoConta:t('tipoConta'),pixTipo:t('pixTipo')||tipoPix(t('pix')),pix:t('pix')};
}
function lerForm(fid){ const f=document.getElementById(fid); if(!f.reportValidity()) return null; return Object.fromEntries(new FormData(f)); }

function exportarCSV(){
  const lista = filtrar(visiveis());
  const linhas = [['Nº','Vencimento','Evento','Favorecido','CPF/CNPJ','Categoria','Forma','Valor','Status','Produtor','Descrição']];
  lista.forEach(p=>linhas.push([p.id,fmt(p.vencimento),evento(p.eventoId).nome,pessoa(p.pessoaId).nome,pessoa(p.pessoaId).doc,p.categoria,p.forma,p.valor.toFixed(2).replace('.',','),STATUS[p.status].nome,user(p.criadoPor).nome,p.descricao]));
  const csv = '﻿'+linhas.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = 'pedidos.csv'; a.click();
}

// ================= AÇÕES =================
const acoes = {
  atualizarApp: () => { save(); location.reload(); },
  adiarVersao: () => { document.getElementById('avisoVersao')?.remove(); avisoAdiadoAte = Date.now() + 10*60000; },   // volta a avisar em 10 minutos
  entrar: id => { me = user(id); view='kanban';
    if (linkAprovar && !isProd()){ view='aprovacoes'; F.produtor=[]; }
    if (linkAprovar){ linkAprovar=null; try{ history.replaceState(null,'',location.pathname); }catch(e){} }
    render(); },
  compartilhar: () => compartilhar(false),
  exportZig: () => exportZig(),
  gerarZig: () => gerarZig(),
  pagosEvento: id => pagosEvento(id),
  // Cartões do Dashboard: abre a Lista com o mesmo período/evento/categoria e o status do cartão
  kpi: id => { F.status = id.split(','); delete CFS.lista; view = 'lista'; render(); window.scrollTo(0,0);
    toast('Mostrando: ' + F.status.map(s=>STATUS[s].nome).join(' + ')); },
  csvPagos: id => { const lista = visiveis().filter(p=>p.eventoId===id && p.status==='pago');
    const linhas=[['Evento','Favorecido','CPF/CNPJ','Função','Categoria','Banco','Agência','Conta','Tipo de conta','Tipo PIX','Chave PIX','Forma','Pago em','Valor','Nº']];
    lista.forEach(p=>{ const pe=pessoa(p.pessoaId), a=true;
      linhas.push([evento(id).nome,pe.nome,a?pe.doc:'',pe.funcao,p.categoria,a?pe.banco||'':'',a?pe.agencia||'':'',a?pe.conta||'':'',a?pe.tipoConta||'':'',a?pe.pixTipo||'':'',a?pe.pix||'':'',p.forma,fmt(dataPagamento(p)).slice(0,10),p.valor.toFixed(2).replace('.',','),p.id]); });
    const csv='﻿'+linhas.map(l=>l.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='pagos - '+evento(id).nome+'.csv'; a.click(); },
  copiarLink: () => { const l=linkAprovacao(); const c=document.getElementById('campoLink');
    (navigator.clipboard?.writeText(l) || Promise.reject()).then(()=>toast('Link copiado! Agora é só colar no WhatsApp.'),
      ()=>{ if(c){ c.focus(); c.select(); } toast('Selecione o link e copie com Ctrl+C (ou segure no celular).'); }); },
  aprovarTodos: () => aprovarTodos(),
  confirmarTodos: () => { if(isProd()) return; let n=0;
    db.pedidos.filter(p=>p.status==='aguardando' && passa(F.produtor,p.criadoPor)).forEach(p=>{ p.status='aprovado'; p.historico.push({quando:agora(),quem:me.id,acao:'Aprovou o pedido'}); n++; });
    save(); fechar(); render(); toast(n+' pedido(s) aprovado(s)'); },
  sair: () => { me=null; render(); },
  reset: () => { try{localStorage.removeItem(KEY)}catch(e){} db=seed(); if(me) me=user(me.id); fechar(); render(); toast('Dados de exemplo restaurados'); },
  aba: id => { view=id; render(); },
  limpar: () => { for (const k in CFS) delete CFS[k]; F={ano:F.ano,mes:[],evento:[],categoria:[],status:[],produtor:[]}; render(); },
  mes: id => { F.mes = F.mes.includes(id) ? F.mes.filter(m=>m!==id) : [...F.mes, id]; render(); },
  ver: id => verPedido(id),
  form: id => formPedido(id),
  fechar: () => fechar(),
  salvarPedido: id => salvarPedido(id),
  aprovar: id => { const p=db.pedidos.find(x=>x.id===id); if(podeAprovar(p)) mudar(id,'aprovado','Aprovou o pedido'); },
  pagar: id => { const p=db.pedidos.find(x=>x.id===id); if(podePagar(p)) mudar(id,'pago','Marcou como pago'); },
  motivo: (id,arg) => pedirMotivo(id,arg),
  confirmarMotivo: (id,arg) => { const d=lerForm('fMotivo'); if(!d) return; const p=db.pedidos.find(x=>x.id===id);
    if (arg==='recusado' && podeAprovar(p)) mudar(id,'recusado','Recusou o pedido — Motivo: '+d.motivo.trim());
    if (arg==='cancelado' && podeCancelar(p)) mudar(id,'cancelado','Cancelou o pedido — Motivo: '+d.motivo.trim()); },
  mudarStatus: id => { if(!isAdmin()) return; const s=document.getElementById('novoStatus').value; mudar(id,s,'Admin alterou o status para "'+STATUS[s].nome+'"'); },
  csv: () => exportarCSV(),
  formEvento: id => formEvento(id),
  salvarEvento: id => { const d=lerForm('fEvento'); if(!d) return; const dados={nome:d.nome.trim(),data:d.data,local:d.local.trim(),orcamento:Number(d.orcamento)||0};
    if(id) Object.assign(evento(id),dados); else db.eventos.push({id:uid('e'),...dados}); save(); fechar(); render(); toast('Evento salvo'); },
  formPessoa: id => formPessoa(id),
  salvarPessoa: id => {
    const dados=lerDadosPessoa(); if(!dados) return;
    if (id){
      const pe = pessoa(id), campos = mudancas(pe, dados);
      if (!campos.length){ fechar(); return toast('Nenhum dado foi alterado.'); }
      registrarHist(id, 'alteracao', campos, Object.fromEntries(campos.map(k=>[k,pe[k]||''])), Object.fromEntries(campos.map(k=>[k,dados[k]||''])));
      Object.assign(pe, dados);
      toast('Cadastro atualizado e registrado no histórico');
    } else {
      const novo = {id:uid('p'),...dados}; db.pessoas.push(novo);
      registrarHist(novo.id, 'criacao');
      toast('Cadastro criado');
    }
    save(); fechar(); render(); },
  cadastrar: () => escolherCadastro(),
  escolherAtualizar: () => escolherAtualizar(),
  irAtualizar: () => { const d=lerForm('fEscolha'); if(d) formPessoa(d.pid); },
  verHist: id => verHistorico(id),
  linkAuto: () => modalLinkAuto(),
  copiarLinkAuto: () => { const c=document.getElementById('campoLink'); const l=c.value;
    (navigator.clipboard?.writeText(l) || Promise.reject()).then(()=>toast('Link copiado! Agora é só colar no WhatsApp ou e-mail.'), ()=>{ c.focus(); c.select(); toast('Selecione o link e copie com Ctrl+C.'); }); },
  enviarAuto: () => enviarAutocadastro(),
  autoNovo: () => { autoOk = null; render(); },
  sairAuto: () => { const voltar = !!me; cadastroPor = null; autoOk = null; try{ history.replaceState(null,'',location.pathname); }catch(e){}
    if (voltar) view = 'pessoas'; render(); window.scrollTo(0,0); },
  // abre o formulário público na MESMA aba (assim o teste usa os mesmos dados da demonstração)
  abrirFormAuto: () => { cadastroPor = me.id; autoOk = null; fechar(); try{ history.replaceState(null,'',location.pathname+'?cadastro='+me.id); }catch(e){} render(); window.scrollTo(0,0); },
  // ---- conciliação bancária ----
  concConfirmar: (txId,pid) => { if(!isAdmin()) return; if (conciliar(txId,pid,'auto')){ save(); render(); toast(pid+' conciliado'); } },
  concTodas: () => { if(!isAdmin()) return; let n=0; sugestoes().forEach(s=>{ if (conciliar(s.t.id,s.p.id,'auto')) n++; }); save(); render(); toast(n+' pedido(s) conciliado(s)'); },
  concRejeitar: (txId,pid) => { const t=db.extrato.find(x=>x.id===txId); if(!t) return; (t.rejeitados = t.rejeitados||[]).push(pid); save(); render(); },
  concIgnorar: id => { const t=db.extrato.find(x=>x.id===id); if(t){ t.ignorado=true; save(); render(); } },
  concDesignorar: id => { const t=db.extrato.find(x=>x.id===id); if(t){ t.ignorado=false; save(); render(); } },
  concDesfazer: id => { if(!isAdmin()) return; desfazerConc(id); save(); render(); toast('Conciliação de '+id+' desfeita'); },
  concManualTx: id => concManualTx(id),
  concManualPed: id => concManualPed(id),
  concConfirmarManual: txId => { const d=lerForm('fConc'); if(!d) return; if (conciliar(txId,d.pid,'manual')){ save(); fechar(); render(); toast(d.pid+' conciliado manualmente'); } },
  concPedTx: pid => { const d=lerForm('fConcTx'); if(!d || !d.tid) return toast('Escolha o lançamento do extrato.'); if (conciliar(d.tid,pid,'manual')){ save(); fechar(); render(); toast(pid+' conciliado manualmente'); } },
  concSemExtrato: pid => { if(!isAdmin()) return; const d=lerForm('fConcSem'); if(!d) return; const p=db.pedidos.find(x=>x.id===pid); if(!p || p.conc) return;
    const mudouStatus = p.status==='aprovado', obs = (d.obs||'').trim();
    p.conc = {tipo:'sem-extrato', data:d.data, obs, quando:agora(), quem:me.id, mudouStatus};
    if (mudouStatus){ p.status='pago'; p.pagoEm=d.data; p.historico.push({quando:agora(),quem:me.id,acao:`Marcou como pago (conciliação manual — pago em ${fmt(d.data)})`}); }
    p.historico.push({quando:agora(),quem:me.id,acao:`Conciliado manualmente, sem extrato · pago em ${fmt(d.data)}${obs?' · '+obs:''}`});
    save(); fechar(); render(); toast(pid+' conciliado'); },
  confirmarMapa: () => confirmarMapa(),
  extratoExemplo: () => extratoExemplo(),
  // X do quadro "Últimas alterações": só tira do quadro; o registro continua no histórico completo
  dispensarHist: id => { if(!isAdmin()) return; const a=db.alteracoes.find(x=>x.id===id); if(a){ a.dispensado=true; save(); render(); } },
  dispensarTodos: () => { if(!isAdmin()) return; db.alteracoes.forEach(a=>a.dispensado=true); save(); render(); toast('Quadro limpo — tudo continua no histórico completo'); },
  formUser: (id,arg) => formUser(id,arg),
  desativarUser: id => { if(!isAdmin() || id===me.id) return; const u=user(id);

  confirmarDesativarUser: id => { if(!isAdmin() || id===me.id) return; user(id).ativo=false; save(); fechar(); render(); toast(user(id).nome+' foi desativado(a)'); },
  ativarUser: id => { if(!isAdmin()) return; user(id).ativo=true; save(); render(); toast(user(id).nome+' foi reativado(a)'); },
  desativarPessoa: id => { if(!isAdmin()) return; const p=pessoa(id);
    modal(`<h3>Desativar ${h(p.nome)}?</h3>
    <p style="color:var(--muted)">O cadastro <b>deixa de aparecer na hora de criar novos pedidos</b>. Os pedidos e pagamentos antigos continuam guardados normalmente. Você pode reativar quando quiser.</p>
    <div class="actions"><button class="btn" data-act="fechar">Cancelar</button><button class="btn bad" data-act="confirmarDesativarPessoa" data-id="${id}">Desativar</button></div>`); },
  confirmarDesativarPessoa: id => { if(!isAdmin()) return; pessoa(id).ativo=false; registrarHist(id,'desativacao'); save(); fechar(); render(); toast(pessoa(id).nome+' foi desativado(a)'); },
  ativarPessoa: id => { if(!isAdmin()) return; pessoa(id).ativo=true; registrarHist(id,'reativacao'); save(); render(); toast(pessoa(id).nome+' foi reativado(a)'); },
  salvarUser: id => { if(!isAdmin()) return; const d=lerForm('fUser'); if(!d) return;

    if (id){ const u=user(id); Object.assign(u,dados); if(id!==me.id){ u.perfil=d.perfil; u.ativo=d.ativo!=='0'; } toast('Cadastro atualizado'); }

    if (me) me=user(me.id); save(); fechar(); render(); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t) return;
  if (t.tagName==='A') e.preventDefault();
  e.stopPropagation();
  acoes[t.dataset.act]?.(t.dataset.id, t.dataset.arg);
});
document.addEventListener('change', e => { if (e.target.id==='arqExtrato'){ [...e.target.files].forEach(importarArquivo); e.target.value=''; return; } const k=e.target.dataset?.f; if(k){ F[k]=[...e.target.selectedOptions].map(o=>o.value).filter(Boolean); render(); } });
// Tela de exportação Zig: filtros e plano de contas por categoria
document.addEventListener('change', e => {
  const ds = e.target.dataset || {};
  if (ds.z){ Z[ds.z] = e.target.type==='checkbox' ? e.target.checked : e.target.value; exportZig(); }
  if (ds.zigcat!==undefined){ db.zigMap[ds.zigcat] = e.target.value; save(); exportZig(); }
});

// ================= VERSÃO DO APP E AVISO DE ATUALIZAÇÃO =================
// A cada atualização do app, mudar APP_VERSAO aqui e no arquivo version.json.
// Quem estiver com o app aberto vê a faixa "Nova versão disponível" (sem detalhar o que mudou).
const APP_VERSAO = '1.4';
let versaoNova = null, avisoAdiadoAte = 0;
async function checarVersao(){
  if (location.protocol === 'file:') return;            // abrindo o arquivo direto não há servidor para consultar
  try {
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'}); if (!r.ok) return;
    const v = await r.json();
    if (v.versao && v.versao !== APP_VERSAO){ versaoNova = v; mostrarAvisoVersao(); }
  } catch(_) {}
}
function mostrarAvisoVersao(){
  if (!versaoNova || document.getElementById('avisoVersao') || Date.now() < avisoAdiadoAte) return;
  const d = document.createElement('div'); d.id = 'avisoVersao'; d.className = 'aviso-versao';
  d.innerHTML = `<div><b>🚀 Nova versão do app disponível</b> <span style="opacity:.9">— clique para atualizar.</span></div>
    <button class="btn sm" data-act="atualizarApp">Atualizar agora</button>
    <button class="aviso-x" data-act="adiarVersao" title="Lembrar mais tarde">×</button>`;
  document.body.appendChild(d);
}
setInterval(checarVersao, 60000);                          // confere a cada 1 minuto
window.addEventListener('focus', checarVersao);            // e sempre que a pessoa volta para a aba
document.addEventListener('visibilitychange', () => { if (!document.hidden) checarVersao(); });

// Sincronização entre abas/janelas: quando os dados mudam em outra aba, esta se atualiza sozinha.
// (Na versão real, com banco de dados, isso vale entre computadores e celulares diferentes.)
window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  try { db = JSON.parse(e.newValue); } catch(_) { return; }
  if (!db.zigMap) db.zigMap = {...ZIG_PADRAO}; if (!db.alteracoes) db.alteracoes = []; if (!db.extrato) db.extrato = [];
  if (me) me = db.users.find(u=>u.id===me.id) || null;
  render();
  if (me) toast('🔄 Atualizado com alterações feitas em outra aba');
});

load(); render(); checarVersao();
</script>
