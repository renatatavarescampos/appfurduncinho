<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Formulário</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#002620;--creme:#f4efeb;--ouro:#efbb3c;--cobre:#c37f36;--terra:#702b16;--linha:#c37f3640;--muted:#002620b3;--erro:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--creme);color:var(--verde);font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
header{background:var(--verde);color:var(--creme);padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--ouro)}
header img{height:44px}
header{flex-wrap:wrap}
header .cli{margin-left:auto;text-align:right;border-left:1px solid #f4efeb33;padding-left:14px}
header .cn{font-weight:600;font-size:14px;letter-spacing:.02em}
@media (max-width:560px){ header .cli{margin-left:0;text-align:left;border-left:0;padding-left:0;border-top:1px solid #f4efeb33;padding-top:8px;width:100%} }
header .t{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:600;line-height:1.1}
header .s{font-size:12px;opacity:.8}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
.cx{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:22px 20px;box-shadow:0 10px 30px #0026200f}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:28px;margin:0 0 4px}
.intro{color:var(--muted);margin:0 0 18px;font-size:13px}
.grupo{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--cobre);margin:20px 0 8px;padding-top:14px;border-top:1px dashed var(--linha)}
.grupo:first-of-type{border-top:0;padding-top:0;margin-top:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
label b{color:var(--terra);font-weight:600}
input,select,textarea{font:inherit;font-size:14px;color:var(--verde);background:#fff;border:1px solid var(--linha);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #efbb3c88;border-color:var(--ouro)}
textarea{min-height:76px;resize:vertical}
.chk{flex-direction:row;align-items:flex-start;gap:8px;color:var(--verde)}
.chk input{width:auto;margin-top:3px;accent-color:var(--verde)}
.novo{background:#efbb3c14;border:1px solid #efbb3c66;border-radius:12px;padding:14px}
.ajuda{font-size:12px;color:var(--muted);margin:-4px 0 0}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 16px;cursor:pointer;background:var(--verde);color:var(--creme);width:100%;font-size:15px;margin-top:18px}
.btn:disabled{opacity:.6;cursor:wait}
.btn.sec{background:#fff;color:var(--verde);border:1px solid var(--linha);font-weight:500}
.msg{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px;background:#ef44441a;color:#b91c1c;border:1px solid #ef444455}
.ok{text-align:center}
.ok .ic{font-size:46px}
.passos{display:flex;gap:6px;margin:0 0 16px}
.passos span{flex:1;height:4px;border-radius:4px;background:#c37f3633}
.passos span.on{background:var(--ouro)}
.arq{border:1.5px dashed var(--cobre);border-radius:12px;padding:14px;text-align:center;background:#f4efeb80;cursor:pointer;color:var(--verde)}
.arq small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.arqs{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.arqs li{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--linha);border-radius:8px;padding:6px 10px;font-size:13px}
.arqs li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arqs button{border:0;background:none;color:var(--erro);cursor:pointer;font-size:16px}
dl.res{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0;font-size:13px}
dl.res dt{color:var(--muted)} dl.res dd{margin:0;font-weight:500;word-break:break-word}
.opc{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opc label{flex-direction:row;align-items:flex-start;gap:10px;border:1px solid var(--linha);border-radius:12px;padding:12px;color:var(--verde);cursor:pointer;font-size:14px}
.opc label:has(input:checked){border-color:var(--verde);background:#efbb3c1f}
.opc input{width:auto;margin-top:4px;accent-color:var(--verde)}
.opc small{display:block;color:var(--muted);font-size:12px}
.lado{display:flex;gap:10px;margin-top:18px}.lado .btn{margin-top:0}
@media (max-width:560px){ dl.res{grid-template-columns:1fr;gap:0 0} dl.res dd{margin-bottom:8px} }
.escolha{display:flex;flex-direction:column;gap:12px}
.escolha button{font:inherit;display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1.5px solid var(--linha);border-radius:14px;padding:16px;cursor:pointer;color:var(--verde)}
.escolha button:hover{border-color:var(--ouro);background:#efbb3c14}
.escolha .ic{font-size:30px}
.escolha b{font-size:16px;font-weight:600}
.escolha small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.voltar{display:inline-block;font-size:13px;color:var(--cobre);text-decoration:none;margin-bottom:10px}
.ajuda a{color:var(--cobre);font-weight:600;white-space:nowrap}
.tab{overflow-x:auto;margin-top:16px;border:1px solid var(--linha);border-radius:10px}
.tab table{border-collapse:collapse;width:100%;font-size:13px}
.tab th{background:#f4efeb;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:8px 10px}
.tab td{padding:8px 10px;border-top:1px solid #c37f3626;vertical-align:top}
.tab .r{text-align:right;white-space:nowrap}
.tab tfoot td{font-weight:600;background:#f4efeb}
.tab tr.ruim td{background:#ef44440f}
.tcad{font-size:14px;margin-bottom:10px}
.lkcad{color:var(--cobre);font-weight:600;font-size:12.5px;text-decoration:underline;display:inline-block;margin-top:2px}
.lkcad.feito{color:#15803d;text-decoration:none}
.lkcad.falta{color:#b91c1c}
.lked{color:var(--cobre);font-weight:600;font-size:12.5px;text-decoration:underline;display:inline-block;margin-top:4px}
#passo2.soCad > :not(.cadWrap){display:none !important}
#passo2 .cadn{background:none;border:0;padding:0}
.cadn.comErro{border-color:var(--erro);background:#ef44440a}
.erroCad{display:none;color:#b91c1c;font-size:12.5px}
.tab .pixc{font-size:12.5px;overflow-wrap:anywhere;min-width:96px}
.tab .pixc .nw{white-space:nowrap}
.tab .sub{font-size:12px;color:var(--muted);margin-top:2px}
.tab .pb{color:#b91c1c;font-size:12px}.tab .av{color:var(--cobre);font-size:12px}
.tg{background:#efbb3c40;border-radius:6px;padding:1px 6px;font-size:11px}
label.cb{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1px solid var(--linha);border-radius:10px;box-shadow:0 10px 28px #00262029;max-height:290px;overflow:auto;margin-top:4px;display:none}
.sug .op{padding:9px 12px;cursor:pointer;font-size:14px;color:var(--verde);border-bottom:1px solid #c37f361a}
.sug .op small{display:block;font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.sug .op.at{background:#efbb3c2e}.sug .op b{font-weight:700}
.sug .op.nv{color:var(--cobre);font-weight:600;border-bottom:0}.sug .vz{padding:10px 12px;color:var(--muted);font-size:13px}
.stFav{font-size:12px;margin-top:2px;color:var(--muted)}.stFav.ok{color:#15803d}.stFav a,.qm{color:var(--cobre);font-weight:600;text-decoration:underline;cursor:pointer}
.qm{font-size:12px;display:inline-block;margin-top:3px}
.msgAprov{white-space:pre-wrap;text-align:left;background:#efbb3c14;border:1px solid #efbb3c66;border-radius:12px;padding:12px 14px;font-size:13px;color:var(--verde);max-height:260px;overflow:auto;overflow-wrap:anywhere}
.erroCad .usaFav{margin-top:10px;width:auto;padding:10px 16px;font-size:13.5px}
.rodape{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}
@media (max-width:560px){ .form{grid-template-columns:1fr} h1{font-size:24px} }
</style>
</head>

    var eq = (o && o.equipe) || [];
    if (!eq.length) return '<label><span>Seu nome <b>*</b></span><input name="s_nome" required maxlength="120" autocomplete="name"></label>'
      + '<label><span>Seu WhatsApp ou e-mail <b>*</b></span><input name="s_contato" required maxlength="120"></label>';
    return '<label class="full"><span>Seu nome <b>*</b></span><select name="s_usuario" required onchange="var o=this.options[this.selectedIndex];this.form.s_nome.value=this.value?o.text:\'\'"><option value="">Selecione…</option>'
      + eq.map(function(u){ return '<option value="' + esc(u.id) + '">' + esc(u.nome) + '</option>'; }).join('') + '</select><input type="hidden" name="s_nome"></label>';
  }
  function telaPedido(o){
    var ev = (o.eventos||[]).map(function(e){ return '<option value="' + esc(e.id) + '">' + esc(e.nome) + (e.data ? ' · ' + fmt(e.data) : '') + '</option>'; }).join('');
    var cat = (o.categorias||[]).map(function(c){ return '<option>' + esc(c) + '</option>'; }).join('');
    var fr = (o.formas||['PIX','Transferência','Boleto','Dinheiro']).map(function(c){ return '<option>' + esc(c) + '</option>'; }).join('');
    ARQS = [];
    cx.innerHTML = '<a href="#" class="voltar" id="btInicio">← Voltar</a><div class="passos"><span class="on"></span><span></span></div><h1>Novo pagamento</h1><p class="intro">Preencha os dados abaixo. Na próxima tela você confere tudo antes de enviar.</p>'
      + '<form id="fm" novalidate>'
      + '<div class="grupo">Quem está pedindo</div><div class="form">'
      + camposSol(o) + '</div>'
      + '<div class="grupo">Pagamento</div><div class="form">'
      + '<label class="full"><span>Evento <b>*</b></span><select name="eventoId" required><option value="">Selecione…</option>' + ev + '</select></label>'
      + '<label class="full"><span>Favorecido (quem vai receber) <b>*</b></span><input id="busFav" maxlength="150" placeholder="Digite para buscar"><input type="hidden" name="pessoaId"><div class="stFav" id="stFav">Digite o nome e escolha na lista. Se não estiver, cadastre na hora.</div></label>'
      + '<div class="full novo" id="boxNovo" style="display:none"><div class="form">' + CAMPOS_PESSOA + '</div></div>'
      + '<label>Categoria<select name="categoria"><option value="">Não sei / deixar para a equipe</option>' + cat + '</select></label>'
      + '<label><span>Valor (R$) <b>*</b></span><input name="valor" type="number" step="0.01" min="0.01" required inputmode="decimal"></label>'
      + '<label><span>Vencimento <b>*</b></span><input name="vencimento" type="date" required min="' + hoje().slice(0,4) + '-01-01"></label>'
      + '<label>Forma de pagamento<select name="forma">' + fr + '</select></label>'
      + '<label class="full">Descrição<textarea name="descricao" maxlength="500" placeholder="O que está sendo pago"></textarea></label>'
      + '<label class="full">Link (opcional)<input name="link" maxlength="400" placeholder="Se o documento estiver no Google Drive, Dropbox…"></label>'
      + '<div class="full"><label>Anexos: nota fiscal, planilha Excel ou print da conversa</label><div class="arq" id="arqBox">📎 Toque para escolher arquivos<small>PDF, foto/print ou planilha Excel (.xlsx, .xls, .csv) · até 5 arquivos de 10 MB</small></div>'
      + '<input type="file" id="arqIn" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.heic,.heif,.gif,.csv,.xls,.xlsx,.ods,application/pdf,image/*" style="display:none"><ul class="arqs" id="arqLista"></ul></div>'
      + '</div><button class="btn" id="btEnv" type="submit">Continuar</button><div class="msg" id="msg"></div></form><div id="passo2"></div>';
    var hid = document.querySelector('[name=pessoaId]'), box = document.getElementById('boxNovo'), stF = document.getElementById('stFav');
    buscaFav(document.getElementById('busFav'), o.favorecidos || [], function(f, txt, fim){
      hid.value = f ? f.id : txt && fim ? '__novo__' : '';
      stF.className = 'stFav' + (f ? ' ok' : ''); stF.innerHTML = !f && txt && !fim ? '' : f ? '✓ Favorecido cadastrado' + (f.pix ? ' · PIX ' + esc(f.pix) : '') : hid.value ? 'Novo favorecido: preencha o cadastro abaixo.' : 'Digite o nome e escolha na lista. Se não estiver, cadastre na hora.';
      if (hid.value === '__novo__'){ var pn = box.querySelector('[name=p_nome]'); if (pn && (!pn.value || pn.dataset.auto)){ pn.value = txt; pn.dataset.auto = 1; } }
      novoOn(); });
    function novoOn(){ var on = hid.value === '__novo__'; box.style.display = on ? '' : 'none'; box.querySelectorAll('[required]').forEach(function(i){ i.disabled = !on; }); box.querySelectorAll('input,select').forEach(function(i){ i.disabled = !on; }); }
    novoOn(); voltarInicio();
    var inp = document.getElementById('arqIn');
    document.getElementById('arqBox').onclick = function(){ inp.click(); };
    inp.addEventListener('change', function(){ [].slice.call(inp.files).forEach(addArq); inp.value = ''; listarArqs(); });
    document.getElementById('fm').addEventListener('submit', revisar);
  }
  function telaCadastro(){
    cx.innerHTML = '<h1>Cadastro para pagamentos</h1><p class="intro">Preencha seus dados pessoais e bancários. Eles serão usados só para os seus pagamentos.</p>'
      + '<form id="fm" novalidate><div class="form">' + CAMPOS_PESSOA + '</div><button class="btn" id="btEnv" type="submit">Enviar cadastro</button><div class="msg" id="msg"></div></form>';
    document.getElementById('fm').addEventListener('submit', enviar);
  }
  function erro(m){ var e = document.getElementById('msg'); e.textContent = m; e.style.display = 'block'; }
  function pessoaDoForm(d){
    var g = function(k){ return String(d.get('p_' + k) || '').trim(); };
    if (!docValido(g('doc'))) return 'CPF ou CNPJ inválido. Confira os números.';
    if (!g('pix') && !(g('banco') && g('agencia') && g('conta'))) return 'Informe a chave PIX ou os dados completos da conta (banco, agência e conta).';
    return {nome:g('nome'), doc:g('doc').replace(/\D/g,''), funcao:g('funcao'), tel:g('tel'), email:g('email'), pix:g('pix'), banco:g('banco'), tipoConta:g('tipoConta'), agencia:g('agencia'), conta:g('conta')};
  }
  function enviar(ev){
    ev.preventDefault();
    var fm = ev.target; document.getElementById('msg').style.display = 'none';
    if (!fm.reportValidity()) return;
    var d = new FormData(fm), conteudo;
    if (F.tipo === 'cadastro'){
      var p = pessoaDoForm(d); if (typeof p === 'string') return erro(p);
      conteudo = {pessoa: p};
    } else {
      var valor = Number(d.get('valor'));
      if (!(valor > 0)) return erro('Informe um valor maior que zero.');
      conteudo = {solicitante:{nome:String(d.get('s_nome')||'').trim(), contato:String(d.get('s_contato')||'').trim(), usuarioId:String(d.get('s_usuario')||'')},
        eventoId:d.get('eventoId'), categoria:d.get('categoria'), valor:valor, vencimento:d.get('vencimento'), forma:d.get('forma'),
        descricao:String(d.get('descricao')||'').trim(), link:String(d.get('link')||'').trim()};
      if (d.get('pessoaId') === '__novo__'){ var np = pessoaDoForm(d); if (typeof np === 'string') return erro(np); conteudo.novaPessoa = np; }
      else conteudo.pessoaId = d.get('pessoaId');
    }
    var bt = document.getElementById('btEnv'); bt.disabled = true; bt.textContent = 'Enviando…';
    rpc('enviar_formulario', {p_token: TOKEN, p_conteudo: conteudo}).then(function(){
      sucesso(conteudo.pessoa.nome);
    }, function(e){
      bt.disabled = false; bt.textContent = F.tipo === 'cadastro' ? 'Enviar cadastro' : 'Enviar pedido';
      erro(/Failed to fetch|NetworkError|Load failed/i.test(e.message) ? 'Sem conexão. Verifique a internet e tente de novo.' : e.message);
    });
  }
  function montar(){
    var o = F.opcoes || {};
    document.getElementById('hTitulo').textContent = o.empresa || 'Equipe financeira';
    document.getElementById('hSub').textContent = F.tipo === 'cadastro' ? 'Cadastro de fornecedores e prestadores' : 'Pedido de pagamento';
    document.title = (F.tipo === 'cadastro' ? 'Cadastro' : 'Pedido de pagamento') + (o.empresa ? ' · ' + o.empresa : '');
    if (F.tipo === 'cadastro') telaCadastro(); else telaInicio(o);
  }
  if (!TOKEN){ invalido('Link incompleto', 'Peça um novo link para quem te enviou.'); return; }
  rpc('abrir_formulario', {p_token: TOKEN}).then(function(j){
    if (!j){ invalido('Link inválido ou desativado', 'Peça um novo link para quem te enviou.'); return; }
    F = j; montar();
  }, function(){ invalido('Não foi possível abrir', 'Verifique a internet e recarregue a página.'); });
})();
</script>
</body>
</html>
